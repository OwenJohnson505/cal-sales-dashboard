  var equality={};
  (r.equality||[]).forEach(function(q){ equality[q.email+"|"+q.day]=q; });
  // working days (Mon-Sat) in the fetched window, oldest first
  var xdays=[];
  for(var i=PULSE_SPAN;i>=0;i--){
    var d=new Date(Date.now()-i*864e5);
    if(d.getDay()===0) continue;
    xdays.push(d.toISOString().slice(0,10));
  }
  var today=new Date().toISOString().slice(0,10);
  var html='<div class="controls" style="align-items:center">'+
    '<button class="chip" onclick="pShiftDay(-1)">&larr;</button>'+
    '<b style="font-size:16px;min-width:120px;text-align:center">'+pDayLbl(PULSE_DAY)+(PULSE_DAY===today?' <span class="dom">(today)</span>':'')+'</b>'+
    '<button class="chip" onclick="pShiftDay(1)"'+(PULSE_DAY===today?' disabled style="opacity:.4"':'')+'>&rarr;</button>'+
    '<span class="pill"><span style="display:inline-block;width:9px;height:9px;background:'+CALL_COL+';border-radius:2px;margin-right:5px"></span>calls'+
    '<span style="display:inline-block;width:9px;height:9px;background:'+MAIL_COL+';border-radius:2px;margin:0 5px 0 12px"></span>emails</span>'+
    '<span class="pill">counted one-by-one from Aircall and Front &middot; synced hourly &middot; click a dot to jump to that day</span></div>';
  // the day side-by-side: same numbers for everyone, ranked - comparison first
  var dayRows=PULSE_REPS.map(function(em){ var rep=byRep[em]||{}; var d=(rep.rows||{})[PULSE_DAY];
    return {em:em,name:rep.name||em,calls:d?Number(d.calls):0,emails:d?Number(d.emails_front):0,meaningful:d?Number(d.meaningful):0,
      visit:!!visitsBy[em+"|"+PULSE_DAY]}; });
  var active=dayRows.filter(function(x){return x.calls+x.emails>0||x.visit;});
  var teamAvgC=active.length?Math.round(active.reduce(function(a,x){return a+x.calls;},0)/active.length):0;
  var teamAvgE=active.length?Math.round(active.reduce(function(a,x){return a+x.emails;},0)/active.length):0;
  window.__pulseTeamAvg={c:teamAvgC,e:teamAvgE};
  dayRows.sort(function(a,b){return (b.calls+b.emails)-(a.calls+a.emails);});
  html+='<div class="panel flush"><div class="phead"><h3>The day, side by side</h3><span class="hint">team average on '+pDayLbl(PULSE_DAY)+': '+teamAvgC+' calls &middot; '+teamAvgE+' emails</span></div><div class="plist">'+

        '<div class="m'+(x.calls?'':' dim')+'"><b>'+x.calls+'</b><span>calls</span></div>'+
        '<div class="m'+(x.emails?'':' dim')+'"><b>'+x.emails+'</b><span>emails</span></div>'+
        '<div class="m'+(x.meaningful?'':' dim')+'"><b>'+x.meaningful+'</b><span>meaningful</span></div>'+
        '</div></div>';
    }).join("")+'</div></div>';
  var any=false;
  PULSE_REPS.forEach(function(em){
    var rep=byRep[em]; if(!rep) return;
    any=true;
    var d=rep.rows[PULSE_DAY];
    var maxHour=1, hs=hourly[em+"|"+PULSE_DAY]||{};

    // ---- day detail
    var detail;
    if(d && (d.calls>0||d.emails_front>0||d.emails_hs>0)){
      var persist=Number(d.persist_pct);
      var bars="";
      for(var h=7;h<=18;h++){
        var v=hs[h]||{c:0,e:0};
        var hc=v.c>0?Math.max(6,Math.round(52*v.c/maxHour)):2;
        var he=v.e>0?Math.max(6,Math.round(52*v.e/maxHour)):2;
        bars+='<div style="flex:1;min-width:38px;text-align:center">'+
          '<div style="display:flex;gap:3px;align-items:flex-end;justify-content:center;height:70px">'+
            '<div style="width:14px"><div style="font-size:10px;color:'+CALL_COL+';font-weight:600;height:13px">'+(v.c||"")+'</div>'+
              '<div title="'+v.c+' calls" style="height:'+hc+'px;background:'+(v.c?CALL_COL:"#E5E9F0")+';border-radius:3px 3px 0 0"></div></div>'+
            '<div style="width:14px"><div style="font-size:10px;color:'+MAIL_COL+';font-weight:600;height:13px">'+(v.e||"")+'</div>'+
              '<div title="'+v.e+' emails" style="height:'+he+'px;background:'+(v.e?MAIL_COL:"#E5E9F0")+';border-radius:3px 3px 0 0"></div></div>'+
          '</div>'+
          '<div class="dom" style="font-size:10px;margin-top:3px">'+(h<12?h+"am":(h===12?"12pm":(h-12)+"pm"))+'</div></div>';
      }
      var q=equality[em+"|"+PULSE_DAY];
      var qline="";
      if(q && Number(q.emails)>0){
        var verdict, vb, vc, det;
        if(Number(q.with_bodies)<3){ verdict="too few bodies to judge"; vb="#F2F4F8"; vc="#5B6577"; det=""; }
        else if(Number(q.near_dup_pct)>=60){
          verdict="mail-merge"; vb="#FEF2F2"; vc="#8F1D1D";
          det=q.top_subject_n+' of '+q.emails+' were the same template &mdash; &ldquo;'+esc(String(q.top_subject||"").slice(0,60))+'&rdquo; &middot; '+q.near_dup_pct+'% near-identical &middot; one every '+Math.round(q.median_gap_secs)+'s';
        } else if(Number(q.near_dup_pct)>=30){
          verdict="part-templated"; vb="#FEF6E7"; vc="#7A4E07";
          det=q.near_dup_pct+'% near-identical &middot; '+q.tailored+' written individually &middot; '+q.distinct_subjects+' different subjects';
        } else {
          verdict="tailored"; vb="#E7F8F0"; vc="#0A6B4A";
          det=q.distinct_subjects+' different subjects across '+q.emails+' emails &middot; '+q.tailored+' individually written';
        }
        qline='<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px">'+
          '<span class="pill" style="background:'+vb+';color:'+vc+'">'+verdict+'</span>'+
          (det?'<span class="dom">'+det+'</span>':'')+'</div>';
      }
      // this rep's own baseline over the window: is today good FOR THEM?
      var actD=0,sumC=0,sumE=0;
      xdays.forEach(function(dy){ if(dy===PULSE_DAY) return; var row=rep.rows[dy]; if(!row) return;
        var c=Number(row.calls),e=Number(row.emails_front); if(c+e>0){actD++;sumC+=c;sumE+=e;} });
      var avgC=actD?sumC/actD:0, avgE=actD?sumE/actD:0;
      var dPill=function(v,avg,lbl){ if(!avg) return '';
        var pct=Math.round(100*(v-avg)/avg);
        var good=pct>=-10, col=good?['#E7F8F0','#0A6B4A']:['#FEF2F2','#8F1D1D'];
        return '<span class="pill" style="background:'+col[0]+';color:'+col[1]+'" title="their average over the last 3 weeks: '+Math.round(avg)+' '+lbl+'/day">'+lbl+' '+(pct>=0?'+':'')+pct+'% vs their usual</span>'; };
      var vst=visitsBy[em+"|"+PULSE_DAY];
      detail='<div style="padding:14px 20px 12px">'+
        (vst?'<div class="pillrow" style="margin:0 0 8px"><span class="pill" style="background:#F0F6FF;color:#0060C7">site visit: '+esc(vst.map(function(v){return v.company||v.domain||'logged';}).join(', '))+' &middot; fewer calls/emails expected today</span></div>':'')+
        '<div style="display:flex;gap:16px;align-items:baseline;flex-wrap:wrap">'+

          '</span></div>'+
        '<div class="dom" style="margin-top:3px">'+d.calls+' calls ('+d.answer_pct+'% answered, avg '+d.avg_call_secs+'s) &middot; '+d.emails_front+' emails'+(d.emails_hs>0?' ('+d.emails_hs+' in HubSpot)':'')+'</div>'+
        '<div class="pillrow" style="margin:8px 0 0">'+dPill(Number(d.calls),avgC,'calls')+dPill(Number(d.emails_front),avgE,'emails')+
          (window.__pulseTeamAvg&&(window.__pulseTeamAvg.c||window.__pulseTeamAvg.e)?'<span class="pill">team today: '+window.__pulseTeamAvg.c+' calls &middot; '+window.__pulseTeamAvg.e+' emails avg</span>':'')+'</div>'+
        '<div style="display:flex;gap:6px;align-items:flex-end;margin-top:10px;overflow-x:auto">'+bars+'</div>'+
        qline+'</div>';
    } else {
      var vst2=visitsBy[em+"|"+PULSE_DAY];
      detail=vst2
        ? '<div class="empty" style="padding:22px">On a site visit'+(vst2[0]&&(vst2[0].company||vst2[0].domain)?' &mdash; '+esc(vst2[0].company||vst2[0].domain):'')+' &middot; no desk activity expected.</div>'
        : '<div class="empty" style="padding:22px">No recorded activity on '+pDayLbl(PULSE_DAY)+'.</div>';
    }
    // ---- trends
    var rows=rep.rows;
    var SM=7*60, EM=12*60; // start-time chart window: 7am..12pm
    var mkStart=function(get,col,lbl){
      return { col:col, pts:xdays.map(function(dy,i){
        var row=rows[dy]; var v=row?pMins(get(row)):null;
        if(v!=null){ if(v<SM)v=SM; if(v>EM)v=EM; }
        return {i:i,d:dy,v:v,f:v==null?null:1-(v-SM)/(EM-SM),tip:pDayLbl(dy)+" &middot; "+lbl+" "+(v==null?"-":pT(row?get(row):null))};
      })};
    };
    var maxC=1,maxE=1;
    xdays.forEach(function(dy){ var row=rows[dy]; if(!row) return;
      maxC=Math.max(maxC,Number(row.calls)); maxE=Math.max(maxE,Number(row.emails_front)); });
    var mkVol=function(get,mx,col,lbl){
      return { col:col, pts:xdays.map(function(dy,i){
        var row=rows[dy]; var v=row?Number(get(row)):null;
        if(v===0 && !row) v=null;
        return {i:i,d:dy,v:v,f:v==null?null:v/mx,tip:pDayLbl(dy)+" &middot; "+v+" "+lbl};
      })};
    };
    var startChart=pChart("When they start &mdash; first call / first email", xdays,
      [mkStart(function(x){return x.first_call;},CALL_COL,"first call"),
       mkStart(function(x){return x.first_email;},MAIL_COL,"first email")],
      { min:0, max:1, ticks:[{v:1,l:"7am"},{v:.8,l:"8am"},{v:.6,l:"9am"},{v:.4,l:"10am"},{v:.2,l:"11am"},{v:0,l:"12pm"}] });
    var volChart=pChart("How much they do &mdash; calls (left) / emails (right)", xdays,
      [mkVol(function(x){return x.calls;},maxC,CALL_COL,"calls"),
       mkVol(function(x){return x.emails_front;},maxE,MAIL_COL,"emails")],
      { min:0, max:1, ticks:[{v:0,l:"0",col:CALL_COL},{v:.5,l:Math.round(maxC/2),col:CALL_COL},{v:1,l:maxC,col:CALL_COL}],
        rticks:[{f:0,l:"0",col:MAIL_COL},{f:.5,l:Math.round(maxE/2),col:MAIL_COL},{f:1,l:maxE,col:MAIL_COL}] });
    html+='<div class="panel flush"><div class="phead">'+
      '<span class="avi" style="background:'+avColor(rep.name)+'">'+esc(initials(rep.name))+'</span>'+
      '<h3>'+esc(rep.name)+'</h3><span class="hint">'+pDayLbl(PULSE_DAY)+'</span></div>'+
      detail+
      '<div style="padding:6px 20px 16px;border-top:1px solid var(--color-base-200)">'+
        '<div class="dom" style="font-weight:650;color:#3B4457;margin:8px 0 6px">Trend &mdash; last 3 weeks (higher start line = earlier; click a dot to open that day)</div>'+
        '<div style="display:flex;gap:22px;flex-wrap:wrap">'+startChart+volChart+'</div>'+
      '</div></div>';
  });
  if(!any) html+='<div class="empty">No sales activity recorded in this window.</div>';
  el.innerHTML=html;
}

// 13-month spend sparkline; the current partial month is the last, faded bar.
function spendSpark(series){
  if(!series||!series.length) return "";
  var mx=1; series.forEach(function(pt){ mx=Math.max(mx,Number(pt.r)||0); });
  var bars=series.map(function(pt,i){
    var h=Math.max(2,Math.round(20*(Number(pt.r)||0)/mx));
    var last=i===series.length-1;
    return '<span title="'+esc(pt.m)+': \u00a3'+nf(Math.round(pt.r))+'" style="display:inline-block;width:5px;height:'+h+'px;background:'+(last?"#9DB1C9":"#1D1D1F")+';border-radius:1px"></span>';
  }).join("");
  return '<span style="display:inline-flex;gap:2px;align-items:flex-end;height:22px">'+bars+'</span>';
}
function trendPill(x){

  if(t==="growing")  return '<span class="pill" style="background:#E7F8F0;color:#0A6B4A">spend growing \u00a3'+nf(Math.round(x.recent_monthly))+'/mo</span>';
  if(t==="new")      return '<span class="pill" style="background:#F0F6FF;color:#0060C7">new customer</span>';
  if(t==="quiet")    return '<span class="pill">no recent spend</span>';
  return "";
}

function cuMenu(key,ic){
  if(document.getElementById('lmmenu')){ lmMenuClose(); return; }
  var L=window.__cust||[], F=window.__cuF||{}, items=[];
  var mk=function(label,n,on,v){
    return '<div class="lmmi'+(on?' on':'')+'" onclick="cuSet(\''+key+'\',\''+esc(String(v).replace(/'/g,''))+'\')">'+
      '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(label)+'</span>'+
      (n!=null?'<span style="color:var(--faint);font-size:11.5px;margin-left:auto;padding-left:10px">'+n+'</span>':'')+
      (on?'<i class="ph ph-check" style="color:#0071E3;margin-left:6px;flex:none"></i>':'')+'</div>';
  };
  if(key==='rep'){
    var rc={}; L.forEach(function(x){ var f=String(x.salesperson||'').split(' ')[0]; if(f) rc[f]=(rc[f]||0)+1; });
    items.push(mk('Anyone',null,!F.rep,''));
    Object.keys(rc).sort().forEach(function(r){ items.push(mk(r,rc[r],F.rep===r,r)); });
  } else if(key==='pc'){
    var pc={}; L.forEach(function(x){ var a=pcArea(x.postcode); if(a) pc[a]=(pc[a]||0)+1; });
    items.push(mk('Any area',null,!F.pc,''));
    Object.keys(pc).sort().forEach(function(a){ items.push(mk(a,pc[a],F.pc===a,a)); });
  } else if(key==='act'){
    var na=L.filter(function(x){return Number(x.open_actions)>0||x.action_tags;}).length;
    items.push(mk('Any',null,!F.act,''));
    items.push(mk('Has action points',na,F.act==='yes','yes'));
    items.push(mk('No action points',L.length-na,F.act==='no','no'));
  } else if(key==='contact'){
    var now=Date.now();
    var never=L.filter(function(x){return !x.last_contact;}).length;
    var d30=L.filter(function(x){return x.last_contact&&(now-new Date(x.last_contact).getTime())>30*864e5;}).length;
    var d60=L.filter(function(x){return x.last_contact&&(now-new Date(x.last_contact).getTime())>60*864e5;}).length;
    items.push(mk('Any',null,!F.contact,''));
    items.push(mk('Never logged',never,F.contact==='never','never'));
    items.push(mk('Over 30d ago',d30,F.contact==='30','30'));
    items.push(mk('Over 60d ago',d60,F.contact==='60','60'));
    items.push(mk('Within 30d',L.length-never-d30,F.contact==='recent','recent'));
  } else if(key==='trend'){
    var tc={}; L.forEach(function(x){ if(x.trend) tc[x.trend]=(tc[x.trend]||0)+1; });
    items.push(mk('Any',null,!F.trend,''));

function fmtShortD(d){

// shared filter+sort pipeline for the customers table, cards and map
function cuFilteredList(){
  var F=window.__cuF||{}, cs=(window.__cust||[]).slice(), q=window.__custQ||"";
  if(q) cs=cs.filter(function(x){
    return (String(x.customer_name||"")+" "+String(x.domain||"")+" "+String(x.salesperson||"")+" "+String(x.postcode||"")+" "+String(x.action_tags||"")).toLowerCase().indexOf(q)>=0; });
  if(F.rep) cs=cs.filter(function(x){ return String(x.salesperson||'').split(' ')[0]===F.rep; });
  if(F.pc) cs=cs.filter(function(x){ return pcArea(x.postcode)===F.pc; });
  if(F.act==='yes') cs=cs.filter(function(x){ return Number(x.open_actions)>0||x.action_tags; });
  if(F.act==='no') cs=cs.filter(function(x){ return !(Number(x.open_actions)>0||x.action_tags); });
  if(F.contact){
    var now=Date.now();
    cs=cs.filter(function(x){
      var age=x.last_contact?(now-new Date(x.last_contact).getTime())/864e5:null;
      if(F.contact==='never') return age===null;
      if(F.contact==='30') return age!==null&&age>30;
      if(F.contact==='60') return age!==null&&age>60;
      return age!==null&&age<=30;
    });
  }
  if(F.trend==='offpattern') cs=cs.filter(function(x){ return x.off_pattern||x.volume_shift; });
  else if(F.trend) cs=cs.filter(function(x){ return x.trend===F.trend; });
  var srt={
    rep:function(a,b){ return String(a.salesperson||"").localeCompare(String(b.salesperson||"")); },
    name:function(a,b){ return String(a.customer_name||"").localeCompare(String(b.customer_name||"")); },
    pc:function(a,b){ return String(a.postcode||"zz").localeCompare(String(b.postcode||"zz")); },
    contact:function(a,b){ return String(a.last_contact||"").localeCompare(String(b.last_contact||"")); },
    started:function(a,b){ return String(a.first_job||"").localeCompare(String(b.first_job||"")); },
    jobswk:function(a,b){ return (Number(a.jobs_per_week)||0)-(Number(b.jobs_per_week)||0); },
    monthly:function(a,b){ return (Number(a.monthly_shown!=null?a.monthly_shown:a.recent_monthly)||0)-(Number(b.monthly_shown!=null?b.monthly_shown:b.recent_monthly)||0); },
    margin:function(a,b){ return (Number(a.margin_pct)||0)-(Number(b.margin_pct)||0); },
    lifetime:function(a,b){ return (Number(a.revenue_total)||0)-(Number(b.revenue_total)||0); },
    trend:function(a,b){ return String(a.trend||"").localeCompare(String(b.trend||"")); },
  }[window.__cuSort||'lifetime'];
  if(srt) cs.sort(function(a,b){ return srt(a,b)*(window.__cuDir||-1); });
  return cs;
}

function lmTagAdder(el,dom,kind){
  var isAct=kind==='action';

  wrap.innerHTML='<input style="font:inherit;font-size:12px;padding:3px 9px;border-radius:8px;border:1px solid var(--line);background:#fff;width:104px" placeholder="'+(isAct?'action, e.g. visit...':'tag name...')+'">'+

    '<span style="cursor:pointer;color:var(--mut);font-weight:700;font-size:14px;padding:0 3px" title="cancel">&times;</span>';
  el.parentNode.replaceChild(wrap,el);
  wrap.addEventListener('click',function(e){ e.stopPropagation(); });
  var inp=wrap.querySelector('input'); inp.focus();

    if(done) return;

    desk2Post({action:'tag_add',domain:dom,tag:t,kind:kind},function(r){
      if(r&&r.ok){ var l=(window.__lm||[]).filter(function(x){return x.domain===dom;})[0];

  wrap.querySelector('span').onclick=function(e){ e.stopPropagation(); cancel(); };
  inp.onkeydown=function(e){ if(e.key==='Enter'){ e.stopPropagation(); save(); } if(e.key==='Escape') cancel(); };

    document.addEventListener('click',function h(){ document.removeEventListener('click',h); cancel(); });
  },0);

// one filtering + sorting pipeline serving the table, the card view and the
// map - so every view honours exactly the same stacked filters
function lmFiltered(){
  var ls=(window.__lm||[]).slice(), q=window.__lmQ||"";
  if(q) ls=ls.filter(function(x){
    var fx=x.facts||{};
    var hay=(String(x.company||"")+" "+String(x.domain||"")+" "+String(x.rep||"")+" "+String(x.postcode||"")+" "
      +String(x.headline||"")+" "+String(fx.current_supplier||"")+" "+((fx.tags||[]).join(" "))
      +" "+((x.utags||[]).map(function(u){return u.tag;}).join(" "))
      +(x.stage==='opportunity'?' opportunity':'')+(x.dropped_ball?' ball dropped':'')
      +(fx.uses_couriers==='confirmed'?' confirmed courier user':'')).toLowerCase();
    return hay.indexOf(q)>=0; });
  if(window.__lmEng==='none') ls=ls.filter(function(x){ return !x.engagement; });
  else if(window.__lmEng==='no_contact') ls=ls.filter(function(x){ return x.engagement==='no_contact'||x.engagement==='none'; });
  else if(window.__lmEng) ls=ls.filter(function(x){ return x.engagement===window.__lmEng; });
  if(window.__lmOwner) ls=ls.filter(function(x){ return String(x.rep||'').split(' ')[0]===window.__lmOwner; });
  if(window.__lmHstat) ls=ls.filter(function(x){ return window.__lmHstat==='none' ? !x.lead_status : x.lead_status===window.__lmHstat; });
  if(window.__lmPc) ls=ls.filter(function(x){ return pcArea(x.postcode)===window.__lmPc; });
  if(window.__lmTagC){ var tc=lmNorm(window.__lmTagC);
    ls=ls.filter(function(x){ return lmAllTags(x).c.some(function(t){return lmNorm(t)===tc;}); }); }
  if(window.__lmTagA){ var ta=lmNorm(window.__lmTagA);
    ls=ls.filter(function(x){ return lmAllTags(x).a.some(function(t){return lmNorm(t)===ta;}); }); }
  var srt=window.__lmSort||"recent", dir=window.__lmDir||-1;
  var cmp={
    calls:function(a,b){ return (Number(a.calls)||0)-(Number(b.calls)||0); },
    emails:function(a,b){ return (Number(a.emails)||0)-(Number(b.emails)||0); },
    notes:function(a,b){ return (Number(a.notes)||0)-(Number(b.notes)||0); },
    company:function(a,b){ return String(a.company||a.domain||"").localeCompare(String(b.company||b.domain||"")); },
    owner:function(a,b){ return String(a.rep||"").localeCompare(String(b.rep||"")); },
    hstat:function(a,b){ return String(a.lead_status||"zz").localeCompare(String(b.lead_status||"zz")); },
    pc:function(a,b){ return String(a.postcode||"zz").localeCompare(String(b.postcode||"zz")); },
    status:function(a,b){ var o={positive:1,mixed:2,stale:3,negative:4}; return (o[a.engagement]||9)-(o[b.engagement]||9); },
    recent:function(a,b){ return new Date(a.last_touch||0)-new Date(b.last_touch||0); }
  }[srt]||function(){return 0;};
  ls.sort(function(a,b){ return dir*cmp(a,b); });
  return ls;
}

// "Sat 15 Nov" reads faster than 2026-11-15; today and tomorrow get named
function fmtDue(d,overdue){
  var M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var W=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var today=new Date(); var iso=d.toISOString().slice(0,10);
  if(iso===today.toISOString().slice(0,10)) return overdue?"earlier today":"today";
  if(iso===new Date(Date.now()+864e5).toISOString().slice(0,10)) return "tomorrow";
  return (overdue?"overdue &middot; ":"")+W[d.getDay()]+" "+d.getDate()+" "+M[d.getMonth()];
}

function duePick(b,spec){

// ---- Calendar: what I did each day -----------------------------------------
// meeting times render in the browser's clock (the team is all UK)
function meetHM(iso){

function loadCalendar(){
  var el=document.getElementById("calboard"); if(!el) return;
  el.innerHTML=spinner();
  var m=(window.__calMonth)||new Date().toISOString().slice(0,7);
  var first=new Date(m+"-01");
  var lastIso=m+"-"+("0"+new Date(first.getFullYear(),first.getMonth()+1,0).getDate()).slice(-2);
  // four sources, one month: activity (what happened), HubSpot tasks (what's
  // due), site visits (where you're going), and the Outlook/Teams calendar
  // graph-sync pulls hourly - Front has no calendar API; its calendar IS the
  // Office 365 one.
  var got={}, need=5;
  function fin(k,r){ got[k]=r; if(--need===0) renderCalendar(el,m,got); }
  deskPost({action:"calendar",month:m},function(r){ fin("act",r); });
  deskPost({action:"hstasks"},function(r){ fin("tasks",r); });
  desk2Post({action:"visits",from:m+"-01",to:lastIso},function(r){ fin("visits",r); });
  desk2Post({action:"meetings",from:m+"-01",to:lastIso},function(r){ fin("meets",r); });
  desk2Post({action:"absences",from:m+"-01",to:lastIso},function(r){ fin("abs",r); });

function renderCalendar(el,m,got){
  var r=got.act;
  if(!r||!r.ok){ el.innerHTML='<div class="empty">'+esc((r&&r.error)||"Could not load the calendar.")+'</div>'; return; }
  var days=(r.days||[]); window.__calDays=days;
  var by={}; for(var i=0;i<days.length;i++) by[days[i].day]=days[i];
  // tasks by due day (HubSpot due is epoch ms), visits by date
  var tBy={}, vBy={};
  ((got.tasks&&got.tasks.tasks)||[]).forEach(function(t){
    var d=t.due?new Date(Number(t.due)||t.due):null; if(!d||isNaN(d)) return;
    var iso=localISO(d); (tBy[iso]=tBy[iso]||[]).push(t);
  });
  ((got.visits&&got.visits.visits)||[]).forEach(function(v){
    var iso=String(v.visit_date||"").slice(0,10); if(!iso) return;
    (vBy[iso]=vBy[iso]||[]).push(v);
  });
  // meetings by local day; all-day rows land on their calendar date, not the
  // UTC-midnight rollover
  var mBy={};
  ((got.meets&&got.meets.meetings)||[]).forEach(function(ev){
    var iso=ev.is_all_day?String(ev.starts_at||"").slice(0,10):(ev.starts_at?localISO(new Date(ev.starts_at)):"");
    if(!iso) return; (mBy[iso]=mBy[iso]||[]).push(ev);
  });
  // absences span date ranges - burst them into per-day entries clipped to
  // this month, so holiday/sick shows on every day it covers
  var aBy={};
  ((got.abs&&got.abs.absences)||[]).forEach(function(a){
    var d0=new Date(a.start_date+"T12:00:00"), d1=new Date(a.end_date+"T12:00:00");
    for(var d=new Date(d0); d<=d1; d.setDate(d.getDate()+1)){
      var iso=localISO(d);

    }

  window.__calTasks=tBy; window.__calVisits=vBy; window.__calMeets=mBy; window.__calAbs=aBy;
  var MN=["January","February","March","April","May","June","July","August","September","October","November","December"];
  var first=new Date(m+"-01"), year=first.getFullYear(), mo=first.getMonth();
  var startDow=(first.getDay()+6)%7; // Monday-first week, UK
  var dim=new Date(year,mo+1,0).getDate();
  var todayIso=localISO(new Date());
  var maxT=1; for(var j=0;j<days.length;j++) maxT=Math.max(maxT,(Number(days[j].calls)||0)+(Number(days[j].emails)||0));
  var cells='';
  for(var b=0;b<startDow;b++) cells+='<div class="calcell blank"></div>';
  for(var dd=1;dd<=dim;dd++){
    var iso=m+"-"+("0"+dd).slice(-2);
    var d=by[iso]; var tot=d?((Number(d.calls)||0)+(Number(d.emails)||0)):0;
    var future=iso>todayIso;
    // what's on: meetings first (time-fixed), then tasks (overdue reads red),
    // then visits, max 3 lines
    var evs=[];
    ((window.__calAbs||{})[iso]||[]).forEach(function(a){
      var sick=/sick/i.test(a.leave_type||'');
      evs.push('<span class="calev off'+(sick?' sick':'')+'" title="'+esc((a.user_name||'')+' - '+(a.leave_type||'off')+' ('+a.start_date+' to '+a.end_date+')')+'">'+(sick?'&#129301; ':'&#127958; ')+esc(a.leave_type||'Off')+'</span>');
    });
    ((window.__calMeets||{})[iso]||[]).forEach(function(ev){
      var tm=ev.is_all_day?'':'<b>'+meetHM(ev.starts_at)+'</b> ';
      evs.push('<span class="calev meet" title="'+esc(ev.subject||'meeting')+'">'+tm+esc(ev.subject||'meeting')+'</span>');
    });
    (tBy[iso]||[]).forEach(function(t){ evs.push('<span class="calev task'+(iso<todayIso?' over':'')+'" title="'+esc(t.subject||'task')+'">'+esc(t.subject||'task')+'</span>'); });
    (vBy[iso]||[]).forEach(function(v){ evs.push('<span class="calev visit" title="site visit: '+esc(custName(v.company||v.domain||''))+'">'+esc(custName(v.company||v.domain||'visit'))+'</span>'); });
    var extra=evs.length-3;

    cells+='<div class="calcell'+(iso===todayIso?' today':'')+(future?' future':'')+'" id="cal-'+iso+'" onclick="calSelect(\''+iso+'\')">'+
      '<span class="dn">'+dd+'</span>'+evs.join('')+
      (!future&&tot?('<span class="prod"><span class="cb"><i style="width:'+Math.max(8,Math.round(100*tot/maxT))+'%"></i></span>'+
            '<span class="cnt">'+(d.calls||0)+' calls &middot; '+(d.emails||0)+' em</span></span>')

    '<span class="callegend" style="margin-left:18px">'+
      '<span><span class="bdot" style="background:#0F6B62"></span> Off work</span>'+
      '<span><span class="bdot" style="background:#5B21B6"></span> Meeting</span>'+
      '<span><span class="bdot" style="background:#0060C7"></span> HubSpot task due</span>'+
      '<span><span class="bdot" style="background:#0A6B4A"></span> Site visit</span>'+
      '<span>bar = calls + emails that day</span></span>'+
    '<span style="margin-left:auto"></span>'+
    '<button class="chip" onclick="calShift(-1)" title="Previous month">&#8249;</button>'+
    '<button class="chip" onclick="calShift(1)" title="Next month">&#8250;</button></div>'+
    '<div class="calwk"><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div></div>'+
    '<div class="calgrid">'+cells+'</div><div id="caldetail"></div>';
  // land on today in the current month, else the busiest recent day

  var pick=null;
  for(var k=days.length-1;k>=0;k--){ var x=days[k];
    if(((Number(x.calls)||0)+(Number(x.emails)||0))>0 && (!pick||x.day>pick)) pick=x.day; }

            (c.email?'<a class="btn btn-soft btn-sm" href="mailto:'+esc(c.email)+'">Email</a>':'<span class="nonum">no email</span>')+
            '</div></div>';
        }).join("")
      : '<div class="empty" style="padding:16px">No named contact found &mdash; ask the switchboard for the transport or logistics manager.</div>';

    // The story so far: the AI's read of the REAL transcripts and emails -
    // rating, how it is going, what happened, what to do next.
    var st=r.state||{}, ins=r.insight;
    var known='';
    if(ins){
      var pb={high:['#E7F8F0','#0A6B4A','High potential'],medium:['#F0F6FF','#0060C7','Medium potential'],low:['#F2F4F8','#5B6577','Low potential']}[ins.potential]||null;
      var eb={positive:['#E7F8F0','#0A6B4A'],mixed:['#FEF6E7','#7A4E07'],stale:['#F2F4F8','#5B6577'],negative:['#FEF2F2','#8F1D1D'],none:['#F2F4F8','#98A2B3']}[ins.engagement]||['#F2F4F8','#5B6577'];
      known='<div class="pillrow" style="margin:0 0 10px">'+
          (pb?'<span class="pill" style="background:'+pb[0]+';color:'+pb[1]+'">'+pb[2]+'</span>':'')+
          '<span class="pill" style="background:'+eb[0]+';color:'+eb[1]+'">'+esc(ins.engagement)+' engagement</span>'+
          (ins.dropped_ball?'<span class="pill" style="background:#FEF2F2;color:#8F1D1D">Ball dropped</span>':'')+
        '</div>'+
        '<p>'+esc(ins.story||ins.headline||'')+'</p>'+
        (function(){
          // hard facts extracted from the conversations - only what was said
          var fx=ins.facts; if(!fx) return '';
          var fr=function(l,v){ return v?'<div class="evid"><b>'+l+'</b><span class="src">'+esc(String(v))+'</span></div>':''; };
          var inner=fr('Do they use same-day couriers?', fx.uses_couriers&&fx.uses_couriers!=='unknown'?fx.uses_couriers:'')+
            fr('How often', fx.usage_frequency)+
            fr('Current supplier', fx.current_supplier)+
            fr('People named', fx.key_people)+
            ((fx.other||[]).map(function(o){ return fr('Also said', o); }).join(''));
          return inner?'<div class="msec" style="margin:12px 0 4px">Said in the conversations <span class="pv fact" style="vertical-align:1px">their words</span></div>'+inner:'';
        })()+
        (ins.next_step?'<div class="nextact" style="padding:13px 16px;margin-top:4px"><div><div class="lbl">Next step</div><div class="dt" style="font-size:13.5px">'+esc(ins.next_step)+'</div></div></div>':'');
    } else if(r.insight_pending && st && (Number(st.calls||0)+Number(st.emails||0))>=2){
      // an assessment only actually starts when there is engagement to read
      known='<p class="sub" style="margin:0"><span class="loading loading-spinner loading-xs"></span> Assessing this account now &mdash; the website check and engagement read take about half a minute. Reopen shortly.</p>';
    } else if(!ins && (!st || (Number(st.calls||0)+Number(st.emails||0))<2)){
      known='<p class="sub" style="margin:0">Fresh account &mdash; no calls or emails on record yet. The story starts after the first contact; the brief above is your way in.</p>';
    } else if(st.state){
      known='<p><b>'+esc(st.state)+'</b>'+(st.days_since!=null?' &middot; last touch '+st.days_since+'d ago':'')+'</p>'+
        (st.last_call_summary?'<p class="sub" style="margin:0">&ldquo;'+esc(String(st.last_call_summary).slice(0,300))+'&rdquo;</p>':'');
    }

    // The underlying evidence folds in beneath the synthesis, so the AI's read
    // can always be checked against what was actually said and written.
    var ev=(ins&&ins.evidence)||{};
    var evCalls=(ev.calls||[]).map(function(c){
      return '<div class="evid"><b>'+esc(String(c["when"]||""))+' &middot; '+esc(c.agent||"?")+' &middot; '+esc(String(c.seconds||0))+'s</b>'+
        '<span class="src">'+esc(String(c.summary||"(no transcript)").slice(0,260))+'</span></div>';
    }).join("");
    var evMails=(r.threads||[]).map(function(f){
      return '<div class="evid"><b>'+esc(f.subject||"(no subject)")+'</b> <span class="faint">'+esc(f.rep||"")+' &middot; in '+esc(String(f.in_count))+' / out '+esc(String(f.out_count))+'</span>'+
        (f.blurb?'<span class="src">'+esc(String(f.blurb).slice(0,220))+'</span>':'')+
        (f.conv_id?'<span class="src"><a target="_blank" rel="noopener" href="https://app.frontapp.com/open/'+esc(f.conv_id)+'">Open thread in Front</a></span>':'')+
        '</div>';
    }).join("");
    if(evCalls) known+='<div class="msec" style="margin:12px 0 4px">Calls &mdash; what was actually said</div>'+evCalls;
    if(evMails) known+='<div class="msec" style="margin:12px 0 4px">Email threads</div>'+evMails;

    var hist=(r.attempts||[]).length
      ? '<div class="feed">'+(r.attempts||[]).map(function(a){
          return '<div><span class="k">'+esc(String(a.outcome).replace(/_/g," ").toUpperCase().slice(0,7))+'</span>'+
            '<span class="d">'+esc(a.note||"&mdash;")+' <span class="faint">'+esc(String(a.created_at).slice(0,10))+(a.staff_email?' &middot; '+esc(a.staff_email.split("@")[0]):'')+'</span></span></div>';
        }).join("")+'</div>'
      : '<div class="empty" style="padding:16px">No call logged yet.</div>';

    var pts=(b&&b.approach&&b.approach.talking_points)||[];
    var comp=(b&&b.company)||null;
    var news=(b&&b.news)||[];
    var newsHtml=news.length?(
      news.slice(0,3).map(function(n){
        return '<div class="evid"><b>'+esc(n.headline||'')+'</b><span class="src">'+esc(n.source||'')+
          (n.date?' &middot; '+esc(n.date):'')+
          (n.gist?'<br>'+esc(n.gist):'')+
          (n.url?'<br><a target="_blank" rel="noopener" href="'+esc(n.url)+'" style="font-weight:600">source &#8599;</a>':'')+'</span></div>';
      }).join('')):'';

    // Companies House first: the overdue-accounts flag feeds the warnings
    // Companies House shrinks to one quiet line of registered facts under the
    // header, linked to the register itself - not a section of its own
    var ch=r.companies_house||null;

    // Owen's call: no coaching blocks. Warnings, objections and "avoid" are
    // gone - reps know how businesses work. Facts only, they do the thinking.
    var rel=(b&&b.relationship)||null;

    var numsBody=(phone||dials.length)?(
      (phone?'<div class="actrow" style="padding:7px 0"><div class="co"><b>'+esc(phone)+'</b><div class="dom">Main number &middot; from '+esc(phoneSrc||'company record')+'</div></div><div class="rt"><a class="btn btn-soft btn-sm tel" href="tel:'+esc(phone)+'">Call</a></div></div>':'')+
      dials.filter(function(s){return s.number!==phone;}).slice(0,4).map(function(s){
        return '<div class="actrow" style="padding:7px 0"><div class="co"><b>'+esc(s.display||s.number)+'</b>'+
          '<div class="dom">'+esc(s.label||(s.phone_class==='mobile'?'Mobile they list publicly':'Listed on their site'))+'</div>'+
          '<div class="seg" style="color:var(--faint)">from <a target="_blank" rel="noopener" href="'+esc(s.source_url)+'">'+esc(hostOf(s.source_url))+' &#8599;</a></div></div>'+
          '<div class="rt"><a class="btn btn-soft btn-sm tel" href="tel:'+esc(s.number)+'">Call</a></div></div>';
      }).join('')):'';

    // the raw HubSpot record: rep notes, logged calls (with transcript where
    // we hold one) and logged emails - verbatim, so the AI's read is checkable
    var hsa=r.hs_activity||[];
    var stripT=function(s){ return String(s||'').replace(/<style[\s\S]*?<\/style>/gi,' ').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/\s+/g,' ').trim(); };
    var hsaBody=hsa.length?hsa.map(function(a){
      var lbl={calls:'Call',emails:'Email',notes:'Note',meetings:'Meeting'}[a.type]||a.type;
      var bodyTxt=stripT(a.body);
      return '<div class="evid"><b>'+esc(String(a.occurred_at||'').slice(0,10))+' &middot; '+esc(lbl)+(a.direction?' &middot; '+esc(a.direction):'')+(a.subject?' &middot; '+esc(String(a.subject).slice(0,80)):'')+'</b>'+
        (a.transcript_summary?'<span class="src"><b style="color:var(--ink2)">Summary:</b> '+esc(String(a.transcript_summary).slice(0,600))+'</span>':'')+
        (a.transcript_text?'<details style="margin-top:4px"><summary style="cursor:pointer;font-size:12px;color:var(--mut)">Full transcript</summary><div style="white-space:pre-wrap;font-size:12.5px;color:var(--ink2);line-height:1.55;margin-top:6px;max-height:320px;overflow-y:auto">'+esc(a.transcript_text)+'</div></details>':'')+
        (a.type==='calls'&&!a.transcript_text&&a.aircall_id?'<span class="src" style="color:var(--faint)">transcript queued &mdash; transcribing older calls in the background</span>':'')+
        (bodyTxt?'<span class="src">'+esc(bodyTxt.slice(0,400))+'</span>':'')+'</div>';
    }).join(''):'';
    var hsaCounts={};
    hsa.forEach(function(a){ hsaCounts[a.type]=(hsaCounts[a.type]||0)+1; });
    var hsaPrev=Object.keys(hsaCounts).map(function(k){ return hsaCounts[k]+' '+k; }).join(' &middot; ')||'';

    var reached=(r.contacts||[]).filter(function(c){return c.spoken_to||c.emailed;}).length;
    var consPrev=((r.contacts||[]).length?((r.contacts||[]).length+' named &middot; '+reached+' reached'):'none found yet')
      +(overseasN?' &middot; '+overseasN+' overseas hidden':'');
    var lastAt=(r.attempts||[])[0];
    var histPrev=lastAt?(esc(String(lastAt.outcome).replace(/_/g,' '))+' &middot; '+esc(String(lastAt.created_at).slice(0,10))):'no calls logged yet';
    var storyPrev=ins?esc(String(ins.headline||ins.story||'').slice(0,90))
      :(r.insight_pending&&st&&(Number(st.calls||0)+Number(st.emails||0))>=2?'assessing now &mdash; reopen shortly'
      :((!st||(Number(st.calls||0)+Number(st.emails||0))<2)?'fresh account &mdash; no contact yet':esc(st.state||'')));

    // The briefing card is facts the header does not already carry: a real
    // buying signal (about THEM, never our proximity) and every contact.
    // "Why them" is gone - the score, segment and description already say it.
    // a buying signal is evidence about THEM (growth, orders, sites, hiring,
    // delivery problems) - anything about Cal's own service or proximity is
    // pitch, not signal, and shows nothing rather than filler
    var junkSignal=/\b(miles?|minutes?|half an hour|proximity|close by|nearby|warrington|\bcal\b|cal's|point.to.point|chain of custody|no hub|sortation|one vehicle|dedicated vans?|same.day (collection|cover|capacity) can)\b/i;
    var intentShort='';
    for(var pi=0;pi<pts.length;pi++){
      var cand=String(pts[pi].point||'')+(pts[pi].why_it_lands?' - '+String(pts[pi].why_it_lands):'');
      if(cand && !junkSignal.test(cand)){ intentShort=cand; break; }
    }
    // contacts live ONCE, in the readable row format on the Contacts tab
    var b4items=[];
    if(intentShort) b4items.push(['Buying signals',intentShort,'<span class="pv inf">AI inferred</span>']);
    // where they are + registered facts + the sources, quiet, under the header
    var locs=(comp&&comp.uk_locations)||[];
    var chUrl=(ch&&ch.company_number)?('https://find-and-update.company-information.service.gov.uk/company/'+encodeURIComponent(ch.company_number)):null;
    var metaHtml=
      (locs.length?'<div class="pillrow" style="margin:8px 0 0">'+locs.slice(0,6).map(function(l){return '<span class="pill">'+esc(l)+'</span>';}).join('')+'</div>':'')+
      '<div class="dom" style="margin:9px 0 2px;display:flex;gap:14px;flex-wrap:wrap;align-items:center">'+
        '<a target="_blank" rel="noopener" href="https://'+esc(dom)+'" style="font-weight:600">Website &#8599;</a>'+
        (chUrl?'<a target="_blank" rel="noopener" href="'+chUrl+'" style="font-weight:600">Companies House &#8599;</a>':'')+
        '<a target="_blank" rel="noopener" href="https://web.archive.org/web/2024*/'+esc(dom)+'" style="font-weight:600">Site history &#8599;</a>'+
        (ch&&ch.company_number?'<span>Company no '+esc(ch.company_number)+(ch.incorporated?' &middot; since '+esc(String(ch.incorporated).slice(0,4)):'')+'</span>':'')+
        (ch&&(ch.address||ch.postcode)?'<span>Registered: '+esc([ch.address,ch.postcode].filter(Boolean).join(', '))+'</span>':'')+
      '</div>';
    var brief4=b4items.length?('<div style="background:var(--color-base-200);border-radius:12px;padding:3px 15px;margin:10px 0 4px">'+
      b4items.map(function(it,i){
        return '<div style="padding:10px 0;'+(i?'border-top:1px solid rgba(0,0,0,.05)':'')+'">'+
          '<div style="font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);margin-bottom:3px">'+it[0]+' '+it[2]+'</div>'+
          '<div style="font-size:13.5px;line-height:1.55;color:var(--ink)">'+esc(String(it[1]).slice(0,260))+'</div></div>';
      }).join('')+'</div>'):'';

    // who owns it and when we last TRIED sit NEXT TO THE NAME. Every record
    // counts as contact - local calls/emails, the HubSpot log, HubSpot's own
    // engagement stamp. "Never contacted" only when there is truly nothing;
    // attempts that never got through say "no progress", not "never".
    var M2=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    var lastAny=st&&st.last_touch?new Date(st.last_touch):null;
    var nowD=new Date();
    if(r.hs_activity&&r.hs_activity.length){
      var ha=new Date(r.hs_activity[0].occurred_at);
      if(ha<=nowD&&(!lastAny||ha>lastAny)) lastAny=ha;
    }
    if(r.hs_record&&r.hs_record.last_engagement){
      var he=new Date(r.hs_record.last_engagement);
      if(he<=nowD&&(!lastAny||he>lastAny)) lastAny=he;
    }
    var spoke=!!(st&&(st.last_spoke_at||(Number(st.calls_answered)||0)>0));
    var lcPill;
    if(lastAny){
      var dAgo=Math.max(0,Math.floor((nowD-lastAny)/864e5));
      lcPill=(spoke?'last contact ':'no progress &middot; last try ')+lastAny.getDate()+' '+M2[lastAny.getMonth()]+
        (lastAny.getFullYear()!==nowD.getFullYear()?' '+lastAny.getFullYear():'')+
        (dAgo===0?' &middot; today':' &middot; '+dAgo+'d ago');
    } else lcPill='never contacted';
    if(head) head.innerHTML=esc(t.name||dom)+
      (r.hs_record&&r.hs_record.owner_name?' <span class="pill" style="background:#F0F6FF;color:#0060C7;font-size:11.5px;vertical-align:2px">'+esc(r.hs_record.owner_name)+'</span>':'')+
      ' <span class="pill" style="font-size:11.5px;vertical-align:2px'+(lastAny?'':';color:var(--faint)')+'">'+lcPill+'</span>';

    body.innerHTML=warn+formAlert+
      '<div class="actrow" style="border:0;padding:0 0 2px">'+
        scoreRing(v.fit_score,"md")+
        '<div class="co"><b>'+esc(v.segment||"Unclassified")+'</b><div class="dom">'+esc(dom)+(rel&&rel.status?' &middot; '+esc(rel.status):'')+'</div></div>'+
        '<div class="rt" style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:0 0 auto;max-width:45%">'+
          (phone?'<a class="btn btn-primary tel" href="tel:'+esc(phone)+'">Call '+esc(phone)+'</a><span class="faint" style="font-size:11px;text-align:right;white-space:normal">number from '+esc(phoneSrc||'company record')+'</span>':'<span class="nonum">no number on file</span>')+
        '</div>'+
      '</div>'+
      (comp&&comp.what_they_do?'<p style="margin:6px 0 2px;font-size:14px;color:var(--ink2);line-height:1.55">'+esc(comp.what_they_do)+'</p>':'')+
      metaHtml+
      // Four focused pages: Call (signal + numbers), Company (people + terms),
      // News (the press, with sources), History (what has actually happened).
      '<div class="mtabs">'+
        '<button class="on" onclick="mTab(this,\'call\')">Call</button>'+
        '<button onclick="mTab(this,\'co\')">Contacts</button>'+
        '<button onclick="mTab(this,\'news\')">News</button>'+
        '<button onclick="mTab(this,\'hist\')">History</button></div>'+
      '<div class="mtab on" data-t="call">'+
        brief4+
        (numsBody?'<h3 class="msec">Numbers <span class="pv fact">public records &amp; their site</span></h3>'+numsBody:'')+
      '</div>'+
      '<div class="mtab" data-t="co">'+
      sec('Contacts',fact('Apollo & our records'),consPrev,cons,true)+
      '</div>'+
      '<div class="mtab" data-t="news">'+
      (newsHtml||'<div class="empty" style="padding:26px 12px">No press coverage found in the research run.</div>')+
      '</div>'+
      '<div class="mtab" data-t="hist">'+
      (r.hs_record?'<div class="evid" style="padding:4px 0 12px"><b>On HubSpot'+(r.hs_record.owner_name?' &middot; owned by '+esc(r.hs_record.owner_name):' &middot; no owner set')+'</b>'+
        ((r.hs_record.lifecyclestage||r.hs_record.lead_status)?'<span class="src">'+esc([r.hs_record.lifecyclestage,r.hs_record.lead_status].filter(Boolean).join(' · '))+'</span>':'')+'</div>':'')+
      formSec+
      sec('The story so far',INF,storyPrev,known,true)+
      sec('HubSpot activity',fact('HubSpot log'),hsaPrev,hsaBody)+
      sec('Call history',fact('our call log'),histPrev,hist)+
      '<h3 class="msec">Visits</h3>'+
      '<div class="outrow">'+
        '<button class="chip" onclick="planVisit(\''+esc(dom)+'\')">Plan a visit &mdash; who else is nearby?</button>'+
        '<button class="chip" onclick="logVisitForm(\''+esc(dom)+'\')">Log a visit</button>'+
      '</div><div id="visitbox"></div>'+
      '</div>'+
      '<h3 class="msec">Log the call</h3>'+
      '<p class="sub" style="margin:-4px 0 10px">On Aircall, calls record themselves &mdash; only tap if the outcome needs saying. No Aircall line? Write your notes below and tap the outcome: the call AND the notes land in HubSpot under your name.</p>'+
      '<div class="outrow">'+
        '<button class="btn btn-primary btn-sm" onclick="logCall(\''+esc(dom)+'\',\'connected\')">Got through</button>'+
        '<button class="btn btn-primary btn-sm" onclick="logCall(\''+esc(dom)+'\',\'opportunity\')">Opportunity</button>'+
        '<button class="btn btn-soft btn-sm" onclick="logCall(\''+esc(dom)+'\',\'callback\')">Call back tomorrow</button>'+
      '</div>'+
      '<div class="outrow sec">'+
        ["gatekeeper","voicemail","no_answer","wrong_number"].map(function(o){
          return '<button class="chip" onclick="logCall(\''+esc(dom)+'\',\''+o+'\')">'+esc(o.replace(/_/g," "))+'</button>';
        }).join("")+
        ["not_interested","do_not_call"].map(function(o){
          return '<button class="chip danger" onclick="logCall(\''+esc(dom)+'\',\''+o+'\')">'+esc(o.replace(/_/g," "))+'</button>';
        }).join("")+
      '</div>'+
      '<textarea id="lognote" class="textarea wfull" rows="3" style="font-size:14px;line-height:1.5" placeholder="Call notes - who you spoke to, what was said, the next step"></textarea>'+
      '<div class="outrow" style="margin-top:8px"><button class="chip" onclick="logNote(\''+esc(dom)+'\',this)">Save as a note only &mdash; no call outcome</button></div>'+
      '<div id="logmsg" class="foot"></div>';
  });
}
// a standalone note (email chased, info gathered, anything worth recording)
// written straight onto the HubSpot company - no call outcome attached
function logNote(dom,btn){
  var note=(val("lognote")||"").trim();
  var msg=document.getElementById("logmsg");
  if(!note){ if(msg) msg.textContent="Write the note first."; return; }
  if(btn) btn.disabled=true;
  if(msg) msg.textContent="Saving note...";
  deskPost({action:"log_note",domain:dom,note:note},function(r){
    if(btn) btn.disabled=false;
    if(r&&r.ok){
      if(msg) msg.textContent="Note saved to HubSpot.";
      var t=document.getElementById("lognote"); if(t) t.value="";
    } else if(msg) msg.textContent="Could not save: "+((r&&r.error)||"error");
  });
}
function logCall(dom,outcome){
  var note=(val("lognote")||"").trim();
  var msg=document.getElementById("logmsg"); if(msg) msg.textContent="Saving...";
  var payload={action:"log",domain:dom,outcome:outcome,note:note||null};
  if(outcome==="callback") payload.callback_at=new Date(Date.now()+864e5).toISOString();
  deskPost(payload,function(r){
    if(r&&r.ok){
      // Close, tell the rep what happens next, and put them on the next lead.
      closeModal();
      var todayVisible=document.getElementById("view-today") && document.getElementById("view-today").style.display!=="none";
      if(todayVisible){ loadToday(); setTimeout(function(){ if(r.next) showNext(r.next); },600); }
      else loadCallList();
    } else if(msg) msg.textContent="Could not log that: "+((r&&r.error)||"error");
  });
}
function loadTeam(){
  var el=document.getElementById("teamboard"); if(!el) return;
  el.innerHTML=spinner();
  deskPost({action:"scoreboard"},function(r){
    // Everyone sees the leaderboard; only head/admin get the management detail.
    if(!r||!r.ok){ el.innerHTML=""; teamLeaderboard(el); loadApprovals(el); return; }
    var rows=(r.rows||[]).filter(function(x){return x.role!=="ops";});
    var broken=rows.filter(function(x){return !x.logging_ok;});
    var sla=rows.reduce(function(a,x){return a+Number(x.sla_breaches||0);},0);
    var totOpp=rows.reduce(function(a,x){return a+Number(x.opportunities||0);},0);
    // their own commission, computed live from the same schemes Settings manages
  var mc=window.__myComm, commHtml='';
  if(mc&&mc.scheme){
    var tot=0, acc=0; (mc.detail||[]).forEach(function(c){ tot+=Number(c.commission)||0; if(c.still_accruing) acc++; });
    var top=(mc.detail||[])[0], nb=mc.new_business&&mc.new_business.last12?mc.new_business:null;

    '<div id="view-accounts" class="view" style="display:none"><div class="page-head"><div><div class="t">All accounts</div><p class="sub">Every real company we know of, however it got here. Vendors, communities and one-off addresses are filtered out.</p></div></div><div id="acctboard">'+spinner()+'</div></div>'+
    '<div id="view-calllist" class="view" style="display:none"><div class="page-head"><div><div class="t">Cold list</div><p class="sub">Ranked by fit and by whether we can actually reach them. Log the outcome and a callback becomes a HubSpot task, so it reaches you in Front and on your phone.</p></div></div><div id="clboard">'+spinner()+'</div></div>'+
    '<div id="view-team" class="view" style="display:none"><div class="page-head"><div><div class="t">Scoreboard</div><p class="sub">Outcomes first, activity to explain them &mdash; plus whose logging is broken, because the numbers are only as good as what reaches the CRM.</p></div></div><div id="teamboard">'+spinner()+'</div></div>'+
    '<div id="view-settings" class="view" style="display:none"><div class="page-head"><div><div class="t">Settings</div><p class="sub">Commission structures per person, and what each has earned from their customers&rsquo; first year of trading. Only you see this.</p></div></div><div id="settingsboard">'+spinner()+'</div></div>'+
    '<div id="view-admin" class="view" style="display:none"><div class="page-head"><div><div class="t">Admin</div><p class="sub">Connector usage, cost estimates and the audit trail across every system. Only you can see this.</p></div></div><div id="adminboard">'+spinner()+'</div></div>'+
    '<div id="view-projects" class="view" style="display:none"><div class="page-head"><div><div class="t">Projects</div><p class="sub">Campaign work-lists over the account base &mdash; lapsed traders, occasional spenders, companies in trouble. Snapshot the cohort, work through it together, every account checked off.</p></div></div><div id="projboard">'+spinner()+'</div></div>'+
    '<div id="view-monitor" class="view" style="display:none"><div class="page-head"><div><div class="t">Monitor</div><p class="sub">Deliverability, campaign performance and the lead-to-contact funnel.</p></div></div><div id="monboard">'+spinner()+'</div></div>'+
    '<div id="view-simulation" class="view" style="display:none"><div class="page-head"><div><div class="t">Simulation</div><p class="sub">Dry-run preview of the automatic CRM updates and reminders. Nothing is written until you go live.</p></div></div><div id="simboard">'+spinner()+'</div></div>'+
    '<div id="view-pipeline" class="view" style="display:none">'+
    '<div class="page-head"><div><div class="t">Pipeline</div><p class="sub">Companies your reps emailed, across Front + Aircall. '+(p.range?p.range.from+" to "+p.range.to:"")+'.</p></div>'+dateBar()+'</div>'+
    worklistPanel()+
    stats+
    '<div class="panel"><h2>Team activity</h2>'+repCards(p.reps)+'</div>'+
    '<div class="panel"><h2>Prospects</h2>'+
      '<div class="controls"><input id="search" class="input input-sm" placeholder="Search company or domain..." oninput="PAGE=1;flt()">'+
      '<span class="chip active" data-f="all" onclick="setF(this)">All</span>'+
      '<span class="chip" data-f="two" onclick="setF(this)">Two-way</span>'+
      '<span class="chip" data-f="outbound" onclick="setF(this)">Outbound only</span>'+
      '<span class="chip" data-f="dev" onclick="setF(this)">Development</span>'+
      '<span class="chip" data-f="new" onclick="setF(this)">Net-new</span></div>'+
      '<div class="count" id="count"></div>'+
      '<div class="tblwrap"><table class="table table-sm"><thead><tr><th onclick="setSort(\'company\')">Company</th><th onclick="setSort(\'two_way\')">Status</th><th onclick="setSort(\'type\')">Type</th><th class="num" onclick="setSort(\'emails\')">Emails</th><th class="num" onclick="setSort(\'calls\')">Calls</th><th onclick="setSort(\'rep_list\')">Reps</th><th onclick="setSort(\'last_activity\')">Last activity</th></tr></thead><tbody id="rows"></tbody></table></div><div id="pager"></div>'+
      '<div class="foot">A company appears if a rep emailed it (outbound) with activity in the selected range. Inbound-only senders excluded. Source: Front + Aircall.</div>'+

// Runs once after the shell renders, regardless of which tab is opened first:
// reveals the head-only tabs (Pulse/Team), paints the TMS freshness chip, and
// loads Today so the landing view is never an empty spinner. Previously the
// Pulse reveal only lived inside a legacy view no longer in the nav, so the
// tab never appeared on the live site.
function bootDesk(){
  desk2Post({action:"meta"},function(r){
    if(r&&r.ok){
      paintFreshness(r.tms);
      if(r.can_manage){ revealMgmt(); }
      if(r.is_admin){ window.IS_ADMIN=true; var ad=document.querySelectorAll(".admonly"); for(var i=0;i<ad.length;i++) ad[i].style.display=""; }
    }
  });
  // Activate the Today tab for real - the shell renders with the assistant
  // view visible, so just loading data into a hidden #todayboard left users
  // staring at the assistant until they clicked Today themselves.
  var tb=document.querySelector('.nav .nv[data-v="today"]');
  if(tb) setView(tb); else loadToday();
}
function setF(el){ filter=el.getAttribute("data-f"); var cs=el.parentElement.querySelectorAll(".chip"); for(var i=0;i<cs.length;i++){cs[i].classList.toggle("active",cs[i]===el);} PAGE=1; flt(); }
function setSort(k){ if(sortK===k)sortDir*=-1; else {sortK=k; sortDir=(k==="company"||k==="rep_list"||k==="type")?1:-1;} PAGE=1; flt(); }
function pageGo(delta){ PAGE+=delta; flt(); var t=document.getElementById("search"); if(t) t.scrollIntoView({block:"start"}); }
function flt(){
  var term=(val("search")||"").toLowerCase();
  var rows=DATA.filter(function(d){
    if(filter==="two" && !d.two_way) return false;
    if(filter==="outbound" && d.two_way) return false;
    if(filter==="dev" && !d.is_development) return false;
    if(filter==="new" && d.is_customer) return false;
    if(term && !((d.company||"").toLowerCase().indexOf(term)>=0 || (d.domain||"").toLowerCase().indexOf(term)>=0)) return false;
    return true;
  });
  rows.sort(function(a,b){
    if(sortK==="rank"){ var ra=rankExcite(a), rb=rankExcite(b); if(ra!==rb) return ra-rb; var ea=Number(a.emails)||0, eb=Number(b.emails)||0; if(ea!==eb) return eb-ea; return (b.last_activity||"").localeCompare(a.last_activity||""); }
    var x,y;
    if(sortK==="two_way"){x=a.two_way?1:0;y=b.two_way?1:0;}
    else if(sortK==="type"){x=typeOf(a);y=typeOf(b);}
    else if(sortK==="company"||sortK==="rep_list"){x=(a[sortK]||"").toLowerCase();y=(b[sortK]||"").toLowerCase();}
    else if(sortK==="last_activity"){x=a.last_activity||"";y=b.last_activity||"";}
    else {x=Number(a[sortK])||0;y=Number(b[sortK])||0;}
    if(x<y)return -sortDir; if(x>y)return sortDir; return 0;
  });
  var total=rows.length;
  var pages=Math.max(1,Math.ceil(total/PAGE_SIZE));
  if(PAGE>pages)PAGE=pages; if(PAGE<1)PAGE=1;
  var startI=(PAGE-1)*PAGE_SIZE, endI=Math.min(startI+PAGE_SIZE,total);
  var cnt=document.getElementById("count"); if(cnt) cnt.textContent= total ? ("Showing "+(startI+1)+"-"+endI+" of "+total+" companies") : "0 companies";
  var tb=document.getElementById("rows"); if(!tb) return;
  tb.innerHTML=rows.slice(startI,endI).map(function(d){
    return '<tr class="crow" data-dom="'+esc(d.domain||"")+'" onclick="openCompany(this.getAttribute(\'data-dom\'))"><td class="company-cell">'+esc(d.company||d.domain)+'<div class="muted" style="font-weight:400">'+esc(d.domain||"")+'</div></td><td>'+statusBadge(d)+'</td><td>'+typeBadge(d)+'</td><td class="num">'+nf(d.emails)+'</td><td class="num">'+(Number(d.calls)?nf(d.calls):'<span class="muted">-</span>')+'</td><td>'+esc((d.rep_list||"").replace(/,/g,", "))+'</td><td>'+fmtDate(d.last_activity)+'</td></tr>';
  }).join("");
  var pg=document.getElementById("pager");
  if(pg){ if(pages<=1){ pg.innerHTML=""; } else { pg.innerHTML='<div class="pager"><button class="btn btn-soft btn-xs" '+(PAGE<=1?"disabled":"")+' onclick="pageGo(-1)">Prev</button><span>Page '+PAGE+' of '+pages+'</span><button class="btn btn-soft btn-xs" '+(PAGE>=pages?"disabled":"")+' onclick="pageGo(1)">Next</button></div>'; } }
}
// the old standalone "Manage users" screen is retired - team management
// (logins, approvals, add a team member) all lives on the Scoreboard page
function goTeamView(){ var b=document.querySelector('.nv[data-v="team"]'); if(b) setView(b); }
boot();
