<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:#f7f8fa; color:#0f172a; }
.wrap { padding:18px; max-width:1200px; margin:0 auto; }

.daterow .spacer{ flex:1; }
.kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(128px,1fr)); gap:10px; margin-bottom:18px; }

.kpi .l { font-size:11.5px; color:#64748b; } .kpi .v { font-size:21px; font-weight:650; margin-top:3px; } .kpi .h { font-size:11px; color:#94a3b8; margin-top:2px; }
.panel { background:#fff; border:1px solid #e6e9ef; border-radius:12px; padding:14px 16px; margin-bottom:18px; }
.panel h2 { font-size:13px; font-weight:650; margin:0 0 10px; color:#334155; }
table { width:100%; border-collapse:collapse; font-size:12.5px; } th,td { text-align:left; padding:7px 9px; border-bottom:1px solid #eef2f7; white-space:nowrap; }
th { color:#64748b; font-weight:550; cursor:pointer; user-select:none; } td.num,th.num { text-align:right; }
.company-cell { white-space:normal; font-weight:550; } .muted { color:#94a3b8; }
.badge { display:inline-block; padding:1px 7px; border-radius:20px; font-size:10.5px; font-weight:600; }
.b-cust { background:#fee2e2; color:#b91c1c; } .b-pros { background:#dbeafe; color:#1d4ed8; } .b-new { background:#f1f5f9; color:#64748b; }
.b-two { background:#dcfce7; color:#15803d; } .b-out { background:#fef9c3; color:#854d0e; } .b-src { background:#faf5ff; color:#7c3aed; }
.b-dev { background:#f3e8ff; color:#7c3aed; } .badge + .badge { margin-left:4px; }
.b-urgent { background:#fee2e2; color:#b91c1c; } .b-overdue { background:#fef3c7; color:#b45309; }
.panel.alert { border-color:#fca5a5; background:#fff7f7; } .qwait { font-variant-numeric:tabular-nums; color:#b45309; font-weight:600; }
.crow { cursor:pointer; } .crow:hover { background:#f8fafc; }
.modalbg { position:fixed; inset:0; background:rgba(15,23,42,.45); display:none; align-items:flex-start; justify-content:center; z-index:50; padding:28px 14px; overflow:auto; }
.mcard { background:#fff; border-radius:14px; max-width:760px; width:100%; box-shadow:0 18px 50px rgba(0,0,0,.25); max-height:90vh; display:flex; flex-direction:column; }
.mhead { display:flex; align-items:center; gap:8px; padding:14px 18px; border-bottom:1px solid #eef2f7; position:sticky; top:0; background:#fff; border-radius:14px 14px 0 0; }
.mhead b { font-size:15px; } .mx { margin-left:auto; cursor:pointer; font-size:22px; color:#94a3b8; line-height:1; }
.mbody { padding:14px 18px; overflow:auto; flex:1; min-height:0; }
.mbody table { width:100%; table-layout:fixed; }
.mbody th, .mbody td { white-space:normal; word-break:break-word; vertical-align:top; } .msec { font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:#64748b; margin:14px 0 8px; }
.thread { border:1px solid #eef2f7; border-radius:10px; padding:10px 12px; margin-bottom:12px; }
.tsub { font-weight:600; font-size:13px; margin-bottom:8px; }
.bub { font-size:12.5px; padding:7px 10px; border-radius:9px; margin:5px 0; max-width:88%; white-space:pre-wrap; line-height:1.45; }
.bub.in { background:#eff6ff; } .bub.out { background:#f1f5f9; margin-left:auto; }
.bmeta { font-size:10.5px; color:#94a3b8; margin-bottom:3px; }
.ctab td,.ctab th { font-size:12px; }
.callcard { border:1px solid #eef2f7; border-radius:9px; padding:8px 10px; margin-bottom:8px; }
.cmeta { font-size:12px; color:#475569; }
.csum { font-size:12px; margin-top:5px; white-space:pre-wrap; color:#0f172a; }
.ctr { margin-top:5px; } .ctr summary { font-size:11.5px; color:#2563eb; cursor:pointer; }
.trtext { font-size:11.5px; color:#475569; white-space:pre-wrap; margin-top:5px; max-height:260px; overflow:auto; }
.uturn { margin:6px 0; font-size:11.5px; line-height:1.5; white-space:normal; }
.uspk { display:inline-block; min-width:16px; text-align:center; font-weight:700; font-size:10px; color:#fff; padding:1px 6px; border-radius:10px; margin-right:6px; background:#94a3b8; }
.spk-A { background:#2563eb; } .spk-B { background:#7c3aed; } .spk-C { background:#15803d; } .spk-D { background:#b45309; }
.cstats { font-size:12px; color:#475569; margin-bottom:8px; }
.seqstep { border:1px solid #eef2f7; border-radius:10px; padding:10px 12px; margin-bottom:10px; }
.seqh { font-size:10.5px; text-transform:uppercase; color:#94a3b8; letter-spacing:.04em; }
.seqsub { font-weight:600; font-size:13px; margin:3px 0 8px; }
.seqbody { font-size:12.5px; color:#334155; max-height:300px; overflow:auto; border-top:1px solid #f1f5f9; padding-top:8px; }
.seqbody * { max-width:100% !important; height:auto !important; }
.lt { border:1px solid #e2e8f0; background:#fff; border-radius:20px; padding:5px 12px; font-size:12px; cursor:pointer; }
.lt.active { border-color:#2563eb; background:#eff6ff; color:#1d4ed8; font-weight:600; }
.replybox { margin-top:6px; background:#eff6ff; border-radius:8px; padding:7px 10px; font-size:11.5px; white-space:pre-wrap; color:#0f172a; }
.rulecard { border:1px solid #eef2f7; border-radius:10px; padding:9px 12px; margin-bottom:8px; }
.rulehd { display:flex; align-items:center; gap:8px; font-size:13px; }
.rulex { margin-left:auto; color:#b91c1c; cursor:pointer; font-size:11.5px; }
.rulemeta { font-size:12px; color:#475569; margin:4px 0 6px; }
.ruleform { border:1px solid #eef2f7; border-radius:10px; padding:12px; margin-top:8px; }
.ruleform select { width:100%; padding:9px; border:1px solid #e2e8f0; border-radius:8px; font:inherit; margin:0; background:#fff; }
.flabel { font-size:11px; text-transform:uppercase; color:#64748b; letter-spacing:.04em; margin:14px 0 6px; }
.ckgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:5px 12px; }
.ck { font-size:12px; color:#334155; display:flex; align-items:center; gap:6px; }
.ck input { width:auto; margin:0; padding:0; display:inline-block; }
.controls { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
input#search { flex:1; min-width:160px; margin:0; }
.chip { border:1px solid #e2e8f0; background:#fff; border-radius:20px; padding:6px 12px; font-size:12px; cursor:pointer; }
.chip.active { border-color:#2563eb; background:#eff6ff; color:#1d4ed8; font-weight:600; }
.count { font-size:11.5px; color:#64748b; margin:6px 0 8px; }
.foot { font-size:11px; color:#94a3b8; margin-top:8px; line-height:1.6; }
.err { color:#b91c1c; font-size:13px; }
.shell { display:flex; align-items:flex-start; gap:0; }
.side { width:172px; flex:0 0 172px; position:sticky; top:18px; align-self:flex-start; }
.sbrand { font-weight:650; font-size:15px; margin:2px 6px 12px; }
.navi { display:block; width:100%; text-align:left; background:#fff; border:1px solid #e6e9ef; color:#334155; border-radius:9px; padding:9px 12px; margin-bottom:6px; font:inherit; font-size:13px; cursor:pointer; }
.navi.active { border-color:#2563eb; background:#eff6ff; color:#1d4ed8; font-weight:600; }
.sfoot { margin-top:16px; border-top:1px solid #eef2f7; padding-top:12px; display:flex; flex-direction:column; gap:6px; }
.sfoot button { width:100%; }
.main { flex:1; min-width:0; padding-left:20px; }
@media (max-width:760px){ .shell{flex-direction:column;} .side{width:auto;flex:none;position:static;display:flex;flex-wrap:wrap;gap:6px;align-items:center;} .sbrand{margin:0 8px 0 0;} .navi{width:auto;margin:0;} .sfoot{flex-direction:row;margin:0 0 0 auto;border:0;padding:0;width:auto;} .sfoot button{width:auto;} .main{padding-left:0;padding-top:12px;} }
</style>
</head>
<body>
<div id="app" class="wrap">Loading...</div>
<div id="cmodal" class="modalbg" onclick="if(event.target===this)closeModal()"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
var URL_="https://bbklqpmojvfoqsmxbtfv.supabase.co";
var KEY_="sb_publishable_ayYFZV0wGJ-dM8VHpbaJiQ_ogINqgTH";
var DATA_=URL_+"/functions/v1/activity-data";
var DETAIL_=URL_+"/functions/v1/company-detail";
var CDET_=URL_+"/functions/v1/campaign-detail";
var sb=supabase.createClient(URL_,KEY_);
var app=document.getElementById("app");
var DATA=[], sortK="rank", sortDir=-1, filter="all";
var ACTIONS=[], wlRep="all";
var PAGE=1, PAGE_SIZE=100;
var RANGE={from:null,to:null,preset:7};
function h(x){app.innerHTML=x;}
function val(id){var e=document.getElementById(id);return e?e.value:"";}
function setMsg(m){var e=document.getElementById("msg");if(e)e.textContent=m||"";}
var nf=function(v){return (Number(v)||0).toLocaleString();};
function pct(a,b){return b>0?Math.round(100*a/b)+"%":"-";}
function isoDay(d){return d.toISOString().slice(0,10);}
function fmtDate(s){if(!s)return"-";var d=new Date(s);return isNaN(d)?"-":d.toLocaleDateString("en-GB",{day:"2-digit",month:"short"});}
function defaultRange(){var to=new Date();var from=new Date(Date.now()-7*86400000);RANGE={from:isoDay(from),to:isoDay(to),preset:7};}
async function boot(){
  var s=await sb.auth.getSession();
  if(!s.data.session){return login();}
  if(!RANGE.from) defaultRange();
  loadData();
}
async function loadData(){
  var s=await sb.auth.getSession();
  if(!s.data.session){return login();}
  app.innerHTML='<p class="sub">Loading...</p>';
  var url=DATA_+"?from="+RANGE.from+"&to="+RANGE.to;
  var res;
  try{ res=await fetch(url,{headers:{Authorization:"Bearer "+s.data.session.access_token,apikey:KEY_}}); }
  catch(e){ return errScreen("Could not reach the data service."); }
  if(res.status===401){ await sb.auth.signOut(); return login(); }
  if(res.status===403){ var p=await res.json().catch(function(){return{};}); return pending(p.email||s.data.session.user.email); }
  if(!res.ok){ return errScreen("Server error ("+res.status+")."); }
  var payload=await res.json();
  if(!payload.ok){ return errScreen(payload.error||"Unknown error."); }
  renderDash(payload);
}
function login(){
  h('<div class="card"><h2>Cal Sameday</h2><p>Prospect pipeline - sign in to continue.</p>'+
    '<input id="em" placeholder="Work email"><input id="pw" type="password" placeholder="Password">'+
    '<div class="row"><button onclick="doIn()">Sign in</button><button class="alt" onclick="doUp()">Request access</button></div>'+
    '<div id="msg" class="msg"></div></div>');
}
async function doIn(){ setMsg(""); var r=await sb.auth.signInWithPassword({email:val("em"),password:val("pw")}); if(r.error){setMsg(r.error.message);} else { boot(); } }
async function doUp(){ setMsg(""); var r=await sb.auth.signUp({email:val("em"),password:val("pw")}); if(r.error){setMsg(r.error.message);} else { setMsg("Request sent. An admin will approve you, then sign in."); } }
function pending(email){ h('<div class="card"><h2>Awaiting approval</h2><p><b>'+email+'</b> is signed in, but an admin has not approved access yet.</p><div class="row"><button onclick="boot()">Check again</button><button class="alt" onclick="out()">Sign out</button></div></div>'); }
function errScreen(m){ h('<div class="card"><h2>Something went wrong</h2><p>'+m+'</p><div class="row"><button onclick="boot()">Retry</button><button class="alt" onclick="out()">Sign out</button></div></div>'); }
async function out(){ await sb.auth.signOut(); boot(); }
function kpi(l,v,hh){ return '<div class="kpi"><div class="l">'+l+'</div><div class="v">'+v+'</div>'+(hh?'<div class="h">'+hh+'</div>':'')+'</div>'; }
function typeOf(d){ if(d.is_customer)return"customer"; if(d.is_prospect)return"scored"; return"new"; }
function rankExcite(d){ var t=d.is_development?"dev":(d.is_customer?"cust":(d.is_prospect?"pros":"new")); if(d.two_way){ if(t==="new")return 1; if(t==="dev")return 2; if(t==="pros")return 3; return 7; } if(t==="dev")return 4; if(t==="pros")return 5; if(t==="new")return 6; return 8; }
function typeBadge(d){ if(d.is_customer){var t='<span class="badge b-cust">Customer</span>'; if(d.is_development) t+='<span class="badge b-dev">Development</span>'; return t;} if(d.is_prospect)return'<span class="badge b-pros">Prospect'+(d.score?" "+Math.round(d.score):"")+'</span>'; return'<span class="badge b-new">New prospect</span>'; }
function statusBadge(d){ return d.two_way?'<span class="badge b-two">Two-way</span>':'<span class="badge b-out">Outbound</span>'; }
function fmtWait(h){ h=Number(h)||0; if(h>=48)return Math.round(h/24)+" days"; if(h>=24)return "1 day"; return h+"h"; }
function warmDot(s){ var v=Number(s); var c=v>=95?"#15803d":v>=80?"#b45309":"#b91c1c"; return '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+c+';margin-right:5px;vertical-align:middle"></span>'; }
var CAMP=null, cLeadTab="all";
function bouncedLead(l){ return Number(l.status)===-1; }
function repliedLead(l){ return Number(l.replies)>0; }
function openCampaign(id){
  if(!id) return; var m=document.getElementById("cmodal"); m.style.display="flex";
  m.innerHTML='<div class="mcard"><div class="mhead"><b>Loading campaign...</b><span class="mx" onclick="closeModal()">&times;</span></div><div class="mbody"><p class="muted">Fetching sequence, recipients and replies...</p></div></div>';
  sb.auth.getSession().then(function(s){ if(!s.data.session) return; fetch(CDET_+"?id="+encodeURIComponent(id),{headers:{Authorization:"Bearer "+s.data.session.access_token,apikey:KEY_}}).then(function(r){return r.json();}).then(renderCampaign).catch(function(){ var b=document.querySelector("#cmodal .mbody"); if(b)b.innerHTML='<p class="err">Could not load campaign.</p>'; }); });
}
function setCTab(t){ cLeadTab=t; var cs=document.querySelectorAll("#cmodal .lt"); for(var i=0;i<cs.length;i++) cs[i].classList.toggle("active", cs[i].getAttribute("data-t")===t); renderCampaignLeads(); }
function renderCampaignLeads(){
  var tb=document.getElementById("cleadrows"); if(!tb||!CAMP) return;
  var leads=CAMP.leads||[]; var rows=leads.filter(function(l){ if(cLeadTab==="bounced")return bouncedLead(l); if(cLeadTab==="replied")return repliedLead(l); return true; });
  var rep={}; (CAMP.replies||[]).forEach(function(r){ rep[(r.lead_email||"").toLowerCase()]=r; });
  tb.innerHTML=rows.slice(0,400).map(function(l){
    var nm=((l.first_name||"")+" "+(l.last_name||"")).trim()||l.email;
    var st=bouncedLead(l)?'<span class="badge b-urgent">Bounced</span>':(repliedLead(l)?'<span class="badge b-two">Replied</span>':'<span class="badge b-out">Sent</span>');
    var rb=(repliedLead(l)&&rep[(l.email||"").toLowerCase()])?'<div class="replybox">'+esc(rep[(l.email||"").toLowerCase()].body_text||"")+'</div>':"";
    return '<tr><td class="company-cell">'+esc(nm)+'<div class="muted" style="font-weight:400">'+esc(l.email||"")+'</div>'+rb+'</td><td>'+esc(l.company||"")+'</td><td>'+esc(l.job_title||"")+'</td><td>'+st+'</td></tr>';
  }).join("") || '<tr><td colspan="4" class="muted">None.</td></tr>';
}
function renderCampaign(p){
  var m=document.getElementById("cmodal");
  if(!p||!p.ok){ m.innerHTML='<div class="mcard"><div class="mhead"><b>Campaign</b><span class="mx" onclick="closeModal()">&times;</span></div><div class="mbody"><p class="err">No detail.</p></div></div>'; return; }
  CAMP=p; cLeadTab="all"; var c=p.campaign||{};
  var bp=Number(c.emails_sent)?Math.round(100*Number(c.bounced)/Number(c.emails_sent)):0;
  var stats='<div class="cstats">Leads '+nf(c.leads)+' &middot; Sent '+nf(c.emails_sent)+' &middot; Opens '+nf(c.opens_unique)+' &middot; Replies '+nf(c.replies)+' &middot; Bounce '+bp+'%</div>';
  var seq=(p.sequence||[]).map(function(st){ return '<div class="seqstep"><div class="seqh">Step '+st.step+(st.delay?' &middot; after '+st.delay+' days':'')+'</div><div class="seqsub">'+esc(st.subject||"(no subject)")+'</div><div class="seqbody">'+(st.body||"")+'</div></div>'; }).join("") || '<p class="muted">No sequence steps.</p>';
  var leads=p.leads||[]; var nB=leads.filter(bouncedLead).length, nR=leads.filter(repliedLead).length;
  var chips='<span class="lt active" data-t="all" onclick="setCTab(\'all\')">All ('+leads.length+')</span><span class="lt" data-t="bounced" onclick="setCTab(\'bounced\')">Bounced ('+nB+')</span><span class="lt" data-t="replied" onclick="setCTab(\'replied\')">Replied ('+nR+')</span>';
  m.innerHTML='<div class="mcard"><div class="mhead"><b>'+esc(c.name||"Campaign")+'</b><span class="mx" onclick="closeModal()">&times;</span></div><div class="mbody">'+stats+'<h3 class="msec">Recipients</h3><div class="controls">'+chips+'</div><table><thead><tr><th>Contact</th><th>Company</th><th>Job title</th><th>Status</th></tr></thead><tbody id="cleadrows"></tbody></table><details class="ctr" style="margin-top:14px"><summary>Email sequence ('+(p.sequence||[]).length+' step) - view the emails being sent</summary>'+seq+'</details></div></div>';
  m.scrollTop=0;
  renderCampaignLeads();
}
function coldPanel(inst){
  if(!inst) return "";
  var accts=inst.accounts||[], camps=inst.campaigns||[];
  if(!accts.length && !camps.length) return "";
  var ah = accts.length ? '<table><thead><tr><th>Sending mailbox</th><th class="num">Warmup</th><th class="num">Daily limit</th><th>Status</th></tr></thead><tbody>'+accts.map(function(a){ return '<tr><td>'+esc(a.email)+'</td><td class="num">'+warmDot(a.warmup_score)+(a.warmup_score!=null?a.warmup_score:"-")+'</td><td class="num">'+(a.daily_limit||"-")+'</td><td>'+(Number(a.status)===1?"Active":"Paused")+'</td></tr>'; }).join("")+'</tbody></table>' : '<p class="muted" style="font-size:12.5px">No sending mailboxes.</p>';
  var ch = camps.length ? '<table><thead><tr><th>Campaign</th><th class="num">Leads</th><th class="num">Sent</th><th class="num">Opens</th><th class="num">Replies</th><th class="num">Bounce</th></tr></thead><tbody>'+camps.map(function(c){ var bp=Number(c.emails_sent)?Math.round(100*Number(c.bounced)/Number(c.emails_sent)):0; var bs=bp>=8?' style="color:#b91c1c;font-weight:600"':""; return '<tr class="crow" data-cid="'+esc(c.id)+'" onclick="openCampaign(this.getAttribute(\'data-cid\'))"><td>'+esc(c.name||c.id)+'</td><td class="num">'+nf(c.leads)+'</td><td class="num">'+nf(c.emails_sent)+'</td><td class="num">'+nf(c.opens_unique)+'</td><td class="num">'+nf(c.replies)+'</td><td class="num"'+bs+'>'+bp+'%</td></tr>'; }).join("")+'</tbody></table>' : '<p class="muted" style="font-size:12.5px">No campaigns running yet.</p>';
  return '<div class="panel"><h2>Cold outreach - Instantly</h2><h3 class="msec">Sending mailboxes &amp; warmup health</h3>'+ah+'<h3 class="msec">Campaigns</h3>'+ch+'</div>'+automationsPanel(inst);
}
function reasonBadge(r){ var c="b-overdue"; if(r==="Urgent")c="b-urgent"; else if(r==="Contract run")c="b-dev"; else if(r==="Quote / pricing")c="b-pros"; return '<span class="badge '+c+'">'+r+'</span>'; }
function actionBadge(a){ return a==="Reply" ? '<span class="badge b-urgent">Reply now</span>' : '<span class="badge b-overdue">Nudge</span>'; }
function wlReps(){ var m={}; for(var i=0;i<ACTIONS.length;i++){ var r=ACTIONS[i].rep; if(r) m[r]=(m[r]||0)+1; } return m; }
function worklistPanel(){
  if(!ACTIONS.length) return '<div class="panel"><h2>Worklist - next actions</h2><p class="muted" style="font-size:12.5px">Nothing waiting right now.</p></div>';
  var reps=wlReps();
  var chips='<span class="chip'+(wlRep==="all"?" active":"")+'" data-r="all" onclick="setWlRep(this.getAttribute(\'data-r\'))">All ('+ACTIONS.length+')</span>';
  var ks=Object.keys(reps).sort();
  for(var i=0;i<ks.length;i++){ chips+='<span class="chip'+(wlRep===ks[i]?" active":"")+'" data-r="'+ks[i]+'" onclick="setWlRep(this.getAttribute(\'data-r\'))">'+ks[i]+' ('+reps[ks[i]]+')</span>'; }
  return '<div class="panel alert"><h2>Worklist - next actions (per rep)</h2>'+
    '<p class="sub" style="margin:0 0 8px">Ranked by urgency then account value. Reply now = a customer is waiting on us; Nudge = we spoke last and it has gone quiet.</p>'+
    '<div class="controls">'+chips+'</div>'+
    '<table><thead><tr><th>Do</th><th>Why</th><th>Company</th><th>Value</th><th>Waiting</th><th>Rep</th></tr></thead><tbody id="wlrows"></tbody></table></div>';
}
function renderWorklist(){
  var tb=document.getElementById("wlrows"); if(!tb) return;
  var rows=ACTIONS.filter(function(a){ return wlRep==="all" || a.rep===wlRep; });
  tb.innerHTML=rows.map(function(a){
    return '<tr><td>'+actionBadge(a.action)+'</td><td>'+reasonBadge(a.reason)+'</td><td class="company-cell">'+(a.company||a.domain)+'<div class="muted" style="font-weight:400">'+(a.domain||"")+'</div></td><td>'+(a.value_label||"-")+(Number(a.value_score)?' <span class="muted">'+a.value_score+'</span>':'')+'</td><td class="qwait">'+fmtWait(a.hrs_waiting)+'</td><td>'+(a.rep||'<span class="muted">-</span>')+'</td></tr>';
  }).join("") || '<tr><td colspan="6" class="muted">Nothing for this rep.</td></tr>';
}
function setWlRep(r){ wlRep=r; var cs=document.querySelectorAll(".panel.alert .chip"); for(var i=0;i<cs.length;i++){ cs[i].classList.toggle("active", cs[i].getAttribute("data-r")===r); } renderWorklist(); }
function esc(t){ return (t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmtDT(s){ if(!s) return ""; var d=new Date(s); if(isNaN(d)) return ""; return d.toLocaleDateString("en-GB",{day:"2-digit",month:"short"})+" "+d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}); }
function closeModal(){ var m=document.getElementById("cmodal"); if(m){ m.style.display="none"; m.innerHTML=""; } }
async function openCompany(dom){
  if(!dom) return;
  var m=document.getElementById("cmodal"); m.style.display="flex";
  m.innerHTML='<div class="mcard"><div class="mhead"><b>'+esc(dom)+'</b><span class="mx" onclick="closeModal()">&times;</span></div><div class="mbody"><p class="muted">Loading email threads and calls...</p></div></div>';
  var s=await sb.auth.getSession(); if(!s.data.session) return;
  try{
    var res=await fetch(DETAIL_+"?domain="+encodeURIComponent(dom),{headers:{Authorization:"Bearer "+s.data.session.access_token,apikey:KEY_}});
    var p=await res.json(); renderDetail(p);
  }catch(e){ var b=document.querySelector("#cmodal .mbody"); if(b) b.innerHTML='<p class="err">Could not load details.</p>'; }
}
function renderDetail(p){
  var m=document.getElementById("cmodal");
  if(!p||!p.ok){ m.innerHTML='<div class="mcard"><div class="mhead"><b>Details</b><span class="mx" onclick="closeModal()">&times;</span></div><div class="mbody"><p class="err">No detail available.</p></div></div>'; return; }
  var threads=p.threads||[], calls=p.calls||[];
  var th = threads.length ? threads.map(function(t){
    var msgs=t.messages.map(function(mm){ return '<div class="bub '+(mm.inbound?"in":"out")+'"><div class="bmeta">'+esc(mm.who)+' &middot; '+fmtDT(mm.date)+'</div>'+esc(mm.text)+'</div>'; }).join("");
    return '<div class="thread"><div class="tsub">'+esc(t.subject)+'</div>'+msgs+'</div>';
  }).join("") : '<p class="muted">No email threads found for this company.</p>';
  var cl = calls.length ? calls.map(function(c){
    var head='<div class="cmeta"><b>'+fmtDT(c.started_at)+'</b> &middot; '+esc(c.direction||"")+' &middot; '+(c.duration?Math.round(c.duration)+"s":"-")+' &middot; '+(c.answered?"answered":"missed")+' &middot; '+esc(c.agent||"-")+(c.recording?' &middot; <a href="'+esc(c.recording)+'" target="_blank" rel="noopener">Listen</a>':"")+'</div>';
    var sum=c.summary?'<div class="csum">'+esc(c.summary)+'</div>':(c.tstatus==="processing"?'<div class="muted" style="font-size:11.5px">Transcribing...</div>':"");
    var tr="";
    if(c.utterances&&c.utterances.length){ var conv=c.utterances.map(function(u){ var sp=(u.s||"?"); return '<div class="uturn"><span class="uspk spk-'+sp+'">'+sp+'</span>'+esc(u.t)+'</div>'; }).join(""); tr='<details class="ctr"><summary>Transcript (by speaker)</summary><div class="trtext">'+conv+'</div></details>'; }
    else if(c.transcript){ tr='<details class="ctr"><summary>Transcript</summary><div class="trtext">'+esc(c.transcript)+'</div></details>'; }
    return '<div class="callcard">'+head+sum+tr+'</div>';
  }).join("") : '<p class="muted">No calls linked to this company.</p>';
  m.innerHTML='<div class="mcard"><div class="mhead"><b>'+esc(p.company||p.domain)+'</b> <span class="muted">'+esc(p.domain)+'</span><span class="mx" onclick="closeModal()">&times;</span></div><div class="mbody"><h3 class="msec">Email threads</h3>'+th+'<h3 class="msec">Calls</h3>'+cl+'</div></div>';
}
function setPreset(days){
  var to=new Date();
  var from = days>=99999 ? new Date("2020-01-01") : new Date(Date.now()-days*86400000);
  RANGE={from:isoDay(from),to:isoDay(to),preset:days};
  loadData();
}
function applyCustom(){ var f=val("d_from"), t=val("d_to"); if(f&&t){ RANGE={from:f,to:t,preset:0}; loadData(); } }
function dateBar(){
  function c(days,label){ return '<span class="dchip'+(RANGE.preset===days?" active":"")+'" onclick="setPreset('+days+')">'+label+'</span>'; }
  return '<div class="daterow"><span class="lbl">Range</span>'+c(7,"7 days")+c(30,"30 days")+c(90,"90 days")+c(99999,"All time")+
    '<span class="spacer"></span><span class="lbl">From</span><input type="date" id="d_from" value="'+RANGE.from+'" onchange="applyCustom()">'+
    '<span class="lbl">To</span><input type="date" id="d_to" value="'+RANGE.to+'" onchange="applyCustom()"></div>';
}
function postRule(payload){ sb.auth.getSession().then(function(s){ if(!s.data.session) return; fetch(URL_+"/functions/v1/automation-rules",{method:"POST",headers:{Authorization:"Bearer "+s.data.session.access_token,apikey:KEY_,"Content-Type":"application/json"},body:JSON.stringify(payload)}).then(function(r){return r.json();}).then(function(){ loadData(); }).catch(function(){}); }); }
function saveRule(){
  var name=val("ruleName")||"Untitled rule";
  var segs=[]; document.querySelectorAll(".rseg:checked").forEach(function(c){ segs.push(Number(c.value)); });
  var jts=[]; document.querySelectorAll(".rjt:checked").forEach(function(c){ jts.push(c.value); });
  var camp=val("ruleCamp");
  var active=document.getElementById("ruleActive")?document.getElementById("ruleActive").checked:true;
  postRule({action:"save", rule:{name:name, segment_ids:segs, job_titles:jts, campaign_id:camp, active:active}});
}
function delRule(id){ postRule({action:"delete", id:id}); }
function toggleRule(id,active){ postRule({action:"toggle", id:id, active:active}); }
function automationsPanel(inst){
  if(!inst) return "";
  var rules=inst.rules||[], segs=inst.segments||[], jts=inst.job_titles||[], camps=inst.campaigns||[];
  var segName={}; segs.forEach(function(s){ segName[s.id]=s.name; });
  var rl = rules.length ? rules.map(function(r){
    var sgs=(r.segment_ids||[]).map(function(id){return segName[id]||id;}).join(", ")||"any segment";
    var titles=(r.job_titles||[]).join(", ")||"any title";
    var cm=(camps.filter(function(c){return c.id===r.campaign_id;})[0]||{}); var cname=cm.name||"(no campaign set)";
    return '<div class="rulecard"><div class="rulehd"><b>'+esc(r.name)+'</b><span class="badge '+(r.active?"b-two":"b-new")+'">'+(r.active?"Active":"Paused")+'</span><span class="rulex" onclick="delRule(\''+r.id+'\')">delete</span></div>'+
      '<div class="rulemeta">Lead matches <b>'+esc(sgs)+'</b> and title in <b>'+esc(titles)+'</b> &rarr; <b>'+esc(cname)+'</b></div>'+
      '<label class="ck"><input type="checkbox" onchange="toggleRule(\''+r.id+'\', this.checked)" '+(r.active?"checked":"")+'> enabled</label></div>';
  }).join("") : '<p class="muted" style="font-size:12.5px">No automations yet - create one below.</p>';
  var segChecks = segs.map(function(s){ return '<label class="ck"><input type="checkbox" class="rseg" value="'+s.id+'"> '+esc(s.name)+'</label>'; }).join("");
  var jtChecks = jts.map(function(t){ return '<label class="ck"><input type="checkbox" class="rjt" value="'+esc(t)+'"> '+esc(t)+'</label>'; }).join("");
  var campOpts = '<option value="">- select campaign -</option>'+camps.map(function(c){ return '<option value="'+esc(c.id)+'">'+esc(c.name||c.id)+'</option>'; }).join("");
  var form='<details class="ctr"><summary>+ New automation</summary><div class="ruleform">'+
    '<input id="ruleName" type="text" placeholder="Rule name (e.g. Medical - Ops Managers)">'+
    '<div class="flabel">Industries / segments</div><div class="ckgrid">'+segChecks+'</div>'+
    '<div class="flabel">Job titles</div><div class="ckgrid">'+jtChecks+'</div>'+
    '<div class="flabel">Add matching leads to campaign</div><select id="ruleCamp">'+campOpts+'</select>'+
    '<label class="ck" style="margin-top:10px"><input type="checkbox" id="ruleActive" checked> Active</label>'+
    '<div style="margin-top:10px"><button onclick="saveRule()">Save automation</button></div></div></details>';
  return '<div class="panel"><h2>Automations</h2><p class="sub" style="margin:0 0 10px">Rules that auto-enrol matching new leads into a campaign. A lead is added when it matches any chosen segment and a job title. Sending still respects the campaign - nothing goes out from a paused one.</p>'+rl+'<div style="margin-top:10px">'+form+'</div></div>';
}
function setView(el){ var v=el.getAttribute("data-v"); var b=document.querySelectorAll(".side .navi"); for(var i=0;i<b.length;i++) b[i].classList.toggle("active", b[i]===el); var vp=document.getElementById("view-pipeline"), vc=document.getElementById("view-cold"); if(vp) vp.style.display=(v==="pipeline"?"":"none"); if(vc) vc.style.display=(v==="cold"?"":"none"); }
function renderDash(p){
  var s=p.summary;
  var adminBtn=p.is_admin?'<button class="alt" onclick="adminView()">Manage users</button>':'';
  var kpis=kpi("Reply due",nf(s.followups_due),"24h SLA")+kpi("Prospects active",nf(s.prospects),"in this range")+kpi("Two-way",nf(s.two_way),"replied")+kpi("Outbound only",nf(s.outbound_only),"no reply yet")+kpi("Emails",nf(s.emails),"in range")+kpi("Customers",nf(s.customers),"existing - flagged")+kpi("Calls",nf(s.calls),(s.companies_called||0)+" companies, "+(s.avg_calls||0)+" avg");
  var reps='<table><thead><tr><th>Rep</th><th class="num">Emails</th><th class="num">Calls</th><th class="num">Answered</th><th class="num">Companies emailed</th><th>Last active</th></tr></thead><tbody>'+
    (p.reps||[]).map(function(r){return '<tr><td style="font-weight:550">'+r.rep+'</td><td class="num">'+nf(r.emails)+'</td><td class="num">'+(r.calls?nf(r.calls):'<span class="muted">-</span>')+'</td><td class="num">'+(r.calls?pct(r.calls_answered,r.calls):'<span class="muted">-</span>')+'</td><td class="num">'+nf(r.companies_emailed)+'</td><td>'+(r.last_active?fmtDate(r.last_active):'-')+'</td></tr>';}).join("")+'</tbody></table>';
  if(!(p.reps&&p.reps.length)) reps='<p class="muted" style="font-size:12.5px">No rep activity in this range.</p>';
  h('<div class="shell">'+
    '<aside class="side"><div class="sbrand">Cal Sameday</div>'+
      '<button class="navi active" data-v="pipeline" onclick="setView(this)">Pipeline</button>'+
      '<button class="navi" data-v="cold" onclick="setView(this)">Cold outreach</button>'+
      '<div class="sfoot">'+adminBtn+'<button onclick="out()">Sign out</button></div></aside>'+
    '<main class="main">'+
    '<div id="view-cold" class="view" style="display:none">'+
      '<div class="top"><div class="t">Cold outreach - Instantly</div></div>'+
      '<p class="sub">Your cold-email engine - sending health and campaign performance, synced from Instantly every 2 hours.</p>'+
      coldPanel(p.instantly)+
    '</div>'+
    '<div id="view-pipeline" class="view">'+
    '<div class="top"><div class="t">Prospect Pipeline</div></div>'+
    '<p class="sub">Companies your reps emailed (outbound), across Front + Aircall. Showing '+(p.range?p.range.from+" to "+p.range.to:"")+'.</p>'+
    dateBar()+'<div class="kpis">'+kpis+'</div>'+
    '<div class="panel"><h2>Rep activity - email and phone</h2>'+reps+'</div>'+
    worklistPanel()+
    '<div class="panel"><h2>Prospects</h2>'+
      '<div class="controls"><input id="search" placeholder="Search company or domain..." oninput="PAGE=1;flt()">'+
      '<span class="chip active" data-f="all" onclick="setF(this)">All</span>'+
      '<span class="chip" data-f="two" onclick="setF(this)">Two-way</span>'+
      '<span class="chip" data-f="outbound" onclick="setF(this)">Outbound only</span>'+
      '<span class="chip" data-f="dev" onclick="setF(this)">Development</span>'+
      '<span class="chip" data-f="new" onclick="setF(this)">Net-new</span></div>'+
      '<div class="count" id="count"></div>'+
      '<table><thead><tr><th onclick="setSort(\'company\')">Company</th><th onclick="setSort(\'two_way\')">Status</th><th onclick="setSort(\'type\')">Type</th><th class="num" onclick="setSort(\'emails\')">Emails</th><th class="num" onclick="setSort(\'calls\')">Calls</th><th onclick="setSort(\'rep_list\')">Reps</th><th onclick="setSort(\'last_activity\')">Last activity</th></tr></thead><tbody id="rows"></tbody></table>'+'<div id="pager"></div>'+
      '<div class="foot">A company appears if a rep emailed it (outbound) with activity in the selected range. <span class="badge b-two">Two-way</span> = replied; <span class="badge b-out">Outbound</span> = no reply yet. Inbound-only senders excluded. Source: <span class="badge b-src">Front</span> + <span class="badge b-src">Aircall</span>.</div>'+
    '</div>'+
    '</div></main></div>');
  ACTIONS=p.actions||[];
  DATA=p.companies||[];
  flt();
  renderWorklist();
}
function setF(el){ filter=el.getAttribute("data-f"); var cs=document.querySelectorAll(".chip"); for(var i=0;i<cs.length;i++){cs[i].classList.toggle("active",cs[i]===el);} PAGE=1; flt(); }
function setSort(k){ if(sortK===k)sortDir*=-1; else {sortK=k; sortDir=(k==="company"||k==="rep_list"||k==="type")?1:-1;} PAGE=1; flt(); }
function pageGo(delta){ PAGE+=delta; flt(); var t=document.getElementById("search"); if(t) t.scrollIntoView({block:"start"}); }
function flt(){
  var term=(val("search")||"").toLowerCase();
  var rows=DATA.filter(function(d){
    if(filter==="two" && !d.two_way) return false;
    if(filter==="outbound" && d.two_way) return false;
    if(filter==="dev" && !d.is_development) return false;
    if(filter==="new" && d.is_customer) return false;
    if(term && !((d.company||"").toLowerCase().indexOf(term)>=0 || (d.domain||"").toLowerCase().indexOf(term)>=0)) return false;
    return true;
  });
  rows.sort(function(a,b){
    if(sortK==="rank"){ var ra=rankExcite(a), rb=rankExcite(b); if(ra!==rb) return ra-rb; var ea=Number(a.emails)||0, eb=Number(b.emails)||0; if(ea!==eb) return eb-ea; return (b.last_activity||"").localeCompare(a.last_activity||""); }
    var x,y;
    if(sortK==="two_way"){x=a.two_way?1:0;y=b.two_way?1:0;}
    else if(sortK==="type"){x=typeOf(a);y=typeOf(b);}
    else if(sortK==="company"||sortK==="rep_list"){x=(a[sortK]||"").toLowerCase();y=(b[sortK]||"").toLowerCase();}
    else if(sortK==="last_activity"){x=a.last_activity||"";y=b.last_activity||"";}
    else {x=Number(a[sortK])||0;y=Number(b[sortK])||0;}
    if(x<y)return -sortDir; if(x>y)return sortDir; return 0;
  });
  var total=rows.length;
  var pages=Math.max(1,Math.ceil(total/PAGE_SIZE));
  if(PAGE>pages)PAGE=pages; if(PAGE<1)PAGE=1;
  var startI=(PAGE-1)*PAGE_SIZE, endI=Math.min(startI+PAGE_SIZE,total);
  var cnt=document.getElementById("count"); if(cnt) cnt.textContent= total ? ("Showing "+(startI+1)+"-"+endI+" of "+total+" companies") : "0 companies";
  var tb=document.getElementById("rows"); if(!tb) return;
  tb.innerHTML=rows.slice(startI,endI).map(function(d){
    return '<tr class="crow" data-dom="'+(d.domain||"")+'" onclick="openCompany(this.getAttribute(\'data-dom\'))"><td class="company-cell">'+(d.company||d.domain)+'<div class="muted" style="font-weight:400">'+(d.domain||"")+'</div></td><td>'+statusBadge(d)+'</td><td>'+typeBadge(d)+'</td><td class="num">'+nf(d.emails)+'</td><td class="num">'+(Number(d.calls)?nf(d.calls):'<span class="muted">-</span>')+'</td><td>'+((d.rep_list||"").replace(/,/g,", ")||'<span class="muted">-</span>')+'</td><td>'+fmtDate(d.last_activity)+'</td></tr>';
  }).join("");
  var pg=document.getElementById("pager");
  if(pg){ if(pages<=1){ pg.innerHTML=""; } else { pg.innerHTML='<div style="display:flex;gap:10px;align-items:center;justify-content:center;margin:12px 0;font-size:12.5px"><button class="alt" '+(PAGE<=1?"disabled":"")+' onclick="pageGo(-1)">Prev</button><span>Page '+PAGE+' of '+pages+'</span><button class="alt" '+(PAGE>=pages?"disabled":"")+' onclick="pageGo(1)">Next</button></div>'; } }
}
async function adminView(){
  var us=(await sb.from("app_user").select("id,email,approved,is_admin")).data||[];
  var rows=us.map(function(u){var act=u.approved?'<span class="muted">approved</span>':'<button onclick="appr(\''+u.id+'\')">Approve</button>';return '<tr><td>'+(u.email||u.id)+'</td><td>'+(u.is_admin?'admin':(u.approved?'member':'pending'))+'</td><td>'+act+'</td></tr>';}).join("");
  h('<div class="top"><div class="t">Manage users</div><div class="r"><button class="alt" onclick="boot()">Back</button><button onclick="out()">Sign out</button></div></div><div class="panel"><table><thead><tr><th>User</th><th>Status</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>');
}
async function appr(id){ await sb.from("app_user").update({approved:true}).eq("id",id); adminView(); }
boot();
</script>
</body>
</html>
