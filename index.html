<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cal Sameday - Sales Assistant</title>
<link href="https://cdn.jsdelivr.net/npm/daisyui@5/daisyui.css" rel="stylesheet" type="text/css">
<link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css">
<style>
/* ============================ design tokens ============================ */
:root{
  --color-base-100:#ffffff; --color-base-200:#F5F6F9; --color-base-300:#E6E9F0;
  --color-base-content:#0D1424;
  --color-primary:#2F62F5; --color-primary-content:#ffffff;
  --color-secondary:#6D5AE6; --color-secondary-content:#ffffff;
  --color-accent:#0E9488; --color-accent-content:#ffffff;
  --color-neutral:#0D1424; --color-neutral-content:#ffffff;
  --color-success:#0E9F6E; --color-success-content:#ffffff;
  --color-warning:#C2740B; --color-warning-content:#ffffff;
  --color-error:#DC2626; --color-error-content:#ffffff;
  --color-info:#2F62F5; --color-info-content:#ffffff;
  --radius-box:16px; --radius-field:11px; --radius-selector:999px;
  --ink:#0D1424; --ink2:#39435A; --mut:#69748A; --faint:#98A2B3;
  --line:#E6E9F0; --line-soft:#EFF1F6;
  --sh-1:0 1px 2px rgba(13,20,36,.04);
  --sh-2:0 1px 3px rgba(13,20,36,.05), 0 8px 24px -8px rgba(13,20,36,.10);
  --sh-3:0 2px 6px rgba(13,20,36,.06), 0 18px 44px -12px rgba(13,20,36,.16);
}
*{ box-sizing:border-box; }
html,body{ max-width:100%; overflow-x:hidden; }
body{ margin:0; background:var(--color-base-200); color:var(--ink); font-size:14.5px; line-height:1.6;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased; letter-spacing:-.006em; }
h1,h2,h3{ letter-spacing:-.025em; }
.muted{ color:var(--mut); } .faint{ color:var(--faint); }
.err{ color:var(--color-error); font-size:13.5px; }
.msg{ color:var(--color-error); font-size:13.5px; margin-top:10px; min-height:16px; }
#leadmsg{ color:var(--color-success); }
.wfull{ width:100%; } .tblwrap{ overflow-x:auto; }
::selection{ background:#D6E1FF; }

/* ================================ topbar ================================ */
.topbar{ position:sticky; top:0; z-index:40; background:rgba(255,255,255,.86); backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line); }
.topbar-inner{ max-width:1240px; margin:0 auto; padding:11px 24px; display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
.sbrand{ font-size:15.5px; font-weight:800; letter-spacing:-.03em; white-space:nowrap; display:flex; align-items:center; gap:10px; }
.blogo{ width:30px; height:30px; border-radius:9px; display:inline-flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:800; color:#fff; background:linear-gradient(145deg,#2F62F5,#6D5AE6);
  box-shadow:0 2px 8px rgba(47,98,245,.32); }
.navwrap{ overflow-x:auto; scrollbar-width:none; min-width:0; max-width:100%; } .navwrap::-webkit-scrollbar{ display:none; }
.nav{ display:flex; gap:2px; }
.nv{ border:0; background:transparent; color:var(--mut); font:inherit; font-size:13.5px; font-weight:600;
  padding:7px 13px; border-radius:9px; cursor:pointer; white-space:nowrap; transition:color .14s,background .14s; }
.nv:hover{ color:var(--ink); background:var(--color-base-200); }
.nv.on{ color:var(--ink); background:var(--color-base-200); }
.topacts{ margin-left:auto; display:flex; gap:6px; align-items:center; }

/* ================================= page ================================= */
.content{ max-width:1240px; margin:0 auto; padding:26px 24px 60px; }
.page-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin:2px 0 20px; }
.page-head .t{ font-size:26px; font-weight:800; line-height:1.15; }
.page-head .sub,.sub{ font-size:14px; color:var(--mut); }
.page-head .sub{ margin:6px 0 0; max-width:660px; }

/* ================================ panels ================================ */
.panel{ background:#fff; border:1px solid var(--line); border-radius:var(--radius-box); padding:20px 22px; margin-bottom:18px; box-shadow:var(--sh-1); }
.panel h2{ font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.09em; color:var(--faint); margin:0 0 15px; display:flex; align-items:center; gap:9px; }
.panel.warn{ border-color:#F4C9C9; background:linear-gradient(180deg,#FFF9F9,#fff 70px); }

/* ============================== assistant =============================== */
/* NB: must not be called .hero - daisyUI ships its own .hero component that
   forces every child into a single grid cell, stacking them on top of each other. */
.askhero{ text-align:center; padding:48px 0 10px; }
.askhero .eyebrow{ font-size:12px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--color-primary); margin-bottom:14px; }
.askhero h1{ font-size:40px; font-weight:800; margin:0 0 12px; line-height:1.1; }
.askhero p{ font-size:16px; color:var(--mut); max-width:560px; margin:0 auto 30px; line-height:1.55; }
.askwrap{ max-width:680px; margin:0 auto; position:relative; }
.askwrap::before{ content:""; position:absolute; inset:-18px -18px; border-radius:32px;
  background:radial-gradient(60% 100% at 50% 0%, rgba(47,98,245,.13), transparent 70%); pointer-events:none; }
.askbox{ position:relative; display:flex; gap:9px; align-items:center; background:#fff; border:1.5px solid var(--line);
  border-radius:15px; padding:8px 8px 8px 18px; box-shadow:var(--sh-3); transition:border-color .16s, box-shadow .16s; }
.askbox:focus-within{ border-color:var(--color-primary); box-shadow:0 0 0 4px rgba(47,98,245,.11), var(--sh-3); }
.askbox input{ flex:1; border:0; outline:0; font:inherit; font-size:15.5px; background:transparent; color:var(--ink); min-width:0; padding:9px 0; }
.askbox input::placeholder{ color:var(--faint); }
.askgo{ border:0; border-radius:11px; background:linear-gradient(145deg,#2F62F5,#5B54EE); color:#fff; font:inherit;
  font-size:14.5px; font-weight:650; padding:11px 20px; cursor:pointer; white-space:nowrap; box-shadow:0 2px 10px rgba(47,98,245,.3); transition:filter .14s, transform .1s; }
.askgo:hover{ filter:brightness(1.07); } .askgo:active{ transform:translateY(1px); }
.askgo:disabled{ opacity:.55; cursor:default; }
.egs{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:18px; }
.eg{ font-size:12.5px; color:var(--ink2); background:#fff; border:1px solid var(--line); border-radius:999px;
  padding:6px 13px; cursor:pointer; transition:border-color .14s, color .14s; }
.eg:hover{ border-color:var(--color-primary); color:var(--color-primary); }

/* thinking state */
.think{ max-width:680px; margin:30px auto 0; background:#fff; border:1px solid var(--line); border-radius:var(--radius-box); padding:22px 24px; box-shadow:var(--sh-2); }
.think .row{ display:flex; align-items:center; gap:12px; font-size:14px; color:var(--ink2); }
.think .bar{ height:4px; border-radius:99px; background:var(--color-base-300); margin-top:16px; overflow:hidden; }
.think .bar i{ display:block; height:100%; width:34%; border-radius:99px; background:linear-gradient(90deg,#2F62F5,#6D5AE6);
  animation:slide 1.6s ease-in-out infinite; }
@keyframes slide{ 0%{ margin-left:-34% } 100%{ margin-left:100% } }
.think .steps{ margin-top:14px; font-size:12.5px; color:var(--faint); }

/* ============================ research brief ============================ */
.brief{ max-width:1000px; margin:26px auto 0; }
.bhead{ background:#fff; border:1px solid var(--line); border-radius:var(--radius-box); padding:24px 26px; box-shadow:var(--sh-2); margin-bottom:16px; }
.bhead .top{ display:flex; gap:22px; align-items:flex-start; flex-wrap:wrap; }
.bhead .nm{ flex:1; min-width:220px; }
.bhead h2{ font-size:25px; font-weight:800; margin:0 0 4px; letter-spacing:-.03em; overflow-wrap:anywhere; }
.bhead .dm{ font-size:13.5px; color:var(--mut); overflow-wrap:anywhere; }
.bhead .hl{ font-size:16px; color:var(--ink2); margin-top:14px; line-height:1.5; }
.ring{ width:112px; height:112px; border-radius:50%; flex:none; display:grid; place-items:center; position:relative;
  background:conic-gradient(var(--rc) calc(var(--pct)*1%), var(--color-base-300) 0); }
.ring::after{ content:""; position:absolute; inset:9px; border-radius:50%; background:#fff; }
/* z-index is load-bearing: ::after is the last child, so without it the white
   inner circle paints over the score and the number is invisible. */
.ring .v{ position:relative; z-index:1; text-align:center; line-height:1; }
.ring .v b{ font-size:40px; font-weight:800; letter-spacing:-.05em; display:block; }
.ring .v span{ display:block; font-size:10px; color:var(--faint); font-weight:700; margin-top:4px; letter-spacing:.06em; text-transform:uppercase; }

/* fact pills under the company name */
.pillrow{ display:flex; gap:7px; flex-wrap:wrap; margin-top:12px; }
.pill{ font-size:12px; font-weight:650; border-radius:999px; padding:5px 12px; background:var(--color-base-200); color:var(--ink2); white-space:nowrap; }

/* one-line heads-up strip - lighter than the old red block */
.heads{ display:flex; gap:11px; align-items:flex-start; border-radius:14px; padding:13px 16px; margin-bottom:14px; font-size:14px; line-height:1.5; }
.heads.amber{ background:#FFFBEB; border:1px solid #F0DFB0; color:#78500A; }
.heads.green{ background:#F0FDF6; border:1px solid #BCE7D0; color:#0A6B4A; }
.heads.red{ background:#FEF3F2; border:1px solid #F3C7C2; color:#8E1F1F; }
.heads .hi{ flex:none; font-size:15px; line-height:1.35; }
.heads b{ font-weight:750; }

/* the action card - what the rep actually does next */
.action{ background:#fff; border:1px solid var(--line); border-radius:var(--radius-box); box-shadow:var(--sh-2); margin-bottom:16px; overflow:hidden; }
.action .ah{ padding:18px 22px 0; }
.action h3{ font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.09em; color:var(--faint); margin:0 0 14px; }
.who{ display:flex; align-items:center; gap:12px; padding:0 22px 16px; flex-wrap:wrap; }
.who .wn{ font-weight:750; font-size:15.5px; }
.who .wt{ font-size:13.5px; color:var(--mut); }
.who .wm{ margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }
.sayblock{ padding:0 22px 18px; }
.saylbl{ font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--faint); margin-bottom:8px; display:flex; align-items:center; gap:10px; }
.nextbar{ background:linear-gradient(135deg,#0D1424,#212E4C); color:#fff; padding:15px 22px; display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
.nextbar .nl{ font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#8DA3D6; }
.nextbar .nv{ font-size:16px; font-weight:750; }
.nextbar .nd{ font-size:13.5px; color:#C3CFE6; flex:1 1 260px; min-width:0; line-height:1.45; }

/* accordions - everything that is not needed at a glance */
.acc{ background:#fff; border:1px solid var(--line); border-radius:14px; margin-bottom:9px; box-shadow:var(--sh-1); }
.acc>summary{ list-style:none; cursor:pointer; padding:14px 18px; display:flex; align-items:center; gap:10px;
  font-weight:650; font-size:14.5px; border-radius:14px; }
.acc>summary::-webkit-details-marker{ display:none; }
.acc>summary:hover{ background:var(--color-base-200); }
.acc .am{ margin-left:auto; font-size:12.5px; color:var(--faint); font-weight:500; }
.acc .cv{ width:8px; height:8px; border-right:2px solid var(--faint); border-bottom:2px solid var(--faint);
  transform:rotate(45deg); transition:transform .16s; flex:none; margin-left:2px; }
.acc[open]>summary .cv{ transform:rotate(-135deg); }
.acc[open]>summary{ border-radius:14px 14px 0 0; }
.acc .ab{ padding:2px 18px 16px; font-size:14px; color:var(--ink2); line-height:1.6; overflow-wrap:anywhere; }
.acc .ab p{ margin:0 0 10px; } .acc .ab p:last-child{ margin-bottom:0; }
.bandpill{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; border-radius:999px; padding:5px 13px; }
.metaline{ display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--faint); margin-top:16px; padding-top:14px; border-top:1px solid var(--line-soft); }
/* minmax(0,1fr) so an unbreakable URL can't inflate the track's min-content width */
.bgrid{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; margin-bottom:16px; }
@media (max-width:820px){ .bgrid{ grid-template-columns:minmax(0,1fr); } }
.bcard{ background:#fff; border:1px solid var(--line); border-radius:var(--radius-box); padding:19px 21px; box-shadow:var(--sh-1); min-width:0; overflow-wrap:anywhere; }
.bcard h3{ font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.09em; color:var(--faint); margin:0 0 12px; }
.bcard p{ margin:0 0 10px; font-size:14px; color:var(--ink2); line-height:1.6; overflow-wrap:anywhere; }
.bcard p:last-child{ margin-bottom:0; }
.alertbar{ border-radius:var(--radius-box); padding:14px 18px; margin-bottom:16px; font-size:14px; display:flex; gap:11px; align-items:flex-start; }
.alertbar.red{ background:#FEF2F2; border:1px solid #F4C9C9; color:#8F1D1D; }
.alertbar.amber{ background:#FFFBEB; border:1px solid #F2DFAE; color:#7A4E07; }
.alertbar.green{ background:#F0FDF6; border:1px solid #BFE8D3; color:#0A6B4A; }
.alertbar b{ font-weight:750; }
.quote{ background:linear-gradient(135deg,#F4F7FF,#FAFBFF); border:1px solid #DCE5FB; border-left:3px solid var(--color-primary);
  border-radius:0 12px 12px 0; padding:15px 18px; font-size:15.5px; line-height:1.55; color:var(--ink); margin:0 0 12px; }
.copybtn{ font-size:11.5px; font-weight:650; color:var(--color-primary); background:transparent; border:0; cursor:pointer; padding:0; }
.tp{ display:flex; gap:11px; padding:11px 0; border-bottom:1px solid var(--line-soft); }
.tp:last-child{ border-bottom:0; } .tp .n{ flex:none; width:21px; height:21px; border-radius:6px; background:var(--color-base-200);
  color:var(--ink2); font-size:11.5px; font-weight:700; display:grid; place-items:center; margin-top:2px; }
.tp .b{ font-size:14px; color:var(--ink); line-height:1.5; } .tp .w{ font-size:12.5px; color:var(--mut); margin-top:3px; line-height:1.5; }
.ccard{ border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:10px; transition:border-color .14s, box-shadow .14s; }
.ccard:hover{ border-color:#C9D6F7; box-shadow:var(--sh-1); }
.ccard .r1{ display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; }
.ccard .nm{ font-weight:700; font-size:14.5px; } .ccard .ti{ font-size:13px; color:var(--mut); }
.ccard .r2{ font-size:12.5px; color:var(--mut); margin-top:5px; display:flex; gap:12px; flex-wrap:wrap; }
.ccard .why{ font-size:13px; color:var(--ink2); margin-top:8px; line-height:1.5; }
.evid{ font-size:13px; color:var(--ink2); padding:8px 0; border-bottom:1px solid var(--line-soft); line-height:1.55; }
.evid:last-child{ border-bottom:0; }
.evid .src{ font-size:11.5px; color:var(--faint); display:block; margin-top:2px; overflow-wrap:anywhere; }
.nextact{ background:linear-gradient(145deg,#0D1424,#1E2A45); color:#fff; border-radius:var(--radius-box); padding:20px 24px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
.nextact .lbl{ font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:#8FA5D9; }
.nextact .ac{ font-size:19px; font-weight:750; margin-top:3px; }
.nextact .dt{ font-size:14px; color:#C7D2E8; margin-top:5px; line-height:1.5; max-width:640px; }

/* ================================ stats ================================= */
.statwrap{ overflow-x:auto; margin-bottom:18px; }
.statgrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
.st{ background:#fff; border:1px solid var(--line); border-radius:var(--radius-box); padding:15px 17px; box-shadow:var(--sh-1); }
.st .l{ font-size:12px; font-weight:600; color:var(--mut); }
.st .v{ font-size:27px; font-weight:800; letter-spacing:-.03em; margin-top:5px; font-variant-numeric:tabular-nums; }
.st .d{ font-size:11.5px; color:var(--faint); margin-top:2px; }
.st.alarm .v{ color:var(--color-error); } .st.ok .v{ color:var(--color-success); }

/* =============================== worklist =============================== */
.actrow{ display:flex; align-items:center; gap:13px; padding:12px 8px; border-bottom:1px solid var(--line-soft); flex-wrap:wrap; border-radius:10px; transition:background .12s; }
.actrow:hover{ background:var(--color-base-200); }
.actrow:last-child{ border-bottom:0; }
.actrow .co{ flex:1 1 220px; min-width:180px; }
.actrow .co b{ font-weight:700; overflow-wrap:anywhere; }
.actrow .co .dom{ font-size:12px; color:var(--faint); overflow-wrap:anywhere; }
.waitchip{ font-variant-numeric:tabular-nums; font-size:12px; font-weight:700; color:#9A5B08; background:#FEF6E7; border-radius:999px; padding:4px 11px; white-space:nowrap; }
.repchip{ display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:600; white-space:nowrap; }
.avi{ width:25px; height:25px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:10px; font-weight:800; color:#fff; flex:none; }

/* ============================== rep cards =============================== */
.repgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(238px,1fr)); gap:12px; }
.repcard{ border:1px solid var(--line); border-radius:14px; padding:15px 17px; transition:box-shadow .14s; }
.repcard:hover{ box-shadow:var(--sh-1); }
.repcard .rh{ display:flex; align-items:center; gap:11px; margin-bottom:13px; }
.repcard .rh .avi{ width:36px; height:36px; font-size:13px; }
.repcard .rh b{ font-size:14.5px; } .repcard .rh .la{ font-size:11.5px; color:var(--faint); }
.repmetrics{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; text-align:center; }
.repmetrics .m b{ display:block; font-size:16px; font-weight:800; font-variant-numeric:tabular-nums; }
.repmetrics .m span{ font-size:10.5px; color:var(--faint); }

/* ================================ tables ================================ */
.table{ font-size:13.5px; }
.table thead th{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:700; user-select:none; white-space:nowrap; }
.table thead th[onclick]{ cursor:pointer; }
.table td{ vertical-align:top; }
td.num,th.num{ text-align:right; font-variant-numeric:tabular-nums; }
.company-cell{ font-weight:650; overflow-wrap:anywhere; min-width:140px; }
.crow{ cursor:pointer; } .crow:hover{ background:var(--color-base-200); }

/* =============================== controls =============================== */
.daterow,.controls{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.controls{ margin-bottom:13px; } .controls .input{ flex:1; min-width:170px; }
.chip,.dchip,.lt{ border:1px solid var(--line); background:#fff; border-radius:999px; padding:6px 14px; font-size:12.5px; font-weight:600; cursor:pointer; color:var(--ink2); white-space:nowrap; transition:border-color .14s,color .14s,background .14s; }
.chip:hover,.dchip:hover,.lt:hover{ border-color:#C4D2F6; }
.chip.active,.dchip.active,.lt.active{ border-color:var(--color-primary); background:#EEF3FF; color:var(--color-primary); }
.count{ font-size:12px; color:var(--mut); margin:8px 0; }
.foot{ font-size:11.5px; color:var(--faint); margin-top:12px; line-height:1.9; }
.empty{ text-align:center; padding:30px 12px; color:var(--faint); font-size:13.5px; }
.empty .ei{ font-size:28px; margin-bottom:8px; }

/* ================================= auth ================================= */
.authwrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  background:radial-gradient(70% 60% at 50% 0%, #EAF0FF, var(--color-base-200) 60%); }
.card-auth{ max-width:396px; width:100%; background:#fff; border:1px solid var(--line); border-radius:20px; padding:34px; box-shadow:var(--sh-3); text-align:center; }
.card-auth .blogo{ width:46px; height:46px; border-radius:14px; font-size:19px; margin:0 auto 14px; }
.card-auth h2{ margin:0 0 5px; font-size:20px; font-weight:800; }
.card-auth p{ color:var(--mut); font-size:13.5px; margin:0 0 16px; }
.card-auth .input{ margin:9px 0; text-align:left; }
.row{ display:flex; gap:8px; margin-top:13px; justify-content:center; }

/* ================================ modal ================================= */
.modalbg{ position:fixed; inset:0; background:rgba(13,20,36,.5); backdrop-filter:blur(3px); display:none; align-items:flex-start; justify-content:center; z-index:50; padding:34px 14px; overflow:auto; }
.mcard{ background:#fff; border-radius:18px; max-width:790px; width:100%; box-shadow:0 28px 80px rgba(13,20,36,.35); max-height:90vh; display:flex; flex-direction:column; }
.mhead{ display:flex; align-items:center; gap:9px; padding:17px 22px; border-bottom:1px solid var(--line); position:sticky; top:0; background:#fff; border-radius:18px 18px 0 0; z-index:1; }
.mhead b{ font-size:16px; font-weight:800; overflow-wrap:anywhere; }
.mx{ margin-left:auto; cursor:pointer; font-size:23px; color:var(--faint); line-height:1; padding:0 2px; }
.mx:hover{ color:var(--ink); }
.mbody{ padding:18px 22px; overflow:auto; flex:1; min-height:0; }

<script>
var URL_="https://bbklqpmojvfoqsmxbtfv.supabase.co";
var KEY_="sb_publishable_ayYFZV0wGJ-dM8VHpbaJiQ_ogINqgTH";
var DATA_=URL_+"/functions/v1/activity-data";
var DETAIL_=URL_+"/functions/v1/company-detail";
var CDET_=URL_+"/functions/v1/campaign-detail";
var CAMP_=URL_+"/functions/v1/campaign-tools";
var MON_=URL_+"/functions/v1/monitor"; var MONloaded=false;
var SIM_=URL_+"/functions/v1/crm-sim"; var SIMloaded=false;
var LEADS_=URL_+"/functions/v1/leads";
var ASK_=URL_+"/functions/v1/prospect-research";
var LEADS=[], LEADSloaded=false, leadFilter="new", MEEMAIL="";
var sb=supabase.createClient(URL_,KEY_);
var app=document.getElementById("app");
var DATA=[], sortK="rank", sortDir=-1, filter="all";
var ACTIONS=[], wlRep="all";
var PAGE=1, PAGE_SIZE=100;
var RANGE={from:null,to:null,preset:7};
var ASKING=false, ASKTIMER=null;
function h(x){app.innerHTML=x;}
function val(id){var e=document.getElementById(id);return e?e.value:"";}
function setMsg(m){var e=document.getElementById("msg");if(e)e.textContent=m||"";}
var nf=function(v){return (Number(v)||0).toLocaleString();};
function pct(a,b){return b>0?Math.round(100*a/b)+"%":"-";}
function isoDay(d){return d.toISOString().slice(0,10);}
function fmtDate(s){if(!s)return"-";var d=new Date(s);return isNaN(d)?"-":d.toLocaleDateString("en-GB",{day:"2-digit",month:"short"});}
function spinner(t){return '<p class="sub" style="display:flex;align-items:center;gap:9px"><span class="loading loading-spinner loading-sm"></span>'+(t||"Loading...")+'</p>';}
function esc(t){ return (t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function initials(n){ return (n||"?").trim().split(/\s+/).map(function(w){return w[0]||"";}).join("").slice(0,2).toUpperCase(); }
var AV=["#2F62F5","#6D5AE6","#0E9488","#0E9F6E","#C2740B","#DB2777"];
function avColor(n){ n=n||"?"; var s=0; for(var i=0;i<n.length;i++) s=(s*31+n.charCodeAt(i))>>>0; return AV[s%AV.length]; }
function avatar(n,cls){ return '<span class="avi'+(cls?' '+cls:'')+'" style="background:'+avColor(n)+'">'+initials(n)+'</span>'; }
function defaultRange(){var to=new Date();var from=new Date(Date.now()-7*86400000);RANGE={from:isoDay(from),to:isoDay(to),preset:7};}
async function boot(){
  var s=await sb.auth.getSession();
  if(!s.data.session){return login();}
  if(!RANGE.from) defaultRange();
  loadData();
}
async function loadData(){
  var s=await sb.auth.getSession();
  if(!s.data.session){return login();}
  app.innerHTML='<div class="content">'+spinner()+'</div>';
  var url=DATA_+"?from="+RANGE.from+"&to="+RANGE.to;
  var res;
  try{ res=await fetch(url,{headers:{Authorization:"Bearer "+s.data.session.access_token,apikey:KEY_}}); }
  catch(e){ return errScreen("Could not reach the data service."); }
  if(res.status===401){ await sb.auth.signOut(); return login(); }
  if(res.status===403){ var p=await res.json().catch(function(){return{};}); return pending(p.email||s.data.session.user.email); }
  if(!res.ok){ return errScreen("Server error ("+res.status+")."); }
  var payload=await res.json();
  if(!payload.ok){ return errScreen(payload.error||"Unknown error."); }
  renderDash(payload);
}
function login(){
  h('<div class="authwrap"><div class="card-auth"><span class="blogo">C</span><h2>Cal Sameday</h2><p>Sales assistant - sign in to continue.</p>'+
    '<input id="em" class="input wfull" placeholder="Work email"><input id="pw" type="password" class="input wfull" placeholder="Password">'+

    '<div id="msg" class="msg"></div></div></div>');
}
async function doIn(){ setMsg(""); var r=await sb.auth.signInWithPassword({email:val("em"),password:val("pw")}); if(r.error){setMsg(r.error.message);} else { boot(); } }
async function doUp(){ setMsg(""); var r=await sb.auth.signUp({email:val("em"),password:val("pw")}); if(r.error){setMsg(r.error.message);} else { setMsg("Request sent. An admin will approve you, then sign in."); } }
function pending(email){ h('<div class="authwrap"><div class="card-auth"><span class="blogo">C</span><h2>Awaiting approval</h2><p><b>'+esc(email)+'</b> is signed in, but an admin has not approved access yet.</p><div class="row"><button class="btn btn-primary" onclick="boot()">Check again</button><button class="btn btn-soft" onclick="out()">Sign out</button></div></div></div>'); }
function errScreen(m){ h('<div class="authwrap"><div class="card-auth"><span class="blogo">C</span><h2>Something went wrong</h2><p>'+esc(m)+'</p><div class="row"><button class="btn btn-primary" onclick="boot()">Retry</button><button class="btn btn-soft" onclick="out()">Sign out</button></div></div></div>'); }
async function out(){ await sb.auth.signOut(); boot(); }

/* =========================== ASSISTANT (home) =========================== */
var STEPS=["Reading their website...","Checking Cal's own records...","Looking for the right people...","Mapping their sites to Cal's coverage...","Working out the angle...","Writing the brief..."];
function setExample(t){ var i=document.getElementById("askq"); if(i){ i.value=t; i.focus(); } }
function askKey(e){ if(e.key==="Enter") runAsk(); }
function assistantView(){
  return '<div id="view-assistant" class="view">'+
    '<div class="askhero">'+
      '<div class="eyebrow">Sales assistant</div>'+
      '<h1>Who are we selling to?</h1>'+
      '<p>Paste a work email, a website, or just a company name. I\'ll research them, score the fit, tell you who to call and how to open.</p>'+
      '<div class="askwrap"><div class="askbox">'+
        '<input id="askq" placeholder="ops@company.co.uk   ·   company.co.uk   ·   Company Ltd" onkeydown="askKey(event)" autocomplete="off">'+
        '<button class="askgo" id="askbtn" onclick="runAsk()">Research</button>'+
      '</div></div>'+
      '<div class="egs">'+
        '<span class="eg" onclick="setExample(\'scott-med.co.uk\')">scott-med.co.uk</span>'+
        '<span class="eg" onclick="setExample(\'Alliance Healthcare\')">Alliance Healthcare</span>'+
        '<span class="eg" onclick="setExample(\'thomasplanthire.co.uk\')">thomasplanthire.co.uk</span>'+
      '</div>'+
    '</div>'+
    '<div id="askout"></div>'+
  '</div>';
}
// The function replies with NDJSON (one JSON object per line): status lines
// while it works, then a final result line. It cannot be read with r.json() -
// research runs for minutes and the platform kills a connection that sits idle,
// so the stream is what keeps it alive.
function runAsk(){
  if(ASKING) return;
  var q=(val("askq")||"").trim();
  var outEl=document.getElementById("askout");
  if(!q){ outEl.innerHTML='<div class="think"><div class="row">Enter an email, website or company name first.</div></div>'; return; }
  ASKING=true;
  var btn=document.getElementById("askbtn"); if(btn){ btn.disabled=true; btn.textContent="Researching..."; }
  var t0=Date.now(), done=false;
  outEl.innerHTML='<div class="think"><div class="row"><span class="loading loading-spinner loading-sm"></span><span id="thinkmsg">Starting research</span></div>'+
    '<div class="bar"><i></i></div><div class="steps" id="thinksub">Researching '+esc(q)+'</div></div>';
  ASKTIMER=setInterval(function(){
    var s=document.getElementById("thinksub");
    if(s) s.textContent="Researching "+q+" · "+Math.round((Date.now()-t0)/1000)+"s · a full brief usually takes 1-3 minutes";
  },1000);
  function say(m){ var e=document.getElementById("thinkmsg"); if(e) e.textContent=m; }
  function finish(result,errMsg){
    if(done) return; done=true; stopAsk();
    if(errMsg){ outEl.innerHTML=askError(errMsg); return; }
    if(!result||!result.brief){ outEl.innerHTML=askError("The research finished but returned no brief."); return; }
    outEl.innerHTML=renderBrief(result.brief,result.meta||{});
    var b=document.querySelector(".brief"); if(b) b.scrollIntoView({behavior:"smooth",block:"start"});
  }
  sb.auth.getSession().then(function(s){
    if(!s.data.session){ stopAsk(); return login(); }
    return fetch(ASK_,{method:"POST",headers:{Authorization:"Bearer "+s.data.session.access_token,apikey:KEY_,"Content-Type":"application/json"},body:JSON.stringify({query:q})})
      .then(function(r){
        var ct=r.headers.get("content-type")||"";
        // Errors (401/403/400/500) still come back as a single JSON object.
        if(!r.ok || ct.indexOf("ndjson")<0 || !r.body){
          return r.json().then(function(d){
            finish(null,(d&&d.error)||(d&&d.code==="login"?"Your session expired - sign in again.":"Server error ("+r.status+")."));
          },function(){ finish(null,"Server error ("+r.status+")."); });
        }
        var reader=r.body.getReader(), dec=new TextDecoder(), buf="", result=null, errMsg=null;
        function handle(line){
          var o; try{ o=JSON.parse(line); }catch(e){ return; }
          if(o.type==="status") say(o.msg);
          else if(o.type==="result") result=o;
          else if(o.type==="error") errMsg=o.error||"Research failed.";
        }
        function pump(){
          return reader.read().then(function(res){
            if(res.done){
              if(buf.trim()) handle(buf.trim());
              finish(result,errMsg);
              return;
            }
            buf+=dec.decode(res.value,{stream:true});
            var parts=buf.split("\n"); buf=parts.pop();
            for(var i=0;i<parts.length;i++){ var l=parts[i].trim(); if(l) handle(l); }
            return pump();
          });
        }
        return pump();
      });
  }).catch(function(e){ finish(null,"Lost connection to the research service. "+String(e&&e.message||"").slice(0,120)); });
}
function stopAsk(){ ASKING=false; if(ASKTIMER){ clearInterval(ASKTIMER); ASKTIMER=null; } var b=document.getElementById("askbtn"); if(b){ b.disabled=false; b.textContent="Research"; } }
function askError(m){
  var extra = (m&&m.indexOf("ANTHROPIC_API_KEY")>=0)
    ? '<div class="steps" style="margin-top:10px">Add <b>ANTHROPIC_API_KEY</b> in the Supabase dashboard under Edge Functions &rarr; Secrets, then try again.</div>' : '';
  return '<div class="think"><div class="row" style="color:var(--color-error)"><b>'+esc(m||"Something went wrong.")+'</b></div>'+extra+'</div>';
}
var BANDCOL={"Strong fit":["#0E9F6E","#E7F8F0","#0A6B4A"],"Worth a call":["#2F62F5","#EEF3FF","#1E45B8"],"Marginal":["#C2740B","#FEF6E7","#7A4E07"],"Not a fit":["#98A2B3","#F2F4F8","#5B6577"],"Competitor":["#DC2626","#FEF2F2","#8F1D1D"]};
function copyLine(btn){
  var box=(btn.closest&&btn.closest(".sayblock"))||btn.parentElement;
  var q=box?box.querySelector(".quote"):null;
  if(!q) return;
  navigator.clipboard.writeText(q.textContent.trim()).then(function(){ btn.textContent="Copied"; setTimeout(function(){ btn.textContent="Copy"; },1600); });
}
// Progressive disclosure: only the verdict and the action are shown up front.
function acc(title,meta,bodyHtml,open){
  if(!bodyHtml) return "";
  return '<details class="acc"'+(open?" open":"")+'><summary><span>'+title+'</span>'+
    (meta?'<span class="am">'+esc(meta)+'</span>':'<span class="am"></span>')+'<span class="cv"></span></summary>'+
    '<div class="ab">'+bodyHtml+'</div></details>';
}
function renderBrief(b,meta){
  if(!b) return askError("Empty result.");
  var v=b.verdict||{}, c=b.company||{}, rel=b.relationship||{}, cov=b.coverage||{}, ap=b.approach||{}, na=b.next_action||{};
  var col=BANDCOL[v.band]||BANDCOL["Marginal"];
  // Belt and braces: the schema pins the score to 0-10, but if a model ever
  // returns a 0-100 style score, rescale rather than clamping everything to 10.
  var raw=Number(v.score)||0;
  var score=Math.max(0,Math.min(10, raw>10?Math.round(raw/10):Math.round(raw)));
  var covCol={"Core territory":"green","Strong":"green","Active":"amber","Thin coverage":"amber","Unknown":"amber"}[cov.verdict]||"amber";

  // ---- 1. Verdict at a glance --------------------------------------------
  var pills='<div class="pillrow">'+
    '<span class="pill" style="background:'+col[1]+';color:'+col[2]+'">'+esc(v.band||"")+'</span>'+
    (v.segment?'<span class="pill">'+esc(v.segment)+'</span>':'')+
    (cov.verdict?'<span class="pill">'+esc(cov.verdict)+(cov.best_area?" · "+esc(cov.best_area):"")+'</span>':'')+
    (c.size_signal?'<span class="pill">'+esc(c.size_signal)+'</span>':'')+
    (v.confidence?'<span class="pill" style="color:var(--mut)">'+esc(v.confidence)+' confidence</span>':'')+
  '</div>';
  var head='<div class="bhead"><div class="top">'+
    '<div class="ring" style="--pct:'+(score*10)+';--rc:'+col[0]+'"><div class="v"><b>'+score+'</b><span>out of 10</span></div></div>'+
    '<div class="nm"><h2>'+esc(c.name||meta.resolved_domain||"Unknown company")+'</h2>'+
      '<div class="dm">'+esc(c.domain||meta.resolved_domain||"")+'</div>'+
      pills+
      (v.headline?'<div class="hl">'+esc(v.headline)+'</div>':'')+
    '</div></div>'+
    '<div class="metaline"><span>'+esc(meta.model||"")+'</span><span>'+(meta.web_searches||0)+' web lookups</span><span>'+(meta.apollo_contacts||0)+' Apollo contacts</span><span>'+(meta.seconds||0)+'s</span>'+
      (meta.cal_records_found&&meta.cal_records_found.emails?'<span>'+meta.cal_records_found.emails+' emails on file</span>':'')+'</div>'+
  '</div>';

  // ---- 2. One heads-up line, not a wall of red ---------------------------
  var wl=(rel.warnings||[]).filter(Boolean);
  var heads="";
  if(rel.status==="Existing customer"){
    heads='<div class="heads green"><span class="hi">&#10003;</span><div><b>Already a Cal customer.</b> '+esc(rel.summary||"")+'</div></div>';
  } else if(wl.length){
    heads='<div class="heads amber"><span class="hi">&#9888;</span><div><b>Heads up.</b> '+esc(wl[0])+
      (wl.length>1?' <span class="muted">('+(wl.length-1)+' more in Our history below)</span>':'')+'</div></div>';
  }

  // ---- 3. What the rep actually does -------------------------------------
  var top=(b.contacts||[])[0];
  var who = top
    ? '<div class="who">'+avatar(top.name)+'<div><div class="wn">'+esc(top.name)+'</div><div class="wt">'+esc(top.title||"")+(top.location?' · '+esc(top.location):'')+'</div></div>'+
      '<div class="wm">'+(top.best_call_window?'<span class="pill">&#9200; '+esc(top.best_call_window)+'</span>':'')+
      (top.email?'<span class="pill">'+esc(top.email)+'</span>':(top.email_status?'<span class="pill" style="color:var(--mut)">email '+esc(top.email_status)+'</span>':''))+'</div></div>'
    : '<div class="who"><div class="wt">No named contact found yet - try the Leads tab to run contact discovery.</div></div>';
  var action='<div class="action">'+
    '<div class="ah"><h3>Your call</h3></div>'+who+
    (ap.opening_line?'<div class="sayblock"><div class="saylbl">Open with <button class="copybtn" onclick="copyLine(this)">Copy</button></div><div class="quote">'+esc(ap.opening_line)+'</div></div>':'')+
    '<div class="nextbar"><div><div class="nl">Next</div><div class="nv">'+esc(na.action||"-")+'</div></div><div class="nd">'+esc(na.detail||"")+'</div></div>'+
  '</div>';

  // ---- 4. Everything else, one click away --------------------------------
  var evHtml=(v.evidence||[]).map(function(e){ return '<div class="evid">'+esc(e.fact)+'<span class="src">'+esc(e.source)+'</span></div>'; }).join("");
  var whyBody='<p>'+esc(v.reasoning||"-")+'</p>'+(evHtml?'<div style="margin-top:12px">'+evHtml+'</div>':'');

    '<p class="muted" style="font-size:13px"><b>Coverage:</b> '+esc(cov.detail||"-")+'</p>';

  }).join("")+

    (ap.avoid?'<p class="muted" style="font-size:13px"><b>Don\'t lead with:</b> '+esc(ap.avoid)+'</p>':'');

  var restContacts=(b.contacts||[]).slice(1);

    ? restContacts.map(function(p){
        return '<div class="ccard"><div class="r1"><span class="nm">'+esc(p.name)+'</span><span class="ti">'+esc(p.title)+'</span></div>'+
          '<div class="r2">'+(p.location?'<span>&#128205; '+esc(p.location)+'</span>':'')+
          (p.email?'<span>&#9993; '+esc(p.email)+'</span>':(p.email_status?'<span class="faint">email '+esc(p.email_status)+'</span>':''))+
          (p.best_call_window?'<span>&#9200; '+esc(p.best_call_window)+'</span>':'')+'</div>'+
          (p.why_them?'<div class="why">'+esc(p.why_them)+'</div>':'')+'</div>';
      }).join("")
    : "";

  var relBody='<p>'+esc(rel.summary||"-")+'</p>'+
    '<p class="muted" style="font-size:13px">Status: <b>'+esc(rel.status||"-")+'</b></p>'+
    (wl.length?'<div style="margin-top:10px">'+wl.map(function(w){ return '<div class="evid">'+esc(w)+'</div>'; }).join("")+'</div>':"");

  var body=acc("Why "+score+" out of 10", v.confidence?v.confidence+" confidence":"", whyBody)+
    acc("What they do", (c.uk_locations||[]).length?(c.uk_locations||[]).length+" UK sites":"", aboutBody)+
    acc("Talking points", (ap.talking_points||[]).length?(ap.talking_points||[]).length+"":"", tpsBody)+
    acc("Other contacts", restContacts.length?restContacts.length+"":"", contactsBody)+
    acc("Our history with them", rel.status||"", relBody);

  return '<div class="brief">'+head+heads+action+body+'</div>';
}

  DATA=p.companies||[];
  var adminBtn=p.is_admin?'<button class="btn btn-ghost btn-sm" onclick="adminView()">Manage users</button>':'';
  var twoRate=s.prospects>0?Math.round(100*s.two_way/s.prospects):0;
  var stats='<div class="statwrap"><div class="statgrid">'+
    stat("Reply due",nf(s.followups_due),"24h SLA",Number(s.followups_due)>0?"alarm":"ok")+
    stat("Active prospects",nf(s.prospects),nf(s.customers)+" existing customers flagged")+
    stat("Two-way",nf(s.two_way),twoRate+"% of active replied")+
    stat("Emails",nf(s.emails),"sent + received in range")+
    stat("Calls",nf(s.calls),(s.companies_called||0)+" companies &middot; "+(s.avg_calls||0)+" avg")+
    '</div></div>';
  h('<div class="topbar"><div class="topbar-inner">'+
      '<span class="sbrand"><span class="blogo">C</span>Cal Sameday</span>'+
      '<div class="navwrap"><nav class="nav">'+
        '<button class="nv on" data-v="assistant" onclick="setView(this)">Assistant</button>'+
        '<button class="nv" data-v="pipeline" onclick="setView(this)">Pipeline</button>'+
        '<button class="nv" data-v="leads" onclick="setView(this)">Leads</button>'+
        '<button class="nv" data-v="cold" onclick="setView(this)">Cold outreach</button>'+
        '<button class="nv" data-v="monitor" onclick="setView(this)">Monitor</button>'+
        '<button class="nv" data-v="simulation" onclick="setView(this)">Simulation</button>'+
      '</nav></div>'+
      '<div class="topacts">'+adminBtn+'<button class="btn btn-ghost btn-sm" onclick="out()">Sign out</button></div>'+
    '</div></div>'+
    '<div class="content">'+
    assistantView()+
    '<div id="view-cold" class="view" style="display:none">'+
      '<div class="page-head"><div><div class="t">Cold outreach</div><p class="sub">Your cold-email engine - sending health and campaign performance, synced from Instantly every 2 hours.</p></div></div>'+
      coldPanel(p.instantly)+
    '</div>'+
    '<div id="view-leads" class="view" style="display:none"><div class="page-head"><div><div class="t">New leads</div><p class="sub">AI-hunted and Apollo lookalike prospects. Assign one to yourself, add a note, then push it into HubSpot with you as the owner.</p></div></div><div id="leadboard">'+spinner()+'</div></div>'+
    '<div id="view-monitor" class="view" style="display:none"><div class="page-head"><div><div class="t">Monitor</div><p class="sub">Deliverability, campaign performance and the lead-to-contact funnel.</p></div></div><div id="monboard">'+spinner()+'</div></div>'+
    '<div id="view-simulation" class="view" style="display:none"><div class="page-head"><div><div class="t">Simulation</div><p class="sub">Dry-run preview of the automatic CRM updates and reminders. Nothing is written until you go live.</p></div></div><div id="simboard">'+spinner()+'</div></div>'+
    '<div id="view-pipeline" class="view" style="display:none">'+
    '<div class="page-head"><div><div class="t">Pipeline</div><p class="sub">Companies your reps emailed, across Front + Aircall. '+(p.range?p.range.from+" to "+p.range.to:"")+'.</p></div>'+dateBar()+'</div>'+
    worklistPanel()+
    stats+
    '<div class="panel"><h2>Team activity</h2>'+repCards(p.reps)+'</div>'+
    '<div class="panel"><h2>Prospects</h2>'+
      '<div class="controls"><input id="search" class="input input-sm" placeholder="Search company or domain..." oninput="PAGE=1;flt()">'+
      '<span class="chip active" data-f="all" onclick="setF(this)">All</span>'+
      '<span class="chip" data-f="two" onclick="setF(this)">Two-way</span>'+
      '<span class="chip" data-f="outbound" onclick="setF(this)">Outbound only</span>'+
      '<span class="chip" data-f="dev" onclick="setF(this)">Development</span>'+
      '<span class="chip" data-f="new" onclick="setF(this)">Net-new</span></div>'+
      '<div class="count" id="count"></div>'+
      '<div class="tblwrap"><table class="table table-sm"><thead><tr><th onclick="setSort(\'company\')">Company</th><th onclick="setSort(\'two_way\')">Status</th><th onclick="setSort(\'type\')">Type</th><th class="num" onclick="setSort(\'emails\')">Emails</th><th class="num" onclick="setSort(\'calls\')">Calls</th><th onclick="setSort(\'rep_list\')">Reps</th><th onclick="setSort(\'last_activity\')">Last activity</th></tr></thead><tbody id="rows"></tbody></table></div><div id="pager"></div>'+
      '<div class="foot">A company appears if a rep emailed it (outbound) with activity in the selected range. Inbound-only senders excluded. Source: Front + Aircall.</div>'+
    '</div>'+
    '</div></div>');
  flt();
  renderWorklist();
  var q=document.getElementById("askq"); if(q) q.focus();
}
function setF(el){ filter=el.getAttribute("data-f"); var cs=el.parentElement.querySelectorAll(".chip"); for(var i=0;i<cs.length;i++){cs[i].classList.toggle("active",cs[i]===el);} PAGE=1; flt(); }
function setSort(k){ if(sortK===k)sortDir*=-1; else {sortK=k; sortDir=(k==="company"||k==="rep_list"||k==="type")?1:-1;} PAGE=1; flt(); }
function pageGo(delta){ PAGE+=delta; flt(); var t=document.getElementById("search"); if(t) t.scrollIntoView({block:"start"}); }
function flt(){
  var term=(val("search")||"").toLowerCase();
  var rows=DATA.filter(function(d){
    if(filter==="two" && !d.two_way) return false;
    if(filter==="outbound" && d.two_way) return false;
    if(filter==="dev" && !d.is_development) return false;
    if(filter==="new" && d.is_customer) return false;
    if(term && !((d.company||"").toLowerCase().indexOf(term)>=0 || (d.domain||"").toLowerCase().indexOf(term)>=0)) return false;
    return true;
  });
  rows.sort(function(a,b){
    if(sortK==="rank"){ var ra=rankExcite(a), rb=rankExcite(b); if(ra!==rb) return ra-rb; var ea=Number(a.emails)||0, eb=Number(b.emails)||0; if(ea!==eb) return eb-ea; return (b.last_activity||"").localeCompare(a.last_activity||""); }
    var x,y;
    if(sortK==="two_way"){x=a.two_way?1:0;y=b.two_way?1:0;}
    else if(sortK==="type"){x=typeOf(a);y=typeOf(b);}
    else if(sortK==="company"||sortK==="rep_list"){x=(a[sortK]||"").toLowerCase();y=(b[sortK]||"").toLowerCase();}
    else if(sortK==="last_activity"){x=a.last_activity||"";y=b.last_activity||"";}
    else {x=Number(a[sortK])||0;y=Number(b[sortK])||0;}
    if(x<y)return -sortDir; if(x>y)return sortDir; return 0;
  });
  var total=rows.length;
  var pages=Math.max(1,Math.ceil(total/PAGE_SIZE));
  if(PAGE>pages)PAGE=pages; if(PAGE<1)PAGE=1;
  var startI=(PAGE-1)*PAGE_SIZE, endI=Math.min(startI+PAGE_SIZE,total);
  var cnt=document.getElementById("count"); if(cnt) cnt.textContent= total ? ("Showing "+(startI+1)+"-"+endI+" of "+total+" companies") : "0 companies";
  var tb=document.getElementById("rows"); if(!tb) return;
  tb.innerHTML=rows.slice(startI,endI).map(function(d){
    return '<tr class="crow" data-dom="'+esc(d.domain||"")+'" onclick="openCompany(this.getAttribute(\'data-dom\'))"><td class="company-cell">'+esc(d.company||d.domain)+'<div class="muted" style="font-weight:400">'+esc(d.domain||"")+'</div></td><td>'+statusBadge(d)+'</td><td>'+typeBadge(d)+'</td><td class="num">'+nf(d.emails)+'</td><td class="num">'+(Number(d.calls)?nf(d.calls):'<span class="muted">-</span>')+'</td><td>'+esc((d.rep_list||"").replace(/,/g,", "))+'</td><td>'+fmtDate(d.last_activity)+'</td></tr>';
  }).join("");
  var pg=document.getElementById("pager");
  if(pg){ if(pages<=1){ pg.innerHTML=""; } else { pg.innerHTML='<div class="pager"><button class="btn btn-soft btn-xs" '+(PAGE<=1?"disabled":"")+' onclick="pageGo(-1)">Prev</button><span>Page '+PAGE+' of '+pages+'</span><button class="btn btn-soft btn-xs" '+(PAGE>=pages?"disabled":"")+' onclick="pageGo(1)">Next</button></div>'; } }
}
async function adminView(){
  var us=(await sb.from("app_user").select("id,email,approved,is_admin")).data||[];
  var rows=us.map(function(u){var act=u.approved?'<span class="muted">approved</span>':'<button class="btn btn-primary btn-xs" onclick="appr(\''+u.id+'\')">Approve</button>';return '<tr><td>'+esc(u.email||u.id)+'</td><td>'+(u.is_admin?'<span class="badge badge-soft badge-info badge-sm">admin</span>':(u.approved?'<span class="badge badge-soft badge-success badge-sm">member</span>':'<span class="badge badge-soft badge-warning badge-sm">pending</span>'))+'</td><td>'+act+'</td></tr>';}).join("");
  h('<div class="content"><div class="page-head"><div><div class="t">Manage users</div></div><div class="daterow"><button class="btn btn-soft btn-sm" onclick="boot()">Back</button><button class="btn btn-soft btn-sm" onclick="out()">Sign out</button></div></div><div class="panel"><div class="tblwrap"><table class="table table-sm"><thead><tr><th>User</th><th>Status</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></div></div>');
}
async function appr(id){ await sb.from("app_user").update({approved:true}).eq("id",id); adminView(); }
boot();
</script>
