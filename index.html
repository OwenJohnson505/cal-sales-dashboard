<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cal Sameday - Sales Assistant</title>
<link href="https://cdn.jsdelivr.net/npm/daisyui@5/daisyui.css" rel="stylesheet" type="text/css">
<link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* map view + card view */
.viewseg{ display:inline-flex; gap:2px; background:#F5F5F7; border-radius:9px; padding:2px; margin-left:10px; }
.viewseg button{ border:none; background:transparent; font:inherit; font-size:12px; padding:4px 10px; border-radius:7px; cursor:pointer; color:var(--mut, #6E6E73); }
.viewseg button.on{ background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.1); font-weight:650; color:#1D1D1F; }
.cardgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:10px; padding:14px 20px 18px; }
.dcard{ background:#fff; border:1px solid var(--line-soft, #E8E8ED); border-radius:12px; padding:12px 14px; cursor:pointer; display:flex; flex-direction:column; gap:6px; transition:box-shadow .12s, transform .1s; }
.dcard:hover{ box-shadow:0 4px 14px rgba(0,0,0,.08); }
.dcard .drow{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.dcard .dhead{ font-weight:700; font-size:14px; }
.dcard .dsub{ font-size:11.5px; color:var(--faint, #98989F); }
.dcard .dnote{ font-size:12px; color:var(--mut, #6E6E73); line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.mapwrap{ position:relative; height:72vh; min-height:420px; }
#bigmap{ position:absolute; inset:0; z-index:1; }
.mapwarn{ position:absolute; top:10px; right:10px; z-index:800; background:#FEF6E7; color:#7A4E07; font-size:12px; font-weight:600; padding:7px 12px; border-radius:9px; box-shadow:0 2px 8px rgba(0,0,0,.15); max-width:260px; }
.maproute{ position:absolute; left:10px; bottom:10px; z-index:800; background:#fff; border-radius:12px; box-shadow:0 4px 16px rgba(0,0,0,.18); padding:12px 14px; max-width:340px; max-height:46vh; overflow:auto; font-size:12.5px; }
.rtnum{ background:#FF9500; color:#fff; border-radius:50%; width:22px; height:22px; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:11px; border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.3); }
</style>
<style>
/* ============================ design tokens ============================ */
/* Apple-language calm: their greys (#F5F5F7 page, #1D1D1F ink), ONE accent
   (the apple.com blue), hairline borders, one radius scale (14 / 10 / pill),
   soft diffuse shadows. No gradients, no second accent. */
:root{
  --color-base-100:#ffffff; --color-base-200:#F5F5F7; --color-base-300:#E8E8ED;
  --color-base-content:#1D1D1F;
  --color-primary:#0071E3; --color-primary-content:#ffffff;
  --color-secondary:#5E5CE6; --color-secondary-content:#ffffff;
  --color-accent:#0E9488; --color-accent-content:#ffffff;
  --color-neutral:#1D1D1F; --color-neutral-content:#ffffff;
  --color-success:#0E9F6E; --color-success-content:#ffffff;
  --color-warning:#C2740B; --color-warning-content:#ffffff;
  --color-error:#DC2626; --color-error-content:#ffffff;
  --color-info:#0071E3; --color-info-content:#ffffff;
  --radius-box:14px; --radius-field:10px; --radius-selector:999px;
  --ink:#1D1D1F; --ink2:#3A3A40; --mut:#6E6E73; --faint:#98989F;
  --line:#E7E7EC; --line-soft:#F0F0F3;
  --tint:#F0F6FF; --tint-line:#D8E7FA;
  --sh-1:0 1px 2px rgba(0,0,0,.04);
  --sh-2:0 1px 2px rgba(0,0,0,.04), 0 8px 24px -10px rgba(0,0,0,.10);
  --sh-3:0 2px 6px rgba(0,0,0,.05), 0 20px 48px -14px rgba(0,0,0,.16);
}
*{ box-sizing:border-box; }
/* App frame: the PAGE never scrolls - the content column scrolls inside
   itself, so the sidebar and tab bar hold still like a native app. */
html,body{ height:100%; max-width:100%; }
body{ overflow:hidden; }
body{ margin:0; background:var(--color-base-200); color:var(--ink); font-size:14.5px; line-height:1.6;
  /* SF on Apple hardware; Inter (the closest open face to SF) everywhere else */
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased; letter-spacing:-.006em; }
h1,h2,h3{ letter-spacing:-.025em; }
.muted{ color:var(--mut); } .faint{ color:var(--faint); }
.err{ color:var(--color-error); font-size:13.5px; }
.msg{ color:var(--color-error); font-size:13.5px; margin-top:10px; min-height:16px; }
#leadmsg{ color:var(--color-success); }
.wfull{ width:100%; }
/* Every table is a surface. Data sitting straight on the grey page had no edge
   and no authority; one rule lifts Pipeline, Leads and Cold outreach too, not
   just the screens added last. Nested tables (inside a panel or a modal) opt
   out so the card does not double up. */
.tblwrap{ overflow:auto; background:#fff; border:0;
  border-radius:var(--radius-box); box-shadow:var(--sh-2);
  /* the TABLE is the scroll surface, not the page: cap tall tables to the
     viewport so the horizontal scrollbar is always in reach (it used to sit
     at the bottom of a 5000px-tall wrapper), scroll both axes inside */
  max-height:max(340px, calc(100dvh - 210px)); overscroll-behavior:contain; }
.mbody .tblwrap{ max-height:none; } /* modals already scroll themselves */
.panel .tblwrap,.mbody .tblwrap{ background:none; border:0; border-radius:0; box-shadow:none; }
.panel.flush .tblwrap{ margin:0; }
/* header rides along while the body scrolls under it */
.tblwrap .table thead th{ position:sticky; top:0; z-index:3; background:var(--color-base-200); }
/* the scrollbars ARE the affordance - keep them visible, not overlay-hidden */
.tblwrap::-webkit-scrollbar{ width:11px; height:11px; }
.tblwrap::-webkit-scrollbar-thumb{ background:#C7C7CC; border-radius:99px; border:3px solid #fff; }
.tblwrap::-webkit-scrollbar-thumb:hover{ background:#A2A2A7; }
.tblwrap::-webkit-scrollbar-corner{ background:transparent; }
.tblwrap>.table thead th{ background:var(--color-base-200); }
.tblwrap>.table thead th:first-child{ border-top-left-radius:var(--radius-box); }
.tblwrap>.table thead th:last-child{ border-top-right-radius:var(--radius-box); }
::selection{ background:#CCE4FF; }

/* =================== shell: sidebar (desktop) + tab bar ================= */
/* The HIG pattern: primary sections live in a left sidebar on wide screens
   and become a bottom tab bar on phones. Selection is a tinted fill, the
   material is translucent, items are icon + label. */
.shell{ display:flex; align-items:stretch; height:100dvh; }
.sidebar{ flex:0 0 230px; overflow-y:auto; z-index:40;
  display:flex; flex-direction:column; padding:16px 12px 14px;
  background:rgba(247,247,249,.88); backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-right:1px solid rgba(0,0,0,.06); }
.sb-brand{ display:flex; align-items:center; gap:10px; font-size:15px; font-weight:700; letter-spacing:-.02em; padding:2px 10px 14px; }
.blogo{ width:30px; height:30px; border-radius:9px; display:inline-flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:700; color:#fff; background:var(--color-primary); flex:none;
  box-shadow:0 1px 3px rgba(0,0,0,.16); }
.sb-nav{ display:flex; flex-direction:column; gap:2px; }
.sidebar .nv{ display:flex; align-items:center; gap:11px; width:100%; text-align:left; border:0; background:transparent;
  font:inherit; font-size:14px; font-weight:500; color:var(--ink2); padding:8px 12px; border-radius:10px; cursor:pointer;
  transition:background .12s,color .12s,transform .1s ease; }
.sidebar .nv i{ font-size:19px; line-height:1; color:var(--mut); transition:color .12s; }
.sidebar .nv:hover{ background:rgba(0,0,0,.05); color:var(--ink); }
.sidebar .nv:active{ transform:scale(.98); }
.sidebar .nv.on{ background:rgba(0,113,227,.11); color:var(--color-primary); font-weight:600; }
.sidebar .nv.on i{ color:var(--color-primary); }
.sb-group{ font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); padding:16px 12px 5px; }
.sb-foot{ margin-top:auto; display:flex; flex-direction:column; gap:8px; padding:12px 4px 0; border-top:1px solid rgba(0,0,0,.06); min-width:0; }
/* everything in the footer wraps or truncates inside the 230px column -
   the freshness note was overflowing onto the nav */
.sb-foot .pill{ text-align:center; white-space:normal; line-height:1.45; font-size:11.5px; overflow-wrap:anywhere; }
.sb-foot .pill:empty{ display:none; }
.sb-foot .select,.sb-foot .btn{ max-width:100%; overflow:hidden; text-overflow:ellipsis; }
.main{ flex:1 1 auto; min-width:0; overflow-y:auto; overscroll-behavior:contain; }
.tabbar{ display:none; }
/* the More sheet: the overflow sections, floating above the tab bar */
.moresheet{ position:fixed; left:10px; right:10px; bottom:calc(66px + env(safe-area-inset-bottom)); z-index:46;
  background:rgba(255,255,255,.96); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border-radius:16px; box-shadow:var(--sh-3); padding:8px; animation:msheet .22s cubic-bezier(.16,1,.3,1) both; }
.moresheet .nv{ display:flex; align-items:center; gap:12px; width:100%; border:0; background:none; font:inherit;
  font-size:15px; font-weight:500; color:var(--ink); padding:12px 14px; border-radius:10px; cursor:pointer; }
.moresheet .nv i{ font-size:20px; line-height:1; color:var(--mut); }
.moresheet .nv.on{ color:var(--color-primary); } .moresheet .nv.on i{ color:var(--color-primary); }
.moresheet .nv:active{ background:var(--color-base-200); }
@media (max-width:900px){
  .sidebar{ display:none; }
  .tabbar{ position:fixed; left:0; right:0; bottom:0; z-index:45; display:flex;
    background:rgba(255,255,255,.85); backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%);
    border-top:1px solid rgba(0,0,0,.08); padding:6px 6px calc(7px + env(safe-area-inset-bottom)); }
  .tabbar .nv{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; border:0; background:none;
    font:inherit; font-size:10.5px; font-weight:600; color:var(--mut); padding:4px 2px; border-radius:10px; cursor:pointer; }
  .tabbar .nv i{ font-size:22px; line-height:1; }
  .tabbar .nv.on{ color:var(--color-primary); }
  .content{ padding-bottom:88px; }
}

/* ================================= page ================================= */
.content{ max-width:1240px; margin:0 auto; padding:26px 24px 60px; }
/* data-dense screens (the leads table) get the whole viewport, not the
   reading-width cap - no horizontal scroll while half the screen sits empty */
.content.wide{ max-width:1760px; }
.page-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin:2px 0 20px; }
.page-head .t{ font-size:29px; font-weight:700; letter-spacing:-.035em; line-height:1.12; }
.page-head .sub,.sub{ font-size:14px; color:var(--mut); }
.page-head .sub{ margin:6px 0 0; max-width:660px; }

/* ================================ panels ================================ */
/* Apple grouped-surface look: borderless white on the grey page, the shadow
   is the edge. Hairlines live INSIDE surfaces, never around them. */
.panel{ background:#fff; border:0; border-radius:var(--radius-box); padding:20px 22px; margin-bottom:18px; box-shadow:var(--sh-1); }
.panel h2{ font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.09em; color:var(--faint); margin:0 0 15px; display:flex; align-items:center; gap:9px; }
.panel.warn{ border-color:#F4C9C9; background:linear-gradient(180deg,#FFF9F9,#fff 70px); }

/* ============================== assistant =============================== */
/* NB: must not be called .hero - daisyUI ships its own .hero component that
   forces every child into a single grid cell, stacking them on top of each other. */
.askhero{ text-align:center; padding:48px 0 10px; }
.askhero .eyebrow{ font-size:12px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--color-primary); margin-bottom:14px; }
.askhero h1{ font-size:40px; font-weight:700; letter-spacing:-.03em; margin:0 0 12px; line-height:1.1; }
.askhero p{ font-size:16px; color:var(--mut); max-width:560px; margin:0 auto 30px; line-height:1.55; }
.askwrap{ max-width:680px; margin:0 auto; position:relative; }
.askwrap::before{ content:""; position:absolute; inset:-18px -18px; border-radius:32px;
  background:radial-gradient(60% 100% at 50% 0%, rgba(0,113,227,.10), transparent 70%); pointer-events:none; }
.askbox{ position:relative; display:flex; gap:9px; align-items:center; background:#fff; border:1.5px solid var(--line);
  border-radius:15px; padding:8px 8px 8px 18px; box-shadow:var(--sh-3); transition:border-color .16s, box-shadow .16s; }
.askbox:focus-within{ border-color:var(--color-primary); box-shadow:0 0 0 4px rgba(0,113,227,.12), var(--sh-3); }
.askbox input{ flex:1; border:0; outline:0; font:inherit; font-size:15.5px; background:transparent; color:var(--ink); min-width:0; padding:9px 0; }
.askbox input::placeholder{ color:var(--faint); }
.askgo{ border:0; border-radius:999px; background:var(--color-primary); color:#fff; font:inherit;
  font-size:14.5px; font-weight:600; padding:11px 22px; cursor:pointer; white-space:nowrap; box-shadow:0 1px 3px rgba(0,0,0,.14); transition:filter .14s, transform .1s ease; }
.askgo:hover{ filter:brightness(1.07); } .askgo:active{ transform:scale(.97); }
.askgo:disabled{ opacity:.55; cursor:default; }
.egs{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:18px; }
.eg{ font-size:12.5px; color:var(--ink2); background:rgba(120,120,128,.10); border:0; border-radius:999px;
  padding:6px 13px; cursor:pointer; transition:background .14s, color .14s, transform .1s ease; }
.eg:hover{ background:rgba(0,113,227,.12); color:var(--color-primary); }

/* the assistant's morning briefing: what's on before you ask anything */
.briefcard{ max-width:680px; margin:0 auto 22px; background:#fff; border-radius:var(--radius-box); box-shadow:var(--sh-1); padding:16px 20px; text-align:left; }
.briefcard h4{ margin:0 0 10px; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); display:flex; align-items:center; gap:8px; }
.briefcard .brow{ display:flex; align-items:baseline; gap:9px; font-size:13.5px; padding:5px 0; border-top:1px solid var(--color-base-200); }
.briefcard .brow:first-of-type{ border-top:0; }
.briefcard .brow .bt{ font-weight:700; font-variant-numeric:tabular-nums; color:#5B21B6; flex:none; }
.briefcard .brow .bl{ color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.briefcard .brow .bh{ color:var(--faint); font-size:12px; margin-left:auto; flex:none; }
.briefcard .brow a.pill{ text-decoration:none; flex:none; margin-left:auto; }
/* the chat itself */
.chatlog{ max-width:680px; margin:0 auto 14px; text-align:left; }
.cmsg{ margin:10px 0; }
.cmsg.user{ display:flex; justify-content:flex-end; }
.cmsg.user span{ background:var(--color-primary); color:#fff; border-radius:16px 16px 4px 16px; padding:9px 15px; font-size:14px; max-width:85%; line-height:1.45; }
.cmsg.ai{ background:#fff; border-radius:14px; box-shadow:var(--sh-1); padding:13px 17px; font-size:14px; line-height:1.55; }
.cmsg.ai .tl{ font-size:11.5px; color:var(--faint); margin-bottom:6px; }
.cmsg.ai .tl i{ margin-right:4px; }
.cmsg.ai p{ margin:0 0 8px; } .cmsg.ai p:last-child{ margin-bottom:0; }
.cmsg.ai ul{ margin:0 0 8px; padding-left:20px; } .cmsg.ai li{ margin:3px 0; }
.actchip{ margin-top:10px; background:#F3EFFB; border-radius:10px; padding:10px 13px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.actchip .as{ font-size:13px; color:#3B1D77; flex:1; min-width:200px; }
.actchip button{ border:0; font:inherit; font-size:12.5px; font-weight:700; padding:6px 13px; border-radius:8px; cursor:pointer; }
.actchip .go{ background:#5B21B6; color:#fff; } .actchip .no{ background:transparent; color:#5B21B6; }
.actchip.done{ background:#E7F8F0; } .actchip.done .as{ color:#0A6B4A; }
.actchip.failed{ background:#FEF2F2; } .actchip.failed .as{ color:#8F1D1D; }

/* thinking state */
.think{ max-width:680px; margin:30px auto 0; background:#fff; border:0; border-radius:var(--radius-box); padding:22px 24px; box-shadow:var(--sh-2); }
.think .row{ display:flex; align-items:center; gap:12px; font-size:14px; color:var(--ink2); }
.think .bar{ height:4px; border-radius:99px; background:var(--color-base-300); margin-top:16px; overflow:hidden; }
.think .bar i{ display:block; height:100%; width:34%; border-radius:99px; background:var(--color-primary);
  animation:slide 1.6s ease-in-out infinite; }
@keyframes slide{ 0%{ margin-left:-34% } 100%{ margin-left:100% } }
.think .steps{ margin-top:14px; font-size:12.5px; color:var(--faint); }
/* Live compile view. 99% of the wait is the web research, so the rep watches
   findings land one at a time rather than a spinner that says nothing. */
.live{ max-width:860px; margin:26px auto 0; }
.livehead{ display:flex; align-items:center; gap:11px; background:#fff; border:0;
  border-radius:var(--radius-box); padding:15px 19px; box-shadow:var(--sh-1); position:sticky; top:8px; z-index:5; }
.livehead .msg{ font-size:14px; font-weight:650; color:var(--ink); }
.livehead .el{ margin-left:auto; font-size:12.5px; color:var(--faint); font-variant-numeric:tabular-nums; }
.rail{ display:flex; gap:7px; flex-wrap:wrap; margin:12px 0 4px; }
.rail span{ font-size:11.5px; font-weight:650; padding:5px 11px; border-radius:999px;
  background:var(--color-base-200); color:var(--faint); }
.rail span.on{ background:#F0F6FF; color:var(--color-primary); }
.rail span.ok{ background:#E7F8F0; color:#0A6B4A; }
.lcard{ background:#fff; border:0; border-radius:var(--radius-box); padding:16px 19px;
  box-shadow:var(--sh-1); margin-top:12px; animation:pop .28s ease both; }
@keyframes pop{ from{ opacity:0; transform:translateY(7px) } to{ opacity:1; transform:none } }
.lcard h4{ margin:0 0 10px; font-size:11.5px; font-weight:700; text-transform:uppercase;
  letter-spacing:.09em; color:var(--faint); display:flex; align-items:center; gap:8px; }
.lcard h4 .t{ margin-left:auto; font-weight:600; letter-spacing:0; text-transform:none; color:var(--faint); }
.lcard p{ margin:0 0 8px; font-size:14px; color:var(--ink2); line-height:1.6; overflow-wrap:anywhere; }
.lcard p:last-child{ margin-bottom:0; }
.feed{ font-size:13px; color:var(--ink2); }
.feed div{ padding:6px 0; border-top:1px solid var(--line); display:flex; gap:9px; align-items:baseline; }
.feed div:first-child{ border-top:0; }
.feed .k{ font-size:10.5px; font-weight:700; letter-spacing:.06em; color:var(--faint); flex:none; width:44px; }
.feed .d{ overflow-wrap:anywhere; }
.miniring{ display:inline-flex; align-items:center; gap:12px; }
.miniring b{ font-size:30px; font-weight:800; letter-spacing:-.04em; line-height:1; }

/* ============================ sales desk ================================ */
.callrow{ padding:14px 20px; border-radius:0; }
.callrow .seg{ font-size:12.5px; color:var(--mut); margin-top:2px; overflow-wrap:anywhere; }
.callrow .rt{ display:flex; align-items:center; gap:8px; margin-left:auto; flex-wrap:wrap; justify-content:flex-end; }
.tel{ font-variant-numeric:tabular-nums; white-space:nowrap; }
.nonum{ font-size:12.5px; color:var(--faint); font-style:italic; white-space:nowrap; }
/* Outcome buttons are tiered: the three that end a call sit first and look
   like decisions; the rest are quieter so the common path is obvious. */
.outrow{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:9px; }
.outrow.sec .chip{ font-weight:600; }
.chip.danger{ color:#8F1D1D; background:rgba(220,38,38,.09); }
.chip.danger:hover{ background:rgba(220,38,38,.16); }
.alertcard{ background:#FEF2F2; border:1px solid #F3C9C9; border-radius:var(--radius-box); padding:16px 19px; margin-bottom:16px; }
.alertcard h4{ margin:0 0 8px; font-size:12px; font-weight:750; text-transform:uppercase; letter-spacing:.07em; color:#8F1D1D; }
.alertcard p{ margin:0 0 6px; font-size:13.5px; color:var(--ink2); line-height:1.55; }
.alertcard p:last-child{ margin-bottom:0; }
.bdot{ width:9px; height:9px; border-radius:50%; flex:none; }
/* Contact reach state - inferred, never entered. */
.tag{ font-size:10.5px; font-weight:750; letter-spacing:.04em; text-transform:uppercase;
  border-radius:999px; padding:4px 9px; white-space:nowrap; }
.tag.done{ background:#E7F8F0; color:#0A6B4A; }
.tag.part{ background:#F0F6FF; color:#0060C7; }
.tag.new{ background:var(--color-base-200); color:var(--faint); }
.repcard.warn{ border-color:#F3C9C9; }
.repcard .rh .rl{ margin-left:auto; font-size:10.5px; font-weight:700; text-transform:uppercase;
  letter-spacing:.06em; color:var(--faint); }
/* A rep works this list on a phone between calls, so a row has to stay one
   thumb-sized line - at full width each row was 154px and only one fitted the
   screen. Segment and the Brief button drop out; tapping the row still opens it. */
@media (max-width:560px){
  .callrow{ padding:10px 6px; gap:10px; flex-wrap:nowrap; }
  .callrow .seg{ display:none; }
  .callrow .co{ flex:1 1 auto; min-width:0; }
  .callrow .co b,.callrow .co .dom{ display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .callrow .rt{ flex:none; gap:6px; }
  .callrow .rt .btn-soft{ display:none; }
  .callrow .tel .pn{ display:none; }
  .callrow{ padding:11px 14px; }
  .callrow .pill,.callrow .waitchip{ display:none; }
  .ring.sm{ --sz:38px; --rw:3.5px; }
  /* 690px of headers sat above the first row. The prose and the stat captions
     are orientation, not work - the list is the work. */
  #view-calllist .page-head .sub{ display:none; }
  #view-calllist .statgrid{ grid-template-columns:repeat(2,1fr); gap:8px; }
  #view-calllist .st{ padding:9px 12px; }
  #view-calllist .st .v{ font-size:20px; margin-top:2px; }
  #view-calllist .st .d{ display:none; }
  #view-calllist .statwrap{ margin-bottom:12px; }
  #view-calllist .controls{ margin-bottom:4px; }
}

/* ============================ research brief ============================ */
.brief{ max-width:1000px; margin:26px auto 0; }
.bhead{ background:#fff; border:0; border-radius:var(--radius-box); padding:24px 26px; box-shadow:var(--sh-2); margin-bottom:16px; }
.bhead .top{ display:flex; gap:22px; align-items:flex-start; flex-wrap:wrap; }
.bhead .nm{ flex:1; min-width:220px; }
.bhead h2{ font-size:25px; font-weight:700; margin:0 0 4px; letter-spacing:-.03em; overflow-wrap:anywhere; }
.bhead .dm{ font-size:13.5px; color:var(--mut); overflow-wrap:anywhere; }
.bhead .hl{ font-size:16px; color:var(--ink2); margin-top:14px; line-height:1.5; }
/* THE score component. One shape for a fit score everywhere in the app - the
   brief, the call list, the lead modal - so a 9 always looks like a 9. Size is
   driven by --sz, everything else scales off it. */
.ring{ --sz:112px; --rw:9px;
  width:var(--sz); height:var(--sz); border-radius:50%; flex:none; display:grid; place-items:center; position:relative;
  background:conic-gradient(var(--rc) calc(var(--pct)*1%), var(--color-base-300) 0); }
.ring::after{ content:""; position:absolute; inset:var(--rw); border-radius:50%; background:#fff; }
/* z-index is load-bearing: ::after is the last child, so without it the white
   inner circle paints over the score and the number is invisible. */
.ring .v{ position:relative; z-index:1; text-align:center; line-height:1; }
.ring .v b{ font-size:calc(var(--sz)*.355); font-weight:800; letter-spacing:-.05em; display:block;
  font-variant-numeric:tabular-nums; }
.ring .v span{ display:block; font-size:10px; color:var(--faint); font-weight:700; margin-top:4px; letter-spacing:.06em; text-transform:uppercase; }
.ring.md{ --sz:66px; --rw:6px; }
.ring.sm{ --sz:44px; --rw:4px; }
.ring.sm .v b,.ring.md .v b{ letter-spacing:-.03em; }

/* ============================== surfaces ================================ */
/* Content sat straight on the grey page background, so nothing read as a
   surface and the data had no authority. Everything substantive now lives on a
   white panel: one card, hairline dividers inside, shadow to lift it off. */
/* .panel already exists above with its own padding - do NOT redefine it, that
   silently removed the padding from every existing panel in the app. This is a
   modifier for a panel whose content runs edge to edge: header, then rows or a
   table with their own inset. */
.panel.flush{ padding:0; overflow:hidden; box-shadow:var(--sh-2); }
.phead{ display:flex; align-items:center; gap:10px; padding:15px 20px 14px; border-bottom:1px solid var(--line-soft); }
.phead h3{ margin:0; font-size:14.5px; font-weight:750; letter-spacing:-.01em; }
.phead .hint{ margin-left:auto; font-size:12.5px; color:var(--faint); font-variant-numeric:tabular-nums; }
.plist>*{ border-top:1px solid var(--line-soft); }
.plist>*:first-child{ border-top:0; }
.panel.flush .table{ width:100%; }
.panel.flush .table thead th{ background:var(--color-base-200); padding:10px 20px; border-bottom:1px solid var(--line); }
.panel.flush .table td{ padding:13px 20px; border-bottom:1px solid var(--line-soft); }
.panel.flush .table tbody tr:last-child td{ border-bottom:0; }
.panel .table tbody tr:last-child td{ border-bottom:0; }

/* fact pills under the company name */
.pillrow{ display:flex; gap:7px; flex-wrap:wrap; margin-top:12px; }
.pill{ font-size:12px; font-weight:650; border-radius:999px; padding:5px 12px; background:var(--color-base-200); color:var(--ink2); white-space:nowrap; }

/* one-line heads-up strip - lighter than the old red block */
.heads{ display:flex; gap:11px; align-items:flex-start; border-radius:14px; padding:13px 16px; margin-bottom:14px; font-size:14px; line-height:1.5; }
.heads.amber{ background:#FFFBEB; border:1px solid #F0DFB0; color:#78500A; }
.heads.green{ background:#F0FDF6; border:1px solid #BCE7D0; color:#0A6B4A; }
.heads.red{ background:#FEF3F2; border:1px solid #F3C7C2; color:#8E1F1F; }
.heads .hi{ flex:none; font-size:15px; line-height:1.35; }
.heads b{ font-weight:750; }

/* the action card - what the rep actually does next */
.action{ background:#fff; border:0; border-radius:var(--radius-box); box-shadow:var(--sh-2); margin-bottom:16px; overflow:hidden; }
.action .ah{ padding:18px 22px 0; }
.action h3{ font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.09em; color:var(--faint); margin:0 0 14px; }
.who{ display:flex; align-items:center; gap:12px; padding:0 22px 16px; flex-wrap:wrap; }
.who .wn{ font-weight:750; font-size:15.5px; }
.who .wt{ font-size:13.5px; color:var(--mut); }
.who .wm{ margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }
.sayblock{ padding:0 22px 18px; }
.saylbl{ font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--faint); margin-bottom:8px; display:flex; align-items:center; gap:10px; }
/* was a dark navy gradient block; the "what next" hint now reads as a calm
   tinted card in the same visual world as everything else */
.nextbar{ background:var(--tint); border-top:1px solid var(--tint-line); color:var(--ink); padding:15px 22px; display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
.nextbar .nl{ font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--color-primary); }
.nextbar .nv{ font-size:16px; font-weight:700; color:var(--ink); }
.nextbar .nd{ font-size:13.5px; color:var(--mut); flex:1 1 260px; min-width:0; line-height:1.45; }

/* accordions - everything that is not needed at a glance */
.acc{ background:#fff; border:0; border-radius:14px; margin-bottom:9px; box-shadow:var(--sh-1); }
.acc>summary{ list-style:none; cursor:pointer; padding:14px 18px; display:flex; align-items:center; gap:10px;
  font-weight:650; font-size:14.5px; border-radius:14px; }
.acc>summary::-webkit-details-marker{ display:none; }
.acc>summary:hover{ background:var(--color-base-200); }
.acc .am{ margin-left:auto; font-size:12.5px; color:var(--faint); font-weight:500; }
.acc .cv{ width:8px; height:8px; border-right:2px solid var(--faint); border-bottom:2px solid var(--faint);
  transform:rotate(45deg); transition:transform .16s; flex:none; margin-left:2px; }
.acc[open]>summary .cv{ transform:rotate(-135deg); }
.acc[open]>summary{ border-radius:14px 14px 0 0; }
.acc .ab{ padding:2px 18px 16px; font-size:14px; color:var(--ink2); line-height:1.6; overflow-wrap:anywhere; }
.acc .ab p{ margin:0 0 10px; } .acc .ab p:last-child{ margin-bottom:0; }
.bandpill{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; border-radius:999px; padding:5px 13px; }
.metaline{ display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--faint); margin-top:16px; padding-top:14px; border-top:1px solid var(--line-soft); }
/* minmax(0,1fr) so an unbreakable URL can't inflate the track's min-content width */
.bgrid{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; margin-bottom:16px; }
@media (max-width:820px){ .bgrid{ grid-template-columns:minmax(0,1fr); } }
.bcard{ background:#fff; border:0; border-radius:var(--radius-box); padding:19px 21px; box-shadow:var(--sh-1); min-width:0; overflow-wrap:anywhere; }
.bcard h3{ font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.09em; color:var(--faint); margin:0 0 12px; }
.bcard p{ margin:0 0 10px; font-size:14px; color:var(--ink2); line-height:1.6; overflow-wrap:anywhere; }
.bcard p:last-child{ margin-bottom:0; }
.alertbar{ border-radius:var(--radius-box); padding:14px 18px; margin-bottom:16px; font-size:14px; display:flex; gap:11px; align-items:flex-start; }
.alertbar.red{ background:#FEF2F2; border:1px solid #F4C9C9; color:#8F1D1D; }
.alertbar.amber{ background:#FFFBEB; border:1px solid #F2DFAE; color:#7A4E07; }
.alertbar.green{ background:#F0FDF6; border:1px solid #BFE8D3; color:#0A6B4A; }
.alertbar b{ font-weight:750; }
.quote{ background:var(--tint); border:0;
  border-radius:12px; padding:15px 18px; font-size:15.5px; line-height:1.55; color:var(--ink); margin:0 0 12px; }
.copybtn{ font-size:11.5px; font-weight:650; color:var(--color-primary); background:transparent; border:0; cursor:pointer; padding:0; }
.tp{ display:flex; gap:11px; padding:11px 0; border-bottom:1px solid var(--line-soft); }
.tp:last-child{ border-bottom:0; } .tp .n{ flex:none; width:21px; height:21px; border-radius:6px; background:var(--color-base-200);
  color:var(--ink2); font-size:11.5px; font-weight:700; display:grid; place-items:center; margin-top:2px; }
.tp .b{ font-size:14px; color:var(--ink); line-height:1.5; } .tp .w{ font-size:12.5px; color:var(--mut); margin-top:3px; line-height:1.5; }
.ccard{ border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:10px; transition:border-color .14s, box-shadow .14s; }
.ccard:hover{ border-color:#BBD6F5; box-shadow:var(--sh-1); }
.ccard .r1{ display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; }
.ccard .nm{ font-weight:700; font-size:14.5px; } .ccard .ti{ font-size:13px; color:var(--mut); }
.ccard .r2{ font-size:12.5px; color:var(--mut); margin-top:5px; display:flex; gap:12px; flex-wrap:wrap; }
.ccard .why{ font-size:13px; color:var(--ink2); margin-top:8px; line-height:1.5; }
.evid{ font-size:13px; color:var(--ink2); padding:8px 0; border-bottom:1px solid var(--line-soft); line-height:1.55; }
.evid:last-child{ border-bottom:0; }
.evid .src{ font-size:11.5px; color:var(--faint); display:block; margin-top:2px; overflow-wrap:anywhere; }
.nextact{ background:var(--tint); border:1px solid var(--tint-line); color:var(--ink); border-radius:var(--radius-box); padding:20px 24px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
.nextact .lbl{ font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--color-primary); }
.nextact .ac{ font-size:19px; font-weight:700; margin-top:3px; }
.nextact .dt{ font-size:14px; color:var(--ink2); margin-top:5px; line-height:1.5; max-width:640px; }

/* ================================ stats ================================= */
.statwrap{ overflow-x:auto; margin-bottom:18px; }
.statgrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
.st{ background:#fff; border:0; border-radius:var(--radius-box); padding:15px 17px; box-shadow:var(--sh-1); }
.st .l{ font-size:12px; font-weight:600; color:var(--mut); }
.st .v{ font-size:27px; font-weight:700; letter-spacing:-.03em; margin-top:5px; font-variant-numeric:tabular-nums; }
.st .d{ font-size:11.5px; color:var(--faint); margin-top:2px; }
.st.alarm .v{ color:var(--color-error); } .st.ok .v{ color:var(--color-success); }

/* =============================== worklist =============================== */
.actrow{ display:flex; align-items:center; gap:13px; padding:12px 8px; border-bottom:1px solid var(--line-soft); flex-wrap:wrap; border-radius:10px; transition:background .12s; }
.actrow:hover{ background:var(--color-base-200); }
.actrow:last-child{ border-bottom:0; }
.actrow .co{ flex:1 1 220px; min-width:180px; }
.actrow .co b{ font-weight:700; overflow-wrap:anywhere; }
.actrow .co .dom{ font-size:12px; color:var(--faint); overflow-wrap:anywhere; }
.waitchip{ font-variant-numeric:tabular-nums; font-size:12px; font-weight:700; color:#9A5B08; background:#FEF6E7; border-radius:999px; padding:4px 11px; white-space:nowrap; }
.repchip{ display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:600; white-space:nowrap; }
.avi{ width:25px; height:25px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:10px; font-weight:800; color:#fff; flex:none; }

/* ============================== rep cards =============================== */
.repgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(238px,1fr)); gap:12px; }
.repcard{ border:1px solid var(--line); border-radius:14px; padding:15px 17px; transition:box-shadow .14s; }
.repcard:hover{ box-shadow:var(--sh-1); }
.repcard .rh{ display:flex; align-items:center; gap:11px; margin-bottom:13px; }
.repcard .rh .avi{ width:36px; height:36px; font-size:13px; }
.repcard .rh b{ font-size:14.5px; } .repcard .rh .la{ font-size:11.5px; color:var(--faint); }
.repmetrics{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; text-align:center; }
.repmetrics .m b{ display:block; font-size:16px; font-weight:800; font-variant-numeric:tabular-nums; }
.repmetrics .m span{ font-size:10.5px; color:var(--faint); }

/* ================================ tables ================================ */
.table{ font-size:13.5px; }
.table thead th{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:700; user-select:none; white-space:nowrap; }
.table thead th[onclick]{ cursor:pointer; }
.table td{ vertical-align:top; }
td.num,th.num{ text-align:right; font-variant-numeric:tabular-nums; }
.company-cell{ font-weight:650; overflow-wrap:anywhere; min-width:140px; }
.crow{ cursor:pointer; } .crow:hover{ background:var(--color-base-200); }

/* =============================== controls =============================== */
.daterow,.controls{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.controls{ margin-bottom:13px; } .controls .input{ flex:1; min-width:170px; }
/* iOS tinted-fill controls: grey fill at rest, blue tint when selected -
   bordered chips are what made the old UI read as old */
.chip,.dchip,.lt{ border:1px solid transparent; background:rgba(120,120,128,.10); border-radius:999px; padding:6px 14px; font-size:12.5px; font-weight:600; cursor:pointer; color:var(--ink2); white-space:nowrap; transition:color .14s,background .14s,transform .1s ease; }
.chip:hover,.dchip:hover,.lt:hover{ background:rgba(120,120,128,.17); }
.chip.active,.dchip.active,.lt.active{ background:rgba(0,113,227,.12); color:var(--color-primary); }
.count{ font-size:12px; color:var(--mut); margin:8px 0; }
.foot{ font-size:11.5px; color:var(--faint); margin-top:12px; line-height:1.9; }
.empty{ text-align:center; padding:30px 12px; color:var(--faint); font-size:13.5px; }
.empty .ei{ font-size:28px; margin-bottom:8px; }

/* ================================= auth ================================= */
.authwrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  background:radial-gradient(70% 60% at 50% 0%, #EAF3FF, var(--color-base-200) 60%); }
.card-auth{ max-width:396px; width:100%; background:#fff; border:0; border-radius:16px; padding:34px; box-shadow:var(--sh-3); text-align:center; }
.card-auth .blogo{ width:46px; height:46px; border-radius:14px; font-size:19px; margin:0 auto 14px; }
.card-auth h2{ margin:0 0 5px; font-size:20px; font-weight:800; }
.card-auth p{ color:var(--mut); font-size:13.5px; margin:0 0 16px; }
.card-auth .input{ margin:9px 0; text-align:left; }
.row{ display:flex; gap:8px; margin-top:13px; justify-content:center; }

/* ================================ modal ================================= */
.modalbg{ position:fixed; inset:0; background:rgba(0,0,0,.32); backdrop-filter:blur(12px) saturate(140%); -webkit-backdrop-filter:blur(12px) saturate(140%); display:none; align-items:flex-start; justify-content:center; z-index:50; padding:34px 14px; overflow:auto; }
.mcard{ background:#fff; border-radius:16px; max-width:790px; width:100%; box-shadow:0 32px 90px rgba(0,0,0,.30); max-height:90vh; display:flex; flex-direction:column; }
.mhead{ display:flex; align-items:center; gap:9px; padding:17px 22px; border-bottom:1px solid var(--line); position:sticky; top:0; background:#fff; border-radius:16px 16px 0 0; z-index:1; }
.mhead b{ font-size:16px; font-weight:700; overflow-wrap:anywhere; }
.mx{ margin-left:auto; cursor:pointer; font-size:23px; color:var(--faint); line-height:1; padding:0 2px; }
.mx:hover{ color:var(--ink); }
.mbody{ padding:18px 22px; overflow:auto; flex:1; min-height:0; }
.mbody .table{ width:100%; table-layout:fixed; }
.mbody .table th,.mbody .table td{ white-space:normal; overflow-wrap:anywhere; }
.msec{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--faint); margin:18px 0 10px; }
/* Lead list: the key numbers ARE the row - big, aligned, tabular */
.lmmets{ display:flex; gap:20px; align-items:center; flex:none; margin-left:14px; }
.lmmets .m{ text-align:right; min-width:54px; }
.lmmets .m b{ display:block; font-size:17px; font-weight:750; color:var(--ink); font-variant-numeric:tabular-nums; line-height:1.15; white-space:nowrap; }
.lmmets .m span{ font-size:9.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--faint); white-space:nowrap; }
.lmmets .m.dim b{ color:var(--faint); font-weight:600; }
@media (max-width:760px){ .lmmets{ margin-left:0; gap:14px; } }
/* Modal rows must never let the right-hand column crash into the text:
   the content column shrinks, the action column keeps its size and wraps. */
.mbody .actrow{ flex-wrap:wrap; }
.mbody .actrow .co{ min-width:0; flex:1 1 220px; }
.mbody .actrow .rt{ flex:0 0 auto; max-width:100%; }
/* Lead profile: fold-away sections. Everything scans from the closed state -
   title, a one-line preview, and a provenance chip saying where it came from. */
/* iOS inset-grouped sections: grey groups on the white sheet, no borders */
.psec{ background:var(--color-base-200); border:0; border-radius:12px; margin:8px 0; }
.psec>summary{ list-style:none; cursor:pointer; display:flex; align-items:center; gap:10px; padding:12px 16px; }
.psec>summary::-webkit-details-marker{ display:none; }
.psec>summary .pt{ font-size:13.5px; font-weight:700; color:var(--ink); white-space:nowrap; }
.psec>summary .pp{ flex:1; min-width:0; font-size:12.5px; color:var(--mut); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.psec>summary .chev{ flex:none; color:var(--faint); font-size:11px; transition:transform .18s ease; }
.psec[open]>summary{ border-bottom:1px solid rgba(0,0,0,.06); }
.psec[open]>summary .chev{ transform:rotate(90deg); }
.psec .pbody{ padding:14px 16px 16px; }
.psec .pbody p{ font-size:13.5px; color:var(--ink2); line-height:1.6; margin:0 0 8px; overflow-wrap:anywhere; }
.psec .pbody p:last-child{ margin-bottom:0; }
/* provenance: a quiet word, not a badge - green = sourced, amber = inferred.
   It must be readable when you look for it and invisible when you don't. */
.pv{ flex:none; font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; white-space:nowrap; background:none; border:0; padding:0; }
.pv.fact{ color:#0A6B4A; }
.pv.inf{ color:#9A7014; }
/* profile tabs: one segmented control, three focused pages */
.mtabs{ display:flex; background:var(--color-base-300); border-radius:10px; padding:2px; margin:14px 0 12px; }
.mtabs button{ flex:1; border:0; background:transparent; font:inherit; font-size:13px; font-weight:600; padding:7px 0; border-radius:8px; cursor:pointer; color:var(--ink2); transition:background .12s,color .12s; }
.mtabs button.on{ background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.12); color:var(--ink); }
.mtab{ display:none; } .mtab.on{ display:block; }
@media (prefers-reduced-motion: reduce){ .psec>summary .chev{ transition:none; } }

/* ============================ threads / calls =========================== */
.thread{ border:1px solid var(--line); border-radius:14px; padding:13px 15px; margin-bottom:12px; }
.tsub{ font-weight:700; font-size:13.5px; margin-bottom:9px; overflow-wrap:anywhere; }
.thread .chat-bubble{ font-size:13px; line-height:1.55; white-space:pre-wrap; overflow-wrap:anywhere; max-width:88%; }
.thread .chat-header{ font-size:10.5px; color:var(--faint); margin-bottom:2px; }
.callcard{ border:1px solid var(--line); border-radius:12px; padding:11px 13px; margin-bottom:10px; }
.cmeta{ font-size:12.5px; color:var(--ink2); overflow-wrap:anywhere; }
.csum{ font-size:13px; margin-top:7px; white-space:pre-wrap; overflow-wrap:anywhere; }
.cstats{ font-size:13px; color:var(--ink2); margin-bottom:11px; overflow-wrap:anywhere; }
.ctr{ margin-top:7px; } .ctr summary{ font-size:12px; color:var(--color-primary); cursor:pointer; font-weight:650; }

async function loadData(isRetry){
  var s=await sb.auth.getSession();
  if(!s.data.session){return login();}
  app.innerHTML='<div class="content">'+spinner()+'</div>';
  var url=DATA_+"?from="+RANGE.from+"&to="+RANGE.to;
  var res;
  // a stalled request must become an error screen, not an eternal spinner -
  // but a one-off network blip gets ONE silent retry first
  var ab=new AbortController(); var abT=setTimeout(function(){ ab.abort(); },25000);
  try{ res=await fetch(url,{headers:{Authorization:"Bearer "+s.data.session.access_token,apikey:KEY_},signal:ab.signal}); }
  catch(e){
    clearTimeout(abT);
    if(!isRetry&&(!e||e.name!=="AbortError")){ dlog("data_fetch_retry",String(e&&e.message||e)); await new Promise(function(r){setTimeout(r,1500);}); return loadData(true); }
    return errScreen(e&&e.name==="AbortError"?"The data service took too long to answer. Check your connection and try again.":"Could not reach the data service.");
  }
  finally{ clearTimeout(abT); }
  if(res.status===401){ await sb.auth.signOut(); return login(); }
  if(res.status===403){ var p=await res.json().catch(function(){return{};}); return pending(p.email||s.data.session.user.email); }
  if(!res.ok){ return errScreen("Server error ("+res.status+")."); }
  var payload=await res.json();
  if(!payload.ok){ return errScreen(payload.error||"Unknown error."); }
  renderDash(payload);
}

async function runDiag(){
  setMsg("Running diagnostics...");
  var out=[];

    var t0=Date.now();
    try{ var r=await Promise.race([fetch(url,opts||{}), new Promise(function(_,rej){setTimeout(function(){rej(new Error("timeout 8s"));},8000);})]);
      out.push(name+": HTTP "+r.status+" in "+(Date.now()-t0)+"ms"); }
    catch(e){ out.push(name+": FAILED ("+String(e&&e.message||e).slice(0,60)+") after "+(Date.now()-t0)+"ms"); }
  }
  await probe("Auth service","https://bbklqpmojvfoqsmxbtfv.supabase.co/auth/v1/health",{headers:{apikey:KEY_}});
  await probe("Data service",URL_+"/rest/v1/",{headers:{apikey:KEY_}});
  await probe("App functions",URL_+"/functions/v1/client-log",{method:"POST",headers:{Authorization:"Bearer "+KEY_,apikey:KEY_,"Content-Type":"application/json"},body:JSON.stringify({sid:DSID,step:"diag_ping"})});
  out.push("Browser: "+(navigator.onLine?"online":"OFFLINE")+" · "+new Date().toTimeString().slice(0,8));
  dlog("diagnostics",out.join(" | "));
  setMsg(out.join(" · "));
}

// tiny markdown: bold, bullets, paragraphs - enough for the model's answers
function fmtMd(t){
  var s=esc(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  var lines=s.split(/\n/), out=[], list=[];
  function flush(){ if(list.length){ out.push('<ul><li>'+list.join('</li><li>')+'</li></ul>'); list=[]; } }
  for(var i=0;i<lines.length;i++){
    var L=lines[i];
    var m=L.match(/^\s*(?:[-•*]|\d+[.)])\s+(.*)$/);
    if(m){ list.push(m[1]); continue; }
    flush();
    if(L.trim()) out.push('<p>'+L+'</p>');
  }
  flush();
  return out.join('');
}
function sendChat(){
  if(AGENT.busy) return;
  var q=(val("askq")||"").trim(); if(!q) return;
  var log=document.getElementById("chatlog"); if(!log) return;
  document.getElementById("askq").value="";
  AGENT.busy=true; var cb=document.getElementById("chatbtn"); if(cb){ cb.disabled=true; cb.textContent="…"; }
  log.insertAdjacentHTML("beforeend",'<div class="cmsg user"><span>'+esc(q)+'</span></div>');
  var n=++AGENT.n;
  log.insertAdjacentHTML("beforeend",'<div class="cmsg ai" id="cm-'+n+'"><div class="tl" id="ct-'+n+'"><span class="loading loading-spinner" style="width:12px;height:12px"></span> thinking&hellip;</div><div id="cb-'+n+'"></div></div>');
  var el=document.getElementById("cm-"+n); if(el) el.scrollIntoView({behavior:"smooth",block:"end"});
  var acc="", toolSeen=[];
  sb.auth.getSession().then(function(s){
    if(!s.data.session){ AGENT.busy=false; return login(); }
    var payload={action:"chat",text:q,session_id:AGENT.session};
    if(window.VIEW_AS) payload.rep_email=window.VIEW_AS;
    fetch(URL_+"/functions/v1/sales-agent",{method:"POST",headers:{Authorization:"Bearer "+s.data.session.access_token,apikey:KEY_,"Content-Type":"application/json"},body:JSON.stringify(payload)})
      .then(function(r){
        var rd=r.body.getReader(), dec=new TextDecoder(), buf="";
        function pump(){ return rd.read().then(function(x){
          if(x.done){ finish(); return; }
          buf+=dec.decode(x.value,{stream:true});
          var lines=buf.split("\n"); buf=lines.pop();
          for(var i=0;i<lines.length;i++){ if(!lines[i].trim()) continue;
            var ev; try{ ev=JSON.parse(lines[i]); }catch(_){ continue; }
            handle(ev);
          }
          return pump();
        }); }
        return pump();
      }).catch(function(){ handle({type:"error",error:"Connection lost - your question may still be running; ask again in a moment."}); finish(); });
  });
  function handle(ev){
    // stickiness decided BEFORE the DOM grows: auto-scroll only when the
    // reader is already at the bottom - never yank someone who scrolled up
    var mn=document.querySelector('.main');
    var stick=!mn||(mn.scrollHeight-mn.scrollTop-mn.clientHeight)<180;
    var tl=document.getElementById("ct-"+n), bd=document.getElementById("cb-"+n);
    if(ev.type==="started"){ AGENT.session=ev.session_id; var nb=document.getElementById("newchatbtn"); if(nb) nb.style.display=""; }
    else if(ev.type==="tool"){
      var nm=TOOLNAMES[ev.name]||ev.name;
      if(toolSeen.indexOf(nm)<0) toolSeen.push(nm);
      if(tl) tl.innerHTML='<span class="loading loading-spinner" style="width:12px;height:12px"></span> '+esc(toolSeen.join(" · "));
    }
    else if(ev.type==="delta"){ acc+=ev.text; if(bd) bd.innerHTML=fmtMd(acc); }
    else if(ev.type==="action"){
      AGENT.acts[ev.id]={kind:ev.kind,params:ev.params};
      var host=document.getElementById("cm-"+n);
      if(host) host.insertAdjacentHTML("beforeend",
        '<div class="actchip" id="act-'+esc(ev.id)+'"><span class="as">'+esc(ev.summary||ev.kind)+'</span>'+
        '<button class="go" onclick="confirmAct(\''+esc(ev.id)+'\')">Confirm</button>'+
        '<button class="no" onclick="dismissAct(\''+esc(ev.id)+'\')">Dismiss</button></div>');
    }
    else if(ev.type==="file"){
      var host3=document.getElementById("cm-"+n);
      if(host3) host3.insertAdjacentHTML("beforeend",
        '<div class="actchip done"><span class="as"><i class="ph ph-file-xls" style="font-size:16px;vertical-align:-3px"></i> '+
        '<a href="'+esc(ev.url)+'" target="_blank" rel="noopener" style="color:inherit;font-weight:700;text-decoration:underline">Download '+esc(ev.filename||"export.xlsx")+'</a>'+
        (ev.rows?' &middot; '+ev.rows+' rows':'')+' &middot; link lasts 7 days</span></div>');
    }
    else if(ev.type==="error"){ if(bd) bd.innerHTML=fmtMd(acc)+ '<p style="color:#8F1D1D">'+esc(ev.error||"Something went wrong.")+'</p>'; }
    else if(ev.type==="done"){ if(tl){ tl.innerHTML=toolSeen.length?('<i class="ph ph-check"></i>'+esc(toolSeen.join(" · "))):""; if(!toolSeen.length) tl.style.display="none"; } }
    var host2=document.getElementById("cm-"+n); if(host2&&stick) host2.scrollIntoView({behavior:"auto",block:"end"});
  }
  function finish(){
    AGENT.busy=false; var b=document.getElementById("chatbtn"); if(b){ b.disabled=false; b.textContent="Ask"; }
    var tl=document.getElementById("ct-"+n);
    if(tl && tl.innerHTML.indexOf("spinner")>-1){ tl.innerHTML=toolSeen.length?('<i class="ph ph-check"></i>'+esc(toolSeen.join(" · "))):""; }
  }
}

// The function replies with NDJSON (one JSON object per line): status lines
// while it works, then a final result line. It cannot be read with r.json() -
// research runs for minutes and the platform kills a connection that sits idle,

function runAsk(){
  if(ASKING) return;
  var q=(val("askq")||"").trim();
  var outEl=document.getElementById("askout");
  if(!q){ outEl.innerHTML='<div class="think"><div class="row">Enter an email, website or company name first.</div></div>'; return; }
  ASKING=true;
  var btn=document.getElementById("askbtn"); if(btn){ btn.disabled=true; btn.textContent="Researching..."; }
  var t0=Date.now(), done=false;
  // Findings are shown as they land. Measured split of a typical run: Cal's own
  // records ~0.2s, Apollo ~0.6s, then the web research is ~99% of the wait -
  // about half of that searching and half writing the brief.
  var LIVE={ status:"Starting research", step:"records", records:null, contacts:null, acts:[], sec:{} };
  outEl.innerHTML='<div class="live">'+
    '<div class="livehead"><span class="loading loading-spinner loading-sm"></span>'+
    '<span class="msg" id="livemsg">Starting research</span><span class="el" id="liveel">0s</span></div>'+
    '<div class="rail" id="liverail"></div><div id="livebody"></div></div>';
  ASKTIMER=setInterval(function(){
    var e=document.getElementById("liveel");
    if(e) e.textContent=Math.round((Date.now()-t0)/1000)+"s";
  },1000);
  var runId=null;
  function say(m){ LIVE.status=m; var e=document.getElementById("livemsg"); if(e) e.textContent=m; paintRail(); }
  function paintRail(){
    var el=document.getElementById("liverail"); if(!el) return;
    var order=["records","apollo","web","write"], names={records:"Cal's records",apollo:"Contacts",web:"Web research",write:"Writing brief"};
    var at=order.indexOf(LIVE.step);
    el.innerHTML=order.map(function(k,i){

  function paint(){
    var el=document.getElementById("livebody"); if(!el) return;

      var bits=[];

      if(r.excluded) bits.push('<p><b style="color:#8F1D1D">On the exclusion list</b></p>');
      if(r.email_count) bits.push('<p>'+r.email_count+' email'+(r.email_count===1?'':'s')+' already exchanged'+(r.threads&&r.threads.length?' &middot; latest: '+esc(String(r.threads[0].subject||"").slice(0,70)):'')+'</p>');
      if(r.prior_ai_verdict&&r.prior_ai_verdict.fit_score!=null) bits.push('<p>Previously scored '+esc(String(r.prior_ai_verdict.fit_score))+'/10'+(r.prior_ai_verdict.segment?' &middot; '+esc(r.prior_ai_verdict.segment):'')+'</p>');
      if(r.in_hubspot) bits.push('<p>In the HubSpot CRM</p>');
      if(r.known_contacts&&r.known_contacts.length) bits.push('<p>'+r.known_contacts.length+' contact'+(r.known_contacts.length===1?'':'s')+' already on file</p>');

    }
    var c=LIVE.contacts;
    if(c&&c.list&&c.list.length){
      h+='<div class="lcard"><h4>Contacts found<span class="t">'+c.at+'s</span></h4>'+
        c.list.slice(0,5).map(function(p){
          return '<p><b>'+esc(p.name)+'</b>'+(p.title?' &middot; '+esc(p.title):'')+(p.city?' <span style="color:var(--faint)">&middot; '+esc(p.city)+'</span>':'')+'</p>';
        }).join("")+'</div>';

        LIVE.acts.map(function(a){

      (co.uk_locations&&co.uk_locations.length?'<p style="color:var(--faint)">'+esc(co.uk_locations.slice(0,6).join(" · "))+'</p>':'')+'</div>';
    var v=LIVE.sec.verdict;

      var col=(BANDCOL[v.band]||BANDCOL["Worth a call"]);
      h+='<div class="lcard"><h4>Verdict<span class="t">'+(v._at||"")+'s</span></h4>'+
        '<div class="miniring"><b style="color:'+col[0]+'">'+esc(String(v.score))+'<span style="font-size:15px;color:var(--faint);font-weight:600">/10</span></b>'+
        '<span class="pill" style="background:'+col[1]+';color:'+col[2]+'">'+esc(v.band)+'</span></div>'+
        (v.headline?'<p style="margin-top:10px">'+esc(v.headline)+'</p>':'')+'</div>';
    }

    if(cv) h+='<div class="lcard"><h4>Our coverage<span class="t">'+(cv._at||"")+'s</span></h4><p><b>'+esc(cv.verdict||"")+'</b>'+(cv.best_area?' &middot; '+esc(cv.best_area):'')+'</p><p>'+esc(cv.detail||"")+'</p></div>';
    el.innerHTML=h;
  }
  function show(result){
    outEl.innerHTML=renderBrief(result.brief,result.meta||{});
    // scroll to the finished brief only if the reader is still near it -
    // never drag them back from wherever they wandered while it researched
    var b=document.querySelector(".brief");
    if(b){ var rc=b.getBoundingClientRect(); if(rc.top<window.innerHeight+300&&rc.bottom>-300) b.scrollIntoView({behavior:"smooth",block:"start"}); }
  }
  // The research is persisted server-side, so a dropped connection never loses
  // a finished brief - poll for it rather than reporting failure.
  function recover(attempt){
    attempt=attempt||0;
    if(!runId||attempt>20){ stopAsk(); outEl.innerHTML=askError("The research did not come back. Try again."); return; }
    say(attempt===0?"Connection dropped - recovering the brief":"Recovering the brief ("+attempt+")");
    sb.from("research_brief").select("status,brief,meta,error").eq("id",runId).maybeSingle().then(function(r){
      var d=r&&r.data;
      if(d&&d.status==="done"&&d.brief){ done=true; stopAsk(); show({brief:d.brief,meta:d.meta||{}}); return; }
      if(d&&d.status==="error"){ done=true; stopAsk(); outEl.innerHTML=askError(d.error||"Research failed."); return; }
      setTimeout(function(){ recover(attempt+1); },3000);
    },function(){ setTimeout(function(){ recover(attempt+1); },3000); });
  }
  function finish(result,errMsg){
    if(done) return;
    if(errMsg){ done=true; stopAsk(); outEl.innerHTML=askError(errMsg); return; }
    if(!result||!result.brief){ recover(0); return; }
    done=true; stopAsk(); show(result);
  }
  sb.auth.getSession().then(function(s){
    if(!s.data.session){ stopAsk(); return login(); }
    return fetch(ASK_,{method:"POST",headers:{Authorization:"Bearer "+s.data.session.access_token,apikey:KEY_,"Content-Type":"application/json"},body:JSON.stringify({query:q})})
      .then(function(r){
        var ct=r.headers.get("content-type")||"";
        // Errors (401/403/400/500) still come back as a single JSON object.
        if(!r.ok || ct.indexOf("ndjson")<0 || !r.body){
          return r.json().then(function(d){
            finish(null,(d&&d.error)||(d&&d.code==="login"?"Your session expired - sign in again.":"Server error ("+r.status+")."));
          },function(){ finish(null,"Server error ("+r.status+")."); });
        }
        var reader=r.body.getReader(), dec=new TextDecoder(), buf="", result=null, errMsg=null;
        function handle(line){
          var o; try{ o=JSON.parse(line); }catch(e){ return; }
          if(o.type==="started") runId=o.id;
          else if(o.type==="status"){ if(o.step) LIVE.step=o.step; say(o.msg); }
          else if(o.type==="partial"){
            if(o.section==="records"){ LIVE.records=o.data||{}; LIVE.records.at=o.at; }
            else if(o.section==="contacts"){ LIVE.contacts={list:o.data||[],at:o.at}; }
            paint();
          }
          else if(o.type==="activity"){
            // Tool-result blocks close with no query text; only show real lookups.
            if(o.detail){ LIVE.acts.push(o); paint(); }
          }
          else if(o.type==="section"){
            var d=o.data; if(d&&typeof d==="object"&&!Array.isArray(d)) d._at=o.at;
            LIVE.sec[o.key]=d; LIVE.step="write"; paint(); paintRail();
          }
          else if(o.type==="result") result=o;
          else if(o.type==="error") errMsg=o.error||"Research failed.";
        }
        function pump(){
          return reader.read().then(function(res){
            if(res.done){
              if(buf.trim()) handle(buf.trim());
              finish(result,errMsg);
              return;
            }
            buf+=dec.decode(res.value,{stream:true});
            var parts=buf.split("\n"); buf=parts.pop();
            for(var i=0;i<parts.length;i++){ var l=parts[i].trim(); if(l) handle(l); }
            return pump();
          });
        }
        return pump();
      });
  }).catch(function(e){
    // A mid-flight network failure is recoverable if the run had already started.
    if(runId && !done){ recover(0); return; }
    finish(null,"Lost connection to the research service. "+String(e&&e.message||"").slice(0,120));
  });
}
function stopAsk(){ ASKING=false; if(ASKTIMER){ clearInterval(ASKTIMER); ASKTIMER=null; } var b=document.getElementById("askbtn"); if(b){ b.disabled=false; b.textContent="Research"; } }
function askError(m){
  var extra = (m&&m.indexOf("ANTHROPIC_API_KEY")>=0)
    ? '<div class="steps" style="margin-top:10px">Add <b>ANTHROPIC_API_KEY</b> in the Supabase dashboard under Edge Functions &rarr; Secrets, then try again.</div>' : '';
  return '<div class="think"><div class="row" style="color:var(--color-error)"><b>'+esc(m||"Something went wrong.")+'</b></div>'+extra+'</div>';
}
var BANDCOL={"Strong fit":["#0E9F6E","#E7F8F0","#0A6B4A"],"Worth a call":["#0071E3","#F0F6FF","#0060C7"],"Marginal":["#C2740B","#FEF6E7","#7A4E07"],"Not a fit":["#98A2B3","#F2F4F8","#5B6577"],"Competitor":["#DC2626","#FEF2F2","#8F1D1D"]};
// A score means the same thing wherever it appears, so it gets the same colour
// and the same shape. Bands mirror BANDCOL so the brief and the list agree.
function scoreBand(s){ s=Number(s); if(!(s>=0)) return "Not a fit";
  return s>=9?"Strong fit":(s>=6?"Worth a call":(s>=3?"Marginal":"Not a fit")); }
function scoreRing(s,size,label){
  var n=Number(s); var ok=(n>=0);
  var col=(BANDCOL[scoreBand(n)]||BANDCOL["Not a fit"])[0];
  return '<div class="ring'+(size?" "+size:"")+'" style="--pct:'+(ok?n*10:0)+';--rc:'+col+'">'+
    '<div class="v"><b>'+(ok?n:"?")+'</b>'+(label?'<span>'+label+'</span>':'')+'</div></div>';
}
function copyLine(btn){
  var box=(btn.closest&&btn.closest(".sayblock"))||btn.parentElement;
  var q=box?box.querySelector(".quote"):null;

}
// Progressive disclosure: only the verdict and the action are shown up front.
function acc(title,meta,bodyHtml,open){

    (meta?'<span class="am">'+esc(meta)+'</span>':'<span class="am"></span>')+'<span class="cv"></span></summary>'+
    '<div class="ab">'+bodyHtml+'</div></details>';

function renderBrief(b,meta){
  if(!b) return askError("Empty result.");
  var v=b.verdict||{}, c=b.company||{}, rel=b.relationship||{}, cov=b.coverage||{}, ap=b.approach||{}, na=b.next_action||{};
  var col=BANDCOL[v.band]||BANDCOL["Marginal"];
  // Belt and braces: the schema pins the score to 0-10, but if a model ever
  // returns a 0-100 style score, rescale rather than clamping everything to 10.
  var raw=Number(v.score)||0;
  var score=Math.max(0,Math.min(10, raw>10?Math.round(raw/10):Math.round(raw)));
  var covCol={"Core territory":"green","Strong":"green","Active":"amber","Thin coverage":"amber","Unknown":"amber"}[cov.verdict]||"amber";

  // ---- 1. Verdict at a glance --------------------------------------------
  var pills='<div class="pillrow">'+
    '<span class="pill" style="background:'+col[1]+';color:'+col[2]+'">'+esc(v.band||"")+'</span>'+
    (v.segment?'<span class="pill">'+esc(v.segment)+'</span>':'')+
    (cov.verdict?'<span class="pill">'+esc(cov.verdict)+(cov.best_area?" · "+esc(cov.best_area):"")+'</span>':'')+
    (c.size_signal?'<span class="pill">'+esc(c.size_signal)+'</span>':'')+
    (v.confidence?'<span class="pill" style="color:var(--mut)">'+esc(v.confidence)+' confidence</span>':'')+
  '</div>';
  var head='<div class="bhead"><div class="top">'+
    scoreRing(score,"","out of 10")+
    '<div class="nm"><h2>'+esc(c.name||meta.resolved_domain||"Unknown company")+'</h2>'+
      '<div class="dm">'+esc(c.domain||meta.resolved_domain||"")+'</div>'+
      pills+
      (v.headline?'<div class="hl">'+esc(v.headline)+'</div>':'')+
    '</div></div>'+
    '<div class="metaline"><span>'+esc(meta.model||"")+'</span><span>'+(meta.web_searches||0)+' web lookups</span><span>'+(meta.apollo_contacts||0)+' Apollo contacts</span><span>'+(meta.seconds||0)+'s</span>'+
      (meta.cal_records_found&&meta.cal_records_found.emails?'<span>'+meta.cal_records_found.emails+' emails on file</span>':'')+'</div>'+
  '</div>';

  // ---- 2. One heads-up line, not a wall of red ---------------------------

    heads='<div class="heads green"><span class="hi">&#10003;</span><div><b>Already a Cal customer.</b> '+esc(rel.summary||"")+'</div></div>';
  } else if(wl.length){
    heads='<div class="heads amber"><span class="hi">&#9888;</span><div><b>Heads up.</b> '+esc(wl[0])+

    ? '<div class="who">'+avatar(top.name)+'<div><div class="wn">'+esc(top.name)+'</div><div class="wt">'+esc(top.title||"")+(top.location?' · '+esc(top.location):'')+'</div></div>'+
      '<div class="wm">'+(top.best_call_window?'<span class="pill">&#9200; '+esc(top.best_call_window)+'</span>':'')+
      (top.email?'<span class="pill">'+esc(top.email)+'</span>':(top.email_status?'<span class="pill" style="color:var(--mut)">email '+esc(top.email_status)+'</span>':''))+'</div></div>'
    : '<div class="who"><div class="wt">No named contact found yet - try the Leads tab to run contact discovery.</div></div>';
  var action='<div class="action">'+
    '<div class="ah"><h3>Your call</h3></div>'+who+
    (ap.opening_line?'<div class="sayblock"><div class="saylbl">Open with <button class="copybtn" onclick="copyLine(this)">Copy</button></div><div class="quote">'+esc(ap.opening_line)+'</div></div>':'')+
    '<div class="nextbar"><div><div class="nl">Next</div><div class="nv">'+esc(na.action||"-")+'</div></div><div class="nd">'+esc(na.detail||"")+'</div></div>'+
  '</div>';

  // ---- 4. Everything else, one click away --------------------------------
  var evHtml=(v.evidence||[]).map(function(e){ return '<div class="evid">'+esc(e.fact)+'<span class="src">'+esc(e.source)+'</span></div>'; }).join("");
  var whyBody='<p>'+esc(v.reasoning||"-")+'</p>'+(evHtml?'<div style="margin-top:12px">'+evHtml+'</div>':'');

  var aboutBody='<p>'+esc(c.what_they_do||"-")+'</p>'+
    ((c.uk_locations||[]).length?'<p class="muted" style="font-size:13px"><b>UK sites:</b> '+(c.uk_locations||[]).map(esc).join(", ")+'</p>':'')+
    '<p class="muted" style="font-size:13px"><b>Coverage:</b> '+esc(cov.detail||"-")+'</p>';

  var tpsBody=(ap.talking_points||[]).map(function(t,i){
    return '<div class="tp"><span class="n">'+(i+1)+'</span><div><div class="b">'+esc(t.point)+'</div>'+(t.why_it_lands?'<div class="w">'+esc(t.why_it_lands)+'</div>':'')+'</div></div>';
  }).join("")+
    (ap.objection?'<p style="margin-top:12px"><b>Expect:</b> '+esc(ap.objection)+'</p>':'')+
    (ap.avoid?'<p class="muted" style="font-size:13px"><b>Don\'t lead with:</b> '+esc(ap.avoid)+'</p>':'');

  var restContacts=(b.contacts||[]).slice(1);
  var contactsBody=restContacts.length
    ? restContacts.map(function(p){
        return '<div class="ccard"><div class="r1"><span class="nm">'+esc(p.name)+'</span><span class="ti">'+esc(p.title)+'</span></div>'+
          '<div class="r2">'+(p.location?'<span>&#128205; '+esc(p.location)+'</span>':'')+

          (p.why_them?'<div class="why">'+esc(p.why_them)+'</div>':'')+'</div>';
      }).join("")
    : "";

  var relBody='<p>'+esc(rel.summary||"-")+'</p>'+
    '<p class="muted" style="font-size:13px">Status: <b>'+esc(rel.status||"-")+'</b></p>'+
    (wl.length?'<div style="margin-top:10px">'+wl.map(function(w){ return '<div class="evid">'+esc(w)+'</div>'; }).join("")+'</div>':"");

  var body=acc("Why "+score+" out of 10", v.confidence?v.confidence+" confidence":"", whyBody)+
    acc("What they do", (c.uk_locations||[]).length?(c.uk_locations||[]).length+" UK sites":"", aboutBody)+
    acc("Talking points", (ap.talking_points||[]).length?(ap.talking_points||[]).length+"":"", tpsBody)+
    acc("Other contacts", restContacts.length?restContacts.length+"":"", contactsBody)+
    acc("Our history with them", rel.status||"", relBody);

  return '<div class="brief">'+head+heads+action+body+'</div>';
}

// a chart week is a holiday week when 3+ of its Mon-Fri sit inside a
// Timetastic absence - blank it rather than let it read as a slump
function dashHolWeeks(weekly,absences){
  return (weekly||[]).map(function(w){
    var mon=new Date(w.wk+'T12:00:00Z'), days=0;
    for(var i=0;i<5;i++){
      var ds=new Date(mon.getTime()+i*864e5).toISOString().slice(0,10);
      if((absences||[]).some(function(a){ return a.start_date<=ds && ds<=a.end_date; })) days++;
    }
    return days>=3;
  });
}
function dashTrend(weekly,hol){
  // last four FULL working weeks vs the four before - the current part-week
  // and holiday weeks are excluded or they always read as a slump
  var w=[];
  (weekly||[]).slice(0,-1).forEach(function(x,i){ if(!hol||!hol[i]) w.push((Number(x.calls)||0)+(Number(x.emails)||0)); });
  if(w.length<8) return null;
  var recent=w.slice(-4).reduce(function(a,b){return a+b;},0);
  var prior=w.slice(-8,-4).reduce(function(a,b){return a+b;},0);
  if(!prior&&!recent) return null;
  var pct=prior?Math.round((recent-prior)/prior*100):100;
  return { recent:recent, prior:prior, pct:pct, up:pct>=0 };
}
function dashChart(weekly,hol){
  var W=640,H=190,padL=34,padR=10,padT=14,padB=26;
  var wks=weekly||[]; if(!wks.length) return '<div class="empty">No activity history yet.</div>';
  hol=hol||[];
  var M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var max=1; wks.forEach(function(x,i){ if(!hol[i]) max=Math.max(max,Number(x.calls)||0,Number(x.emails)||0); });
  var X=function(i){ return padL+(W-padL-padR)*(wks.length>1?i/(wks.length-1):0); };
  var Y=function(v){ return padT+(H-padT-padB)*(1-v/max); };
  var half=(W-padL-padR)/Math.max(1,wks.length-1)/2;
  // shaded 'Holiday' bands over absent weeks (consecutive weeks merge)
  var bands='';
  for(var i=0;i<wks.length;i++){
    if(!hol[i]) continue;
    var j=i; while(j+1<wks.length&&hol[j+1]) j++;
    var x1=Math.max(padL,X(i)-half), x2=Math.min(W-padR,X(j)+half);
    bands+='<rect x="'+x1+'" y="'+padT+'" width="'+(x2-x1)+'" height="'+(H-padT-padB)+'" fill="#F5EFDB" opacity=".55" rx="6"/>'+
      '<text x="'+((x1+x2)/2)+'" y="'+(padT+13)+'" text-anchor="middle" font-size="9.5" font-weight="700" fill="#8A7A3B" letter-spacing=".06em">HOLIDAY</text>';
    i=j;
  }
  // the line breaks around holiday weeks instead of dipping through them
  var line=function(key,col){
    var out='', seg=[];
    var flush=function(){ if(seg.length>1) out+='<polyline points="'+seg.join(' ')+'" fill="none" stroke="'+col+'" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>'; seg=[]; };
    wks.forEach(function(x,i){
      if(hol[i]){ flush(); return; }
      var v=Number(x[key])||0;
      seg.push(X(i)+','+Y(v));
      out+='<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="3.2" fill="'+col+'" stroke="#fff" stroke-width="1.3"><title>'+v+' '+key+' &middot; wk of '+x.wk+'</title></circle>';
    });
    flush();
    return out;
  };
  var grid='',labels='';
  [0,.5,1].forEach(function(f){ var v=Math.round(max*f); var y=Y(v); grid+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="var(--line-soft,#E8E8ED)" stroke-width="1"/>'; labels+='<text x="'+(padL-6)+'" y="'+(y+3.5)+'" text-anchor="end" font-size="10" fill="var(--faint,#98989F)">'+v+'</text>'; });
  wks.forEach(function(x,i){ if(i%2) return; var d=new Date(x.wk); labels+='<text x="'+X(i)+'" y="'+(H-8)+'" text-anchor="middle" font-size="9.5" fill="var(--faint,#98989F)">'+d.getDate()+' '+M[d.getMonth()]+'</text>'; });
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'+bands+grid+labels+line('calls','#0060C7')+line('emails','#0A6B4A')+'</svg>'+
    '<div class="controls" style="gap:14px;padding:2px 0 0"><span class="hint"><span class="bdot" style="background:#0060C7"></span> calls logged</span><span class="hint"><span class="bdot" style="background:#0A6B4A"></span> emails logged</span><span class="hint"><span style="display:inline-block;width:10px;height:10px;background:#F5EFDB;border-radius:3px;vertical-align:-1px"></span> holiday</span><span class="hint" style="margin-left:auto">12 weeks, from HubSpot &middot; if it is not logged, it is not here</span></div>';
}
// unknown caller -> Claude web-search lookup (cached server-side; the fn
// answers pending immediately and we poll until the cached row lands)
function identifyCaller(phone,btn){
  btn.disabled=true; btn.textContent='Searching the web...';
  var tries=0;
  function ask(){
    sb.auth.getSession().then(function(s){
      if(!s.data.session) return login();
      fetch(URL_+"/functions/v1/caller-id",{method:"POST",headers:{Authorization:"Bearer "+s.data.session.access_token,apikey:KEY_,"Content-Type":"application/json"},body:JSON.stringify({phone:phone})})
        .then(function(r){return r.json();}).then(function(r){
          if(r&&r.ok&&!r.pending){
            var wrap=btn.parentElement&&btn.parentElement.parentElement;
            var nameEl=wrap?wrap.querySelector('b'):null;
            if(r.company){ if(nameEl) nameEl.textContent=r.company; btn.outerHTML='<span class="pill" title="'+esc(r.note||'')+'" style="background:#F3EFFB;color:#5B21B6">found via web ('+esc(r.confidence)+')'+(r.url?' &middot; <a href="'+esc(r.url)+'" target="_blank" rel="noopener" style="color:#5B21B6">source</a>':'')+'</span>'; }
            else btn.outerHTML='<span class="hint" title="'+esc(r.note||'')+'">nothing credible found</span>';
            return;
          }
          if(++tries<15){ btn.textContent='Searching the web... '+tries*6+'s'; setTimeout(ask,6000); }
          else { btn.disabled=false; btn.textContent='Identify'; }
        }).catch(function(){ btn.disabled=false; btn.textContent='Identify'; });
    });
  }
  ask();
}

// The dashboard answers three questions, in order: what am I doing, what is
// it producing, how well am I handling it.
function renderDashView(el,r){
  var M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var unret=(r.missed||[]).filter(function(m){ return !m.returned; });

    stat("Calls today",nf(a.calls_today),nf(a.calls_week)+" this week &middot; "+nf(a.calls_month)+" this month")+

    '</div></div>';
  h+='<div class="panel"><div class="phead" style="padding:0 0 8px"><span class="bdot" style="background:#0060C7"></span><h3>Last 12 weeks</h3>'+

    dashChart(r.weekly,hol)+'</div>';

  // ---- 2 · OUTCOME: what it is producing ---------------------------------
  h+=sect('Outcome','what your work is generating &mdash; real Delivery Master numbers'+(r.dm_scope==='team'?' (whole desk &mdash; DM has no jobs under your name yet)':''));

    stat("Quotes won",nf(dm.quotes_won||0),"£"+nf(dm.quote_value_won||0)+" won of "+nf(dm.quotes||0)+" quotes &middot; 90d")+
    stat("Run-rate","£"+nf(r.avg_weekly_rev)+"/wk","from "+nf(r.assessable_count||0)+" steady accounts of "+nf(r.customers_count))+
    stat("New accounts",nf(r.new_count||0),"opened in the last ~10 weeks &middot; details in Accounts")+
    '</div></div>';
  h+='<div class="panel"><div class="phead" style="padding:0 0 8px"><span class="bdot" style="background:#0A6B4A"></span><h3>Revenue &mdash; last 12 weeks</h3><span class="hint">your booked jobs, by week</span></div>'+
    dashRevChart(r.dm_weekly)+'</div>';

  // ---- 3 · PERFORMANCE: how well you are handling it ---------------------
  h+=sect('Performance','how well the calls and emails are being handled');
  h+='<div class="statwrap"><div class="statgrid">'+
    stat("Quote conversion",(dm.conv_pct!=null?dm.conv_pct+"%":"&ndash;"),"£"+nf(dm.quote_value_lost||0)+" of quote value lost &middot; 90d",(dm.conv_pct!=null&&dm.conv_pct<30)?"alarm":"")+
    stat("Missed calls",nf(r.missed_total),(r.has_line?"your line":"whole team")+" &middot; "+r.days+"d &middot; "+r.unreturned+" never called back",r.unreturned?"alarm":"ok")+
    (eq?stat("Personal emails",(100-(eq.near_dup_pct||0))+"%",nf(eq.emails_30d)+" sent &middot; 30d &middot; "+(eq.near_dup_pct||0)+"% near-duplicates",(eq.near_dup_pct||0)>50?"alarm":""):"")+
    stat("Positive intent",nf(r.positive_intent),"leads the AI reads as warm conversations")+
    stat("Cancellations",nf(dm.cancellations||0),"£"+nf(dm.cancel_value||0)+" cancelled value &middot; your customers &middot; 90d",dm.cancellations>50?"alarm":"")+

      }).join(''):'<div class="empty" style="padding:14px">Every missed call has been returned. As it should be.</div>')+'</div></div>';
  }
  el.innerHTML=h;
}

// One day in detail (hourly rhythm + quality verdict) plus 3-week trend
// lines per rep - and every number compared against the rep's own usual

var PULSE_DATA=null, PULSE_DAY=null;
var PULSE_REPS=[]; // computed from whoever actually has activity in the window
// Marcus + Michael work out of Outlook, not Front - we cannot count their
// emails yet, so showing them would misread as "did nothing all day".
// Remove them from here once an outlook-sync lands their mail.
var PULSE_EXCLUDE={"marcus@cal.delivery":1,"michaels@cal.delivery":1};
var CALL_COL="#1D1D1F", MAIL_COL="#0A6B4A";
var PULSE_SPAN=20; // days of history fetched for trends
function loadPulse(){
  var el=document.getElementById("pulseboard"); if(!el) return;
  el.innerHTML=spinner();
  var to=new Date().toISOString().slice(0,10);
  var from=new Date(Date.now()-PULSE_SPAN*864e5).toISOString().slice(0,10);

function pShiftDay(n){
  var d=new Date(PULSE_DAY+"T12:00:00"); d.setDate(d.getDate()+n);
  if(d.getDay()===0) d.setDate(d.getDate()+(n>0?1:-1)); // Sundays are empty
  var iso=d.toISOString().slice(0,10);
  var today=new Date().toISOString().slice(0,10);
  var from=new Date(Date.now()-PULSE_SPAN*864e5).toISOString().slice(0,10);
  if(iso>today||iso<from) return;
  PULSE_DAY=iso; renderPulse();
}
function selPulseDay(iso){ PULSE_DAY=iso; renderPulse(); }
function pMins(ts){ if(!ts) return null; var d=new Date(ts); return d.getHours()*60+d.getMinutes(); }
function pT(ts){ if(!ts) return "&ndash;"; var d=new Date(ts); return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2); }
function pDayLbl(iso){ var d=new Date(iso+"T12:00:00"); return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()]+" "+("0"+d.getDate()).slice(-2)+" "+["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()]; }

// Shared SVG line-chart scaffold. series: [{col,pts:[{d,v,tip}],right}].
function pChart(title, xdays, series, yaxis){
  var W=470,H=170,PL=46,PR=44,PT=16,PB=26;
  var iw=W-PL-PR, ih=H-PT-PB;
  var x=function(i){ return PL + (xdays.length<2?iw/2:i*iw/(xdays.length-1)); };
  var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;max-width:'+W+'px;display:block">';
  // selected-day band
  var si=xdays.indexOf(PULSE_DAY);
  if(si>=0) svg+='<rect x="'+(x(si)-7)+'" y="'+(PT-6)+'" width="14" height="'+(ih+12)+'" rx="5" fill="#F0F6FF"></rect>';
  // y gridlines + labels
  yaxis.ticks.forEach(function(tk){
    var y=PT+ih-(tk.v-yaxis.min)/(yaxis.max-yaxis.min)*ih;
    svg+='<line x1="'+PL+'" x2="'+(W-PR)+'" y1="'+y+'" y2="'+y+'" stroke="#EAEDF3" stroke-width="1"></line>'+
         '<text x="'+(PL-6)+'" y="'+(y+3.5)+'" text-anchor="end" font-size="10" fill="'+(tk.col||"#8A93A6")+'">'+tk.l+'</text>';
  });
  (yaxis.rticks||[]).forEach(function(tk){
    var y=PT+ih-(tk.f)*ih;
    svg+='<text x="'+(W-PR+6)+'" y="'+(y+3.5)+'" text-anchor="start" font-size="10" fill="'+(tk.col||"#8A93A6")+'">'+tk.l+'</text>';
  });
  // x labels
  xdays.forEach(function(d,i){
    if(i%3===0||i===xdays.length-1) svg+='<text x="'+x(i)+'" y="'+(H-8)+'" text-anchor="middle" font-size="9.5" fill="#8A93A6">'+Number(d.slice(8,10))+"/"+Number(d.slice(5,7))+'</text>';
  });
  series.forEach(function(se){
    var path="", pen=false;
    se.pts.forEach(function(pt,i){
      if(pt.v==null){ pen=false; return; }
      var y=PT+ih-(pt.f)*ih;
      path+=(pen?"L":"M")+x(pt.i)+" "+y+" "; pen=true;
    });
    if(path) svg+='<path d="'+path+'" fill="none" stroke="'+se.col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path>';
    se.pts.forEach(function(pt){
      if(pt.v==null) return;
      var y=PT+ih-(pt.f)*ih;
      svg+='<circle cx="'+x(pt.i)+'" cy="'+y+'" r="3.4" fill="'+se.col+'" stroke="#fff" stroke-width="1.4" style="cursor:pointer" onclick="selPulseDay(\''+pt.d+'\')"><title>'+pt.tip+'</title></circle>';
    });
  });
  svg+='</svg>';
  return '<div style="flex:1 1 320px;min-width:300px"><div class="dom" style="font-weight:650;color:#3B4457;margin-bottom:2px">'+title+'</div>'+svg+'</div>';
}

function renderPulse(){
  var el=document.getElementById("pulseboard"); var r=PULSE_DATA; if(!el||!r) return;
  var byRep={}, totals={};
  (r.days||[]).forEach(function(d){
    (byRep[d.email]=byRep[d.email]||{name:d.full_name,rows:{}}).rows[d.day]=d;
    var t=Number(d.calls)+Number(d.emails_front)+Number(d.emails_hs);
    if(t>0) totals[d.email]=(totals[d.email]||0)+t; });
  PULSE_REPS=Object.keys(totals).filter(function(e){return !PULSE_EXCLUDE[e];}).sort(function(a,b){return totals[b]-totals[a];});
  var visitsBy={};
  (r.visits||[]).forEach(function(v){ (visitsBy[v.staff_email+"|"+v.visit_date]=visitsBy[v.staff_email+"|"+v.visit_date]||[]).push(v); });
